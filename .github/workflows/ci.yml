# Forge Legacy CI — AI Road to 10, PL-6 (audit C-I6: "There's no test script and no workflow").
#
# Runs on every push to main (main mirrors build 11) and on every pull request. Free: it never calls a model or
# Supabase and needs no secret. Each step is a command that runs the same way on a laptop from the repo root.
#
#   types   npx tsc --noEmit (after writing expo-env.d.ts, the Expo types file a fresh checkout does not have)
#   lint    eslint on the app files this change touched — the repo does not lint clean as a whole
#           (scripts/ci/lint-changed.mjs says what is skipped and why)
#   tests   every node --test file; only the 4 known failures in scripts/ci/known-failures.json are allowed, by name
#   evals   every eval suite OFFLINE ($0, replaying recordings), then the deploy gate for each function whose
#           deployable file changed
#   RLS     every public table has row security; every SECURITY DEFINER function is closed to public and anon
#           (both also asserted inside the tests step; printed here for the log)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install (exact lock, no install scripts)
        run: npm ci --ignore-scripts

      - name: Expo types file (gitignored, generated by Expo locally)
        run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts

      - name: Types
        run: npx tsc --noEmit

      - name: Pick the base to compare with
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint (changed app files)
        run: node scripts/ci/lint-changed.mjs "${{ steps.base.outputs.ref }}"

      - name: Tests (4 known failures allowed, by name)
        run: node scripts/ci/run-tests.mjs

      # The SCOREBOARD: every suite against its Road-to-10 target (import-corpus is 20/61 against 95% on 11-17 — a real
      # baseline, not a regression). It reports and never turns CI red on its own; the ENFORCEMENT is the next step,
      # which fails any function whose code changed while its suite misses.
      - name: Evals, offline ($0) - scoreboard
        continue-on-error: true
        run: node scripts/evals/run.mjs --suite all

      - name: Deploy gate for changed functions
        run: node scripts/evals/gate.mjs --changed "${{ steps.base.outputs.ref }}"

      - name: Row security on every public table
        run: node scripts/rls-static-check.mjs

      - name: SECURITY DEFINER functions open to public or anon (the test above enforces the allowlist)
        run: node scripts/definer-grants-check.mjs
