# Nightly drift check — AI Road to 10, PL-5, platform gate ③ "deployed code == repo (checked daily)".
#
# Every Edge Function's deployed file is compared with the repo bundle on main (main mirrors build 11) and the result
# is recorded in 0271's ai_drift_checks, which /admin → AI health shows as "Deployed code". $0: Management API reads and
# one SQL call (as postgres, to the postgres-only writer ai_drift_record); no model, no function is invoked.
#
# ⬜ PO: it needs ONE repository secret, SUPABASE_ACCESS_TOKEN (a Supabase personal access token — create one just for
#    this, named e.g. "forge-drift-check", at supabase.com/dashboard/account/tokens; it can be revoked any time). Until
#    it is set the job skips with a notice instead of failing every night. Apply supabase/apply/pending-0271.sql first.
# A run that finds an unexpected difference exits 1, so GitHub marks it red and emails the repo owner.

name: Drift check

on:
  schedule:
    - cron: '17 9 * * *' # 09:17 UTC = 2:17 am Mountain, every night
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - name: No secret yet
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::SUPABASE_ACCESS_TOKEN is not set — the drift check is off until the PO adds it (see this file's header)."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: Install (exact lock, no install scripts)
        if: env.HAS_TOKEN == 'true'
        run: npm ci --ignore-scripts

      - name: Compare every deployed function with main, and record it
        if: env.HAS_TOKEN == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ucqbzoeouvwoyfnnmqoo
        run: node scripts/deploy-ai/drift.mjs --record
