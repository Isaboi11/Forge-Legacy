e":"PT14M","recipeIngredient":["180g (6oz )  chicken breast (, thinly sliced)","1\/2 tsp baking soda \/ bi-carb ((optional, Note 1))","1 tbsp cornflour \/ corn starch","1 1\/2 tbsp light soy sauce (, or all purpose soy(Note 3))","1 tbsp Oyster Sauce ((Note 4))","1 tbsp Chinese Cooking Wine (OR Mirin (Note 5))","1\/2 tsp sesame oil ((optional))","Dash of white pepper ((or black))","3\/4 cup (185 ml)  water","1 1\/2 tbsp vegetable oil ((or other cooking oil))","2  garlic cloves (, finely chopped)","1\/2  onion (, sliced (white, brown, yellow))","5 - 6  stems choy sum ((or other Asian greens))","1  medium carrot","1\/2 cup sliced mushrooms ((shiitake is authentic, but any will do))","1 cup bean sprouts"],"recipeInstructions":[{"@type":"HowToSection","name":"\"Velvet\" Chicken (optional, Note 1)","itemListElement":[{"@type":"HowToStep","text":"Place chicken in a bowl, sprinkle over baking soda. Use your fingers to mix then set aside for 20 minutes, no longer than 30 minutes (can get too tender). Rinse well, pat excess water with paper towels, set aside (see video).","name":"Place chicken in a bowl, sprinkle over baking soda. Use your fingers to mix then set aside for 20 minutes, no longer than 30 minutes (can get too tender). Rinse well, pat excess water with paper towels, set aside (see video).","url":"https:\/\/www.recipetineats.com\/chicken-stir-fry-chop-suey\/#wprm-recipe-24471-step-0-0"}]},{"@type":"HowToSection","name":"Prep Ingredients:","itemListElement":[{"@type":"HowToStep","text":"Sauce: Place cornflour and soy sauce in a bowl. Mix until lump free. Then add remaining Sauce ingredients and stir.","name":"Sauce: Place cornflour and soy sauce in a bowl. Mix until lump free. Then add remaining Sauce ingredients and stir.","url":"https:\/\/www.recipetineats.com\/chicken-stir-fry-chop-suey\/#wprm-recipe-24471-step-1-0"},{"@type":"HowToStep","text":"Chop choy sum: Trim end off choy sum. Then cut into 7cm (3&quot;) pieces. Separate stems from leaves.","name":"Chop choy sum: Trim end off choy sum. Then cut into 7cm (3&quot;) pieces. Separate stems from leaves.","url":"https:\/\/www.recipetineats.com\/chicken-stir-fry-chop-suey\/#wprm-recipe-24471-step-1-1"},{"@type":"HowToStep","text":"Chop carrot - Peel then cut into 3cm (1.3&quot;) pieces. Then slice the pieces thinly.","name":"Chop carrot - Peel then cut into 3cm (1.3&quot;) pieces. Then slice the pieces thinly.","url":"https:\/\/www.recipetineats.com\/chicken-stir-fry-chop-suey\/#wprm-recipe-24471-step-1-2"}]},{"@type":"HowToSection","name":"Stir Fry:","itemListElement":[{"@type":"HowToStep","text":"Heat oil in a wok or skillet over high heat. Add garlic, stir quickly, then add onion, Cook for 1 minute, moving constantly, until onion is starting to wilt.","name":"Heat oil in a wok or skillet over high heat. Add garlic, stir quickly, then add onion, Cook for 1 minute, moving constantly, until onion is starting to wilt.","url":"https:\/\/www.recipetineats.com\/chicken-stir-fry-chop-suey\/#wprm-recipe-24471-step-2-0"},{"@type":"HowToStep","text":"Add chicken, cook for 1 minute until the surface changes from pink to white.","name":"Add chicken, cook for 1 minute until the surface changes from pink to white.","url":"https:\/\/www.recipetineats.com\/chicken-stir-fry-chop-suey\/#wprm-recipe-24471-step-2-1"},{"@type":"HowToStep","text":"Add choy sum stems, carrot and mushrooms. Stir fry for 1 minute.","name":"Add choy sum stems, carrot and mushrooms. Stir fry for 1 minute.","url":"https:\/\/www.recipetineats.com\/chicken-stir-fry-chop-suey\/#wprm-recipe-24471-step-2-2"},{"@type":"HowToStep","text":"Add choy sum leaves, bean sprouts and Sauce. Stir fry for 1 to 2 minutes until the Sauce thickens to a thick syrup consistency. Vegetables should still be tender\/crisp, not soggy and soft.","name":"Add choy sum leaves, bean sprouts and Sauce. Stir fry for 1 to 2 minutes until the Sauce thickens to a thick syrup consistency. Vegetables should still be tender\/crisp, not soggy and soft.","url":"https:\/\/www.recipetineats.com\/chicken-stir-fry-chop-suey\/#wprm-recipe-24471-step-2-3"},{"@type":"HowToStep","text":"Serve immediately with rice (for low carb, low cal option, try Cauliflower Rice!)","name":"Serve immediately with rice (for low carb, low cal option, try Cauliflower Rice!)","url":"https:\/\/www.recipetineats.com\/chicken-stir-fry-chop-suey\/#wprm-recipe-24471-step-2-4"}]}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.94","ratingCount":"138","reviewCount":"14"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This just kids approved! A definite keeper &lt;3","author":{"@type":"Person","name":"Lilith"},"datePublished":"2026-08-29"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Absolutely loved this, will definitely be ma","author":{"@type":"Person","name":"Nicole Stevenson"},"datePublished":"2026-07-09"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I've cooked many of Nagi's recipes and I've loved them all, as all of my family does as well. I can't recommend her recipes highly enough, they are all sooooo delicious.","author":{"@type":"Person","name":"Vivian Erlenwein"},"datePublished":"2026-06-02"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I am going to make this tomorrow, but with Some king prawns in it, Happy Lunar new year.","author":{"@type":"Person","name":"Robert Hudson"},"datePublished":"2026-02-25"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I made this. Doubled sauce ingredients, With 800g Chicken thighs. I cooked first in 2 batches Used 1 cup of chicken stock . Used Broccollini cut up. Carrots, onions capsicum and snowpeas. Husband and daughter devour. Already appearing weekly. Thank you Nagi.","author":{"@type":"Person","name":"Karla"},"datePublished":"2026-01-11"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This is an amazing dish loved by the whole family!! I used broccoli and carrot as my veg and served it with some egg noodles. Will definitely be going on a regular rotation","author":{"@type":"Person","name":"annabel"},"datePublished":"2026-01-08"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Tasted exactly like takeaway! I used chicken thighs and doubled it. After reading the comments, I added 1 extra tablespoon of cornflour which helped thicken it without overcooking the veggies. The  flavour is mild so I'll probably spice it up a bit more next time around. Hubby is recovering from a cold and completely loved &amp; devoured it. Would it be wrong to add pineapple to this? I feel some pineapple would be nice. 😋🍍","author":{"@type":"Person","name":"Sue"},"datePublished":"2025-11-09"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This is absolutely delicious! I made this with different vegetables - snow peas, broccoli, carrot, red capsicum, onion, and bean sprouts. The sauce was amazing. Definitely adding this to the menu. Thanks, Nagi!","author":{"@type":"Person","name":"Susan"},"datePublished":"2025-07-18"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I have to admit that I'm a bit of a snob when it comes to takeaways and would never order a chop suey as it always looks incredibly unappetising but as hubby's a big fan I thought I'd give it a go and my, it did not disappoint! I doubled the quantity but as per other comments, the quantity of water should not be doubled as it will dilute the flavour too much. Thanks Nagi, another brilliant recipe!","author":{"@type":"Person","name":"joelle bruder"},"datePublished":"2025-07-06"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This is the first of Nagi's recipes I've tried, and it was awesome! I didn't velvet the chicken but it was perfectly fine. I added sugar snap peas, carrot, red capsicum, bean sprouts, and onion for a colour hit. And the sauce was oh so good! It was a hit with my partner, too. He said it tasted exactly like the Chinese restaurants. Thank you, Nagi, this was delicious!","author":{"@type":"Person","name":"Susan"},"datePublished":"2025-06-28"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Absolutely delicious. Ive made it a few times now. I increase the chicken to 700g. I found I don't need to increase the sauce amount at all as there is still enough. It's also a really easy recipe. I use fresh shiitake mushrooms and I think they're an important ingredient to not substitute as they add a lovely flavour.","author":{"@type":"Person","name":"Rachel"},"datePublished":"2025-06-25"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Forgot to rate it, definitely 5 stars!","author":{"@type":"Person","name":"Cat"},"datePublished":"2025-06-10"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Hello,\r\nThis was so super delicious!","author":{"@type":"Person","name":"Angela"},"datePublished":"2025-05-06"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I made this tonight and it turned out so good better then expected. It did take me longer to make because I didn't have my veggies readily chopped so they all cooked longer till they came together but I like them well cooked. The only thing when trippling the recipe I found not tripling the water content worked best for me so it didn't dilute the flavour. Plus I went of the colour of nagis video and made sure to stop at a medium brown. This recipe calls for 180g of chicken and 185ml of water and I did my 600g of chicken with 250ml of water. I had the full 600ml ready but I realised it would be too thin and definitely wouldn't have turned into syrup consistency like this one did in under 2mins. So so good. I was impressed. I did use broccolini and green beans instead of Asian greens to ensure I can freeze it.","author":{"@type":"Person","name":"Ena"},"datePublished":"2025-03-08"}],"recipeCategory":["Mains","Stir Fry"],"recipeCuisine":["American Chinese"],"keywords":"Chicken Stir Fry, Chop Suey","nutrition":{"@type":"NutritionInformation","servingSize":"618 g","calories":"298 kcal","carbohydrateContent":"18 g","proteinContent":"25 g","fatContent":"14 g","saturatedFatContent":"9 g","cholesterolContent":"57 mg","sodiumContent":"1112 mg","fiberContent":"4 g","sugarContent":"5 g"},"@id":"https:\/\/www.recipetineats.com\/chicken-stir-fry-chop-suey\/#recipe","isPartOf":{"@id":"https:\/\/www.recipetineats.com\/chicken-stir-fry-chop-suey\/#article"},"mainEntityOfPage":"https:\/\/www.recipetineats.com\/chicken-stir-fry-chop-suey\/"}]}</script>
