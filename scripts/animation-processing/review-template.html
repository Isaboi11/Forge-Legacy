<!doctype html>
<!--
  Template for `animation-review.html`. The three "__…__" literals below are replaced by
  build_review.mjs — edit THIS file, never the generated one, or the next build overwrites you.

  Everything is inline on purpose: the page is opened with a double-click (file://), where an
  external stylesheet or a fetched manifest would be blocked. The only network traffic is the
  clips themselves, from the bucket's public object URLs.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Animation Review — Forge Legacy</title>
<style>
  :root {
    --charcoal900: #0E0E12;
    --charcoal800: #111118;
    --charcoal700: #18181F;
    --charcoal600: #222229;
    --cream: #F0EDE8;
    --gray400: #9E9890;
    --gray600: #666060;
    --bronze400: #C8A97E;
    --bronze600: #765B44;
    --green: #5A9E68;
    --red: #A85252;
    --stage: var(--charcoal900);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;                      /* the whole point: this never scrolls */
    background: var(--charcoal900);
    color: var(--cream);
    font: 15px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Column flex, not grid: the stage is the ONLY thing allowed to grow, and rows come and go
     (#done replaces the review UI) — auto-placed grid rows shift under that, flex children just
     drop out. `flex:1 1 0` + `min-height:0` is what keeps a 720px-tall clip from pushing the
     verdict buttons off the bottom of a short window, where overflow:hidden would eat them. */
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  body > * { flex: 0 0 auto; }

  /* ── progress bar + controls ─────────────────────────────────────────────────────────────── */

  #bar { height: 3px; background: var(--charcoal600); }
  #fill { height: 100%; width: 0; background: var(--bronze400); transition: width .18s ease-out; }

  #head {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px 0;
    font-size: 12px; color: var(--gray400);
  }
  #count { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  #count b { color: var(--cream); font-weight: 600; }
  #tally { display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
  .t-yes b { color: var(--green); } .t-glitch b { color: var(--bronze400); } .t-no b { color: var(--red); }
  .t-note b { color: var(--bronze400); }
  #tally b { font-weight: 600; }
  .spacer { flex: 1; }

  select, .btn {
    background: var(--charcoal700); color: var(--cream);
    border: 1px solid var(--charcoal600); border-radius: 7px;
    padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer;
  }
  select:hover, .btn:hover { border-color: var(--bronze600); }
  .btn:active { background: var(--charcoal600); }

  /* ── title ───────────────────────────────────────────────────────────────────────────────── */

  #title {
    padding: 12px 20px 10px;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(20px, 3.4vh, 32px);
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.15;
  }
  #sub {
    margin-top: 6px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 12px; color: var(--gray400);
  }
  #variant {
    padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--bronze600); color: var(--bronze400);
    text-transform: uppercase; font-size: 10px; letter-spacing: .09em; font-weight: 600;
  }
  #id { color: var(--gray600); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11px; }

  /* ── stage ───────────────────────────────────────────────────────────────────────────────── */

  #stage {
    position: relative;
    flex: 1 1 0; min-height: 0;             /* lets the image shrink instead of pushing buttons off */
    display: flex; align-items: center; justify-content: center;
    background: var(--stage);
    margin: 0 20px;
    border-radius: 12px;
    overflow: hidden;
  }
  #stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

  #status {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--gray600); letter-spacing: .04em;
    pointer-events: none;
  }
  #status.hidden { display: none; }
  #status.error { color: var(--red); }

  #stagebtns { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; opacity: .35; transition: opacity .15s; }
  #stage:hover #stagebtns { opacity: 1; }

  /* ── note ────────────────────────────────────────────────────────────────────────────────────
     Always visible, never focused. A note is orthogonal to the verdict: "yes, but it's the seated
     take and I want the standing one" is a PASS with a re-source request attached, and that has to
     survive as words — no button spells it. Left unfocused so 1/2/3/Y/G/N keep advancing the pass;
     Enter reaches in, Enter or Esc comes back out. */

  #notewrap {
    display: flex; align-items: center; gap: 10px;
    margin: 10px 20px 0;
    padding: 0 12px;
    background: var(--charcoal800);
    border: 1px solid var(--charcoal600);
    border-left: 3px solid var(--charcoal600);
    border-radius: 8px;
    transition: border-color .15s, background .15s;
  }
  #notewrap.has { border-left-color: var(--bronze400); background: var(--charcoal700); }
  #notewrap:focus-within { border-color: var(--bronze600); border-left-color: var(--bronze400); }
  #notewrap label {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--gray600); flex: 0 0 auto;
  }
  #notewrap.has label { color: var(--bronze400); }
  #note {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: none;
    color: var(--cream); font: inherit; font-size: 13px;
    padding: 10px 0;
  }
  #note::placeholder { color: var(--gray600); }
  #note-clear {
    flex: 0 0 auto; background: none; border: 0; cursor: pointer;
    color: var(--gray600); font: inherit; font-size: 16px; line-height: 1; padding: 4px 2px;
    visibility: hidden;
  }
  #notewrap.has #note-clear { visibility: visible; }
  #note-clear:hover { color: var(--red); }

  /* ── verdicts ────────────────────────────────────────────────────────────────────────────── */

  #verdicts {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    padding: 16px 20px 18px;
  }
  .v {
    appearance: none; cursor: pointer;
    border: 1.5px solid var(--charcoal600); border-radius: 12px;
    background: var(--charcoal800); color: var(--cream);
    padding: 14px 10px;
    font: inherit; font-size: clamp(14px, 2vh, 17px); font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: transform .06s, border-color .12s, background .12s;
  }
  .v small { font-weight: 400; font-size: 11px; color: var(--gray600); letter-spacing: .04em; }
  .v:hover { background: var(--charcoal700); }
  .v:active { transform: translateY(1px); }
  .v[data-v="yes"]:hover, .v[data-v="yes"].on { border-color: var(--green); }
  .v[data-v="glitchy"]:hover, .v[data-v="glitchy"].on { border-color: var(--bronze400); }
  .v[data-v="no"]:hover, .v[data-v="no"].on { border-color: var(--red); }
  .v.on { background: var(--charcoal700); }
  .v.on small { color: var(--gray400); }
  .v[data-v="yes"].on { box-shadow: inset 0 0 0 1px var(--green); }
  .v[data-v="glitchy"].on { box-shadow: inset 0 0 0 1px var(--bronze400); }
  .v[data-v="no"].on { box-shadow: inset 0 0 0 1px var(--red); }

  #foot {
    padding: 0 20px 12px;
    display: flex; align-items: center; gap: 14px;
    font-size: 11px; color: var(--gray600);
  }
  kbd {
    font: inherit; font-family: ui-monospace, Consolas, monospace;
    background: var(--charcoal700); border: 1px solid var(--charcoal600);
    border-radius: 4px; padding: 1px 5px; color: var(--gray400);
  }

  /* ── done ────────────────────────────────────────────────────────────────────────────────── */

  #done { display: none; text-align: center; padding: 24px; }
  #done.show { display: block; }
  body.finished #title, body.finished #stage, body.finished #verdicts, body.finished #notewrap { display: none; }
  #done { flex: 1 1 auto; }
  #done h2 { font-size: 24px; margin: 0 0 8px; }
  #done p { color: var(--gray400); margin: 0 0 20px; }
  #done .btn { font-size: 14px; padding: 10px 16px; margin: 0 4px; }
</style>
</head>
<body>

<div id="bar"><div id="fill"></div></div>

<div id="head">
  <span id="count"></span>
  <span id="tally">
    <span class="t-yes">yes <b id="n-yes">0</b></span>
    <span class="t-glitch">glitchy <b id="n-glitchy">0</b></span>
    <span class="t-no">no <b id="n-no">0</b></span>
    <span class="t-note">noted <b id="n-noted">0</b></span>
  </span>
  <span class="spacer"></span>
  <select id="f-variant" title="Which renders to review">
    <option value="all">Male + female</option>
    <option value="m">Male only</option>
    <option value="f">Female only</option>
  </select>
  <select id="f-scope" title="Which clips to queue">
    <option value="all">All clips</option>
    <option value="todo">Unreviewed only</option>
    <option value="flagged">Flagged only (no + glitchy)</option>
    <option value="noted">Noted only</option>
  </select>
  <button class="btn" id="export">Export</button>
</div>

<div id="title">
  <h1 id="name">—</h1>
  <div id="sub"><span id="variant"></span><span id="id"></span><span id="meta"></span></div>
</div>

<div id="stage">
  <div id="status">loading…</div>
  <div id="stagebtns">
    <button class="btn" id="replay" title="Replay from the first frame (Space)">↺ replay</button>
    <button class="btn" id="bg" title="Cycle the backdrop — magenta exposes stray transparency (B)">backdrop</button>
  </div>
</div>

<div id="notewrap">
  <label for="note">Note</label>
  <input id="note" list="note-history" autocomplete="off" spellcheck="false"
         placeholder="press Enter to note something — e.g. seated take, want the standing one" />
  <datalist id="note-history"></datalist>
  <button id="note-clear" title="Delete this note">×</button>
</div>

<div id="verdicts">
  <button class="v" data-v="yes">Yes<small>1 · Y</small></button>
  <button class="v" data-v="glitchy">Yes, but glitchy<small>2 · G</small></button>
  <button class="v" data-v="no">No<small>3 · N</small></button>
</div>

<div id="done">
  <h2>Queue complete</h2>
  <p id="done-sub"></p>
  <button class="btn" id="done-export">Export results</button>
  <button class="btn" id="done-flagged">Copy flagged list</button>
  <button class="btn" id="done-restart">Review flagged again</button>
</div>

<div id="foot">
  <span><kbd>1</kbd>/<kbd>Y</kbd> yes · <kbd>2</kbd>/<kbd>G</kbd> glitchy · <kbd>3</kbd>/<kbd>N</kbd> no</span>
  <span><kbd>Enter</kbd> note · <kbd>←</kbd> back · <kbd>→</kbd> skip · <kbd>Space</kbd> replay · <kbd>B</kbd> backdrop</span>
  <span class="spacer"></span>
  <span id="storage-note"></span>
  <span id="built"></span>
</div>

<script>
(() => {
  'use strict';

  const SUPABASE_URL = "__SUPABASE_URL__";
  const BUILT_AT = "__BUILT_AT__";
  const ROWS = "__ROWS__";     // [{ i: id, n: name, m: "Equipment · Pattern", v: "mf" }]

  const STORE_KEY = 'forge-animation-review-v1';
  const VERDICTS = ['yes', 'glitchy', 'no'];

  /* ── the record ─────────────────────────────────────────────────────────────────────────────
     Keyed by "<variant>/<id>", never by queue position, so re-generating the page after another
     upload batch keeps every verdict already given. */

  let memoryOnly = false;
  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    } catch (e) {
      memoryOnly = true;
      return {};
    }
  }
  const results = load();
  function save() {
    if (memoryOnly) return;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(results));
    } catch (e) {
      memoryOnly = true;
      storageNote();
    }
  }
  function storageNote() {
    document.getElementById('storage-note').textContent = memoryOnly
      ? '⚠ progress is NOT being saved — serve this over http:// instead of opening the file'
      : '';
  }

  /* ── the queue ─────────────────────────────────────────────────────────────────────────────
     One entry per CLIP, not per exercise: a male render can be perfect while the female one is
     mismatched, and each needs its own verdict. Variants of one exercise stay adjacent so the
     second is judged with the first still fresh. */

  const ALL = [];
  for (const r of ROWS) {
    for (const v of r.v) ALL.push({ key: (v === 'm' ? 'male' : 'female') + '/' + r.i, id: r.i, name: r.n, meta: r.m, variant: v === 'm' ? 'male' : 'female' });
  }

  const url = (c) => `${SUPABASE_URL}/storage/v1/object/public/exercise-media/${c.variant}/${c.id}.webp`;

  let queue = [];
  let at = 0;

  function buildQueue(jumpToFirstTodo) {
    const fv = document.getElementById('f-variant').value;
    const fs = document.getElementById('f-scope').value;
    const here = queue[at]?.key;
    queue = ALL.filter((c) => {
      if (fv !== 'all' && c.variant !== (fv === 'm' ? 'male' : 'female')) return false;
      const v = results[c.key]?.verdict;
      if (fs === 'todo' && v) return false;
      if (fs === 'flagged' && v !== 'no' && v !== 'glitchy') return false;
      // Deliberately its own scope rather than folded into "flagged": the whole point of a note is
      // that it survives a "yes", so a noted clip must be reachable without being a rejection.
      if (fs === 'noted' && !results[c.key]?.note) return false;
      return true;
    });
    // Hold position if the clip we were on survived the filter; otherwise resume at the first
    // one still lacking a verdict — reopening the page should not restart the pass.
    const held = here ? queue.findIndex((c) => c.key === here) : -1;
    // A note alone creates a record, so resume on the first missing VERDICT, not the first missing
    // record — otherwise noting a clip would make the pass skip past it.
    at = held >= 0 && !jumpToFirstTodo ? held : Math.max(0, queue.findIndex((c) => !results[c.key]?.verdict));
    if (at === -1 || (jumpToFirstTodo && queue.every((c) => results[c.key]?.verdict))) at = 0;
    render();
  }

  /* ── rendering ─────────────────────────────────────────────────────────────────────────────
     A fresh <img> per clip. Reassigning .src on an existing element does not reliably restart an
     animated WebP; replacing the node does, and a preloaded clip is a cache hit either way. */

  const stage = document.getElementById('stage');
  const status = document.getElementById('status');
  let img = null;

  function paint(clip) {
    if (img) img.remove();
    img = new Image();
    img.alt = clip.name;
    status.className = '';
    status.textContent = 'loading…';
    img.onload = () => { status.className = 'hidden'; };
    img.onerror = () => { status.className = 'error'; status.textContent = 'this clip failed to load'; };
    img.src = url(clip);
    stage.insertBefore(img, status);
    if (img.complete && img.naturalWidth) status.className = 'hidden';
  }

  // Each clip is 1–2 MB; without a read-ahead every advance would stall on the download.
  const warm = [];
  function preload(from) {
    for (let i = from; i < Math.min(from + 4, queue.length); i++) {
      const im = new Image();
      im.src = url(queue[i]);
      warm.push(im);
    }
    if (warm.length > 24) warm.splice(0, warm.length - 24);
  }

  function render() {
    const finished = queue.length === 0 || at >= queue.length;
    document.body.classList.toggle('finished', finished);
    document.getElementById('done').classList.toggle('show', finished);

    const reviewed = ALL.filter((c) => results[c.key]?.verdict).length;
    for (const v of VERDICTS) {
      document.getElementById('n-' + v).textContent = ALL.filter((c) => results[c.key]?.verdict === v).length;
    }
    document.getElementById('n-noted').textContent = ALL.filter((c) => results[c.key]?.note).length;
    document.getElementById('fill').style.width = (reviewed / ALL.length * 100) + '%';

    if (finished) {
      document.getElementById('count').innerHTML = `<b>${reviewed}</b> / ${ALL.length} clips reviewed`;
      const flagged = ALL.filter((c) => ['no', 'glitchy'].includes(results[c.key]?.verdict)).length;
      const noted = ALL.filter((c) => results[c.key]?.note).length;
      document.getElementById('done-sub').textContent = queue.length === 0
        ? 'Nothing matches the current filter.'
        : `${flagged} clip${flagged === 1 ? '' : 's'} flagged · ${noted} with a note.`;
      return;
    }

    const clip = queue[at];
    document.getElementById('count').innerHTML = `<b>${at + 1}</b> / ${queue.length} in queue &nbsp;·&nbsp; ${reviewed} / ${ALL.length} reviewed`;
    document.getElementById('name').textContent = clip.name;
    document.getElementById('variant').textContent = clip.variant;
    document.getElementById('id').textContent = clip.id;
    document.getElementById('meta').textContent = clip.meta || '';

    const given = results[clip.key]?.verdict;
    for (const b of document.querySelectorAll('.v')) b.classList.toggle('on', b.dataset.v === given);

    showNote(clip);
    paint(clip);
    preload(at + 1);
  }

  /* ── verdicts ──────────────────────────────────────────────────────────────────────────── */

  function entry(clip) {
    return (results[clip.key] ||= { name: clip.name });
  }

  function record(verdict) {
    const clip = queue[at];
    if (!clip) return;
    const e = entry(clip);
    e.verdict = verdict;
    e.at = new Date().toISOString();
    save();
    note.blur();                     // typing resumes as shortcuts on the next clip
    at++;
    render();
  }

  for (const b of document.querySelectorAll('.v')) b.addEventListener('click', () => record(b.dataset.v));

  /* ── notes ─────────────────────────────────────────────────────────────────────────────────
     Saved as you type (debounced) so a note is never lost to an advance, a filter change, or a
     closed tab mid-sentence. */

  const note = document.getElementById('note');
  const notewrap = document.getElementById('notewrap');
  let noteTimer = null;

  function showNote(clip) {
    if (document.activeElement !== note) note.value = results[clip.key]?.note || '';
    notewrap.classList.toggle('has', !!note.value.trim());
  }

  function commitNote() {
    const clip = queue[at];
    if (!clip) return;
    const text = note.value.trim();
    const e = entry(clip);
    if (text) e.note = text;
    else delete e.note;
    // A record that ended up holding nothing at all should not linger as a phantom "reviewed".
    if (!e.verdict && !e.note) delete results[clip.key];
    notewrap.classList.toggle('has', !!text);
    save();
    refreshHistory();
    render_counts();
  }

  note.addEventListener('input', () => {
    notewrap.classList.toggle('has', !!note.value.trim());
    clearTimeout(noteTimer);
    noteTimer = setTimeout(commitNote, 300);
  });
  note.addEventListener('blur', () => { clearTimeout(noteTimer); commitNote(); });
  note.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); note.blur(); }
  });
  document.getElementById('note-clear').addEventListener('click', () => {
    note.value = '';
    commitNote();
  });

  /** The same note recurs across dozens of clips ("seated take, want standing") — offer it back. */
  function refreshHistory() {
    const seen = [...new Set(Object.values(results).map((r) => r.note).filter(Boolean))].sort();
    document.getElementById('note-history').innerHTML = seen.map((s) => `<option value="${s.replace(/"/g, '&quot;')}">`).join('');
  }

  /** Counters only — commitNote must not repaint the clip and restart the animation mid-typing. */
  function render_counts() {
    for (const v of VERDICTS) {
      document.getElementById('n-' + v).textContent = ALL.filter((c) => results[c.key]?.verdict === v).length;
    }
    document.getElementById('n-noted').textContent = ALL.filter((c) => results[c.key]?.note).length;
  }

  document.getElementById('replay').addEventListener('click', () => queue[at] && paint(queue[at]));

  const BACKDROPS = ['#0E0E12', '#FF00FF', '#F0EDE8', '#6B6B78'];
  let bgAt = 0;
  function cycleBg() {
    bgAt = (bgAt + 1) % BACKDROPS.length;
    document.documentElement.style.setProperty('--stage', BACKDROPS[bgAt]);
  }
  document.getElementById('bg').addEventListener('click', cycleBg);

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || '')) return;
    const k = e.key.toLowerCase();
    if (k === '1' || k === 'y') { record('yes'); }
    else if (k === '2' || k === 'g') { record('glitchy'); }
    else if (k === '3' || k === 'n') { record('no'); }
    else if (k === 'arrowleft' || k === 'backspace') { at = Math.max(0, at - 1); render(); }
    else if (k === 'arrowright') { at = Math.min(queue.length, at + 1); render(); }
    else if (k === 'enter') { note.focus(); note.setSelectionRange(note.value.length, note.value.length); }
    else if (k === ' ') { if (queue[at]) paint(queue[at]); }
    else if (k === 'b') { cycleBg(); }
    else return;
    e.preventDefault();
  });

  for (const id of ['f-variant', 'f-scope']) {
    document.getElementById(id).addEventListener('change', () => buildQueue(true));
  }

  /* ── export ────────────────────────────────────────────────────────────────────────────── */

  function download(name, text, mime) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;

  function exportAll() {
    const csv = ['exercise_id,name,variant,verdict,note,reviewed_at'];
    for (const c of ALL) {
      const r = results[c.key];
      if (!r) continue;
      csv.push([c.id, q(c.name), c.variant, r.verdict || '', q(r.note), r.at || ''].join(','));
    }
    download('animation-review.csv', csv.join('\n'), 'text/csv');
  }
  document.getElementById('export').addEventListener('click', exportAll);
  document.getElementById('done-export').addEventListener('click', exportAll);

  document.getElementById('done-flagged').addEventListener('click', async () => {
    // Anything needing action: a rejection, a glitch, OR a pass carrying a note.
    const lines = ALL
      .filter((c) => ['no', 'glitchy'].includes(results[c.key]?.verdict) || results[c.key]?.note)
      .map((c) => {
        const r = results[c.key];
        return `- ${c.id} (${c.variant}) — ${r.verdict || 'no verdict'} — ${c.name}${r.note ? ` — NOTE: ${r.note}` : ''}`;
      });
    const text = lines.length ? lines.join('\n') : 'Nothing flagged.';
    try {
      await navigator.clipboard.writeText(text);
      document.getElementById('done-flagged').textContent = `Copied ${lines.length}`;
    } catch (e) {
      download('animation-flagged.txt', text, 'text/plain');
    }
  });

  document.getElementById('done-restart').addEventListener('click', () => {
    document.getElementById('f-scope').value = 'flagged';
    buildQueue(true);
  });

  /* ── go ────────────────────────────────────────────────────────────────────────────────── */

  document.getElementById('built').textContent = `bucket listed ${BUILT_AT}`;
  storageNote();
  refreshHistory();
  buildQueue(true);
})();
</script>
</body>
</html>
