      const nearlyFull = cap ? (!isFull && spotsLeft <= 5) : false;
      const effectiveApproval = !isOpen || isFull;
      const openDetail = () => { try { window.localStorage.setItem('forge.preview.squad', s.id); } catch (e) {} window.location.href = 'Squad%20Preview.dc.html'; };
      const goPreview = () => { window.location.href = 'Squad%20Preview.dc.html'; };
      let btnStyle, btnLabel, btnIcon, action;
      if (state === 'joined') {
        btnStyle = btnDone; btnLabel = 'Joined'; btnIcon = checkIcon;
        action = (e) => { if (e && e.stopPropagation) e.stopPropagation(); openDetail(); };
      } else if (state === 'requested') {
        btnStyle = btnDone; btnLabel = 'Request Sent'; btnIcon = checkIcon;
        action = (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState(st => { const m = Object.assign({}, st.membership); delete m[s.id]; return { membership: m }; }); this._toast('Request to ' + s.name + ' withdrawn', 'bronze'); };
      } else if (!effectiveApproval) {
        btnStyle = btnJoin; btnLabel = 'Join Squad'; btnIcon = plusIcon;
        action = (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState(st => ({ membership: Object.assign({}, st.membership, { [s.id]: 'joined' }) })); this._toast('You joined ' + s.name, 'positive'); };
      } else {
        btnStyle = btnRequest; btnLabel = 'Request to Join'; btnIcon = plusIcon;
        action = (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState(st => ({ membership: Object.assign({}, st.membership, { [s.id]: 'requested' }) })); this._toast('Request sent to ' + s.name, 'bronze'); };
      }
      const capTag = Object.assign({}, tagBase, { background: 'var(--fl-charcoal-800)', border: '1px solid var(--fl-charcoal-600)', color: 'var(--fl-text-tertiary)' });
      const nearTag = Object.assign({}, tagBase, { background: 'var(--fl-bronze-tint)', border: '1px solid var(--fl-bronze-border-subtle)', color: 'var(--fl-bronze-bright)' });
      const tagStyle = isFull ? capTag : (nearlyFull ? nearTag : (isOpen ? tagOpen : tagApproval));
      const tagLabel = isFull ? 'Full' : (nearlyFull ? (spotsLeft + ' left') : (isOpen ? 'Open' : 'Approval'));
      const tagIcon = isFull ? usersGlyph : (nearlyFull ? usersGlyph : (isOpen ? globeIcon : lockIcon));
      return {
        key: s.id, name: s.name, motto: s.motto,
        crest: h('span', { style: { display: 'inline-flex' } }, ic(s.crest, 26, 1.6)),
        mostActive: s.id === mostActiveId, sparkIcon: sparkIcon,
        tagStyle: tagStyle,
        tagIcon: h('span', { style: { display: 'inline-flex' } }, tagIcon),
        tagLabel: tagLabel,
        stats: [
          { key: 'm', icon: h('span', { style: { display: 'inline-flex' } }, ic('squad', 14, 1.8)), text: s.members + ' members' },
          { key: 't', icon: h('span', { style: { display: 'inline-flex' } }, ic('flame', 13, 1.8)), text: s.today + ' training today' },
        ],
        openDetail: (state === 'joined') ? openDetail : goPreview,
        btnStyle: btnStyle, btnLabel: btnLabel, btnIcon: h('span', { style: { display: 'inline-flex' } }, btnIcon), action: action,
      };
    });

    const n = filtered.length;
    const toastColor = S.toastTone === 'positive' ? '#6E8E74' : 'var(--fl-icon-bronze)';
    const searching = q.length > 0;
    const emptyTitle = searching ? 'No squads found' : 'No squads in this category';
    const emptyText = searching ? 'Try another search or category.' : 'Check back later, or forge one yourself.';

    return {
      ready: true, notReady: false,
      searchIcon: searchIcon, query: S.query, onSearch: (e) => this.setState({ query: e.target.value }),
      filters: filters,
      resultsLabel: S.category === 'All' ? 'Public Squads' : S.category,
      resultsCount: n + (n === 1 ? ' squad' : ' squads'),
      showSkeleton: S.loading, showResults: !S.loading && n > 0, isEmpty: !S.loading && n === 0, squads: squads,
      skeletons: [{ key: 'k1' }, { key: 'k2' }, { key: 'k3' }],

      emptyIcon: h('span', { style: { display: 'inline-flex' } }, ic('squad', 30, 1.6)),
      emptyTitle: emptyTitle, emptyText: emptyText,
      createGlyph: h('span', { style: { display: 'inline-flex' } }, plusIcon),
      goCreate: () => { window.location.href = 'Create%20Squad.dc.html'; },

      goBack: () => { (function(){try{return !!document.referrer&&new URL(document.referrer).origin===window.location.origin;}catch(e){return false;}})() ? window.history.back() : (window.location.href = 'Squads%20Hub.dc.html'); },
      toastOpen: !!S.toastMsg, toastMsg: S.toastMsg || '', toastIcon: ic('squad', 18, 1.7), toastIconColor: toastColor,
    };
  }
}
</script>
</body>
</html>
