<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/tokens/foundation.css">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#050607; color: var(--fl-text-primary); font-family: var(--fl-font-sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--fl-bronze-primary); text-decoration: none; }
  a:hover { color: var(--fl-bronze-bright); }
  .cm-scroll::-webkit-scrollbar { width:0; height:0; }
  .cm-scroll { scrollbar-width: none; }
  .cm-in { width:100%; font-family:var(--fl-font-sans); font-size:14px; line-height:1.5; color:var(--fl-text-primary); background:var(--fl-charcoal-900); border:1px solid var(--fl-charcoal-600); border-radius:var(--fl-radius-pill); padding:11px 15px; outline:none; resize:none; }
  .cm-in:focus { border-color:var(--fl-bronze-border); }
  .cm-in::placeholder { color:var(--fl-text-tertiary); }
  @keyframes cmIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
</style>
</helmet>

<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0B0F13"></rect><path d="M24 32h52a5 5 0 0 1 5 5v26a5 5 0 0 1-5 5H45L30 79V68h-6a5 5 0 0 1-5-5V37a5 5 0 0 1 5-5z" fill="none" stroke="#BF8F4F" stroke-width="3.5" stroke-linejoin="round"></path><g fill="#CDA063"><circle cx="38" cy="50" r="3.5"></circle><circle cx="50" cy="50" r="3.5"></circle><circle cx="62" cy="50" r="3.5"></circle></g></svg></template>
<div style="min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:28px; background:radial-gradient(circle at 50% 0%, #101418 0%, #050607 62%);">
<div data-screen-label="Client · Messages" style="width:402px; flex:none; height:874px; position:relative; display:flex; flex-direction:column; border-radius:42px; overflow:hidden; border:1px solid var(--fl-charcoal-600); background:linear-gradient(180deg, #0B0F13 0%, var(--fl-charcoal-900) 46%, #05080A 100%); box-shadow:var(--fl-shadow-ambient);">

  <div style="flex:none; display:flex; align-items:center; padding:14px 26px 6px;">
    <span style="flex:1; font-family:var(--fl-font-mono); font-size:13px; font-weight:600; color:var(--fl-text-primary);">9:41</span>
    <span style="flex:none; display:flex; align-items:center; gap:5px; color:var(--fl-text-primary);">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"></rect><rect x="4.5" y="5" width="3" height="6" rx="1"></rect><rect x="9" y="2.5" width="3" height="8.5" rx="1"></rect><rect x="13.5" y="0" width="3" height="11" rx="1"></rect></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="19" height="10" rx="3" stroke="currentColor" opacity="0.5"></rect><rect x="2" y="2" width="14" height="7" rx="1.6" fill="currentColor"></rect><path d="M21.5 4v3a2 2 0 0 0 0-3z" fill="currentColor" opacity="0.5"></path></svg>
    </span>
  </div>

  <div style="flex:none; display:flex; align-items:center; gap:12px; padding:8px 18px 14px; border-bottom:1px solid var(--fl-charcoal-700);">
    <span role="button" tabindex="0" style="width:34px; height:34px; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--fl-radius-round); border:1px solid var(--fl-charcoal-600); background:var(--fl-surface-recessed); color:var(--fl-text-secondary); cursor:pointer;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></span>
    <span style="width:40px; height:40px; flex:none; border-radius:50%; background:radial-gradient(circle at 44% 34%, #45392a, #17130e); border:1px solid var(--fl-bronze-border-subtle); display:flex; align-items:center; justify-content:center; font-family:var(--fl-font-display); font-size:15px; font-weight:600; color:var(--fl-bronze-bright);">RH</span>
    <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
      <span style="font-family:var(--fl-font-display); font-size:17px; font-weight:600; letter-spacing:-0.2px; line-height:1.1; color:var(--fl-text-primary);">Ray Holt</span>
      <span style="font-size:11px; color:var(--fl-text-tertiary);">Your coach · replies most days</span>
    </span>
  </div>

  <div class="cm-scroll" ref="{{ scrollRef }}" style="flex:1; min-height:0; overflow-y:auto; padding:18px 18px 14px; display:flex; flex-direction:column; gap:14px;">
    <sc-for list="{{ thread }}" as="m" hint-placeholder-count="6">
      <div style="display:flex; flex-direction:column; gap:5px; align-items:{{ m.align }};">
        <sc-if value="{{ m.isDay }}" hint-placeholder-val="{{ false }}">
          <span style="align-self:center; padding:4px 12px; border-radius:var(--fl-radius-pill); background:var(--fl-surface-recessed); font-size:10.5px; font-weight:600; letter-spacing:0.6px; color:var(--fl-text-tertiary);">{{ m.at }}</span>
        </sc-if>
        <sc-if value="{{ m.isCheckin }}" hint-placeholder-val="{{ false }}">
          <div style="width:100%; display:flex; flex-direction:column; gap:8px; padding:15px 16px; border-radius:var(--fl-radius-lg); border:1px solid var(--fl-bronze-border-subtle); background:linear-gradient(168deg, var(--fl-bronze-tint) 0%, transparent 46%), var(--fl-surface-recessed); box-shadow:var(--fl-border-inset);">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="flex:none; width:20px; height:20px; border-radius:5px; background:var(--fl-bronze-metallic); display:flex; align-items:center; justify-content:center; color:#1A1206;"><svg viewBox="0 0 24 24" style="width:62%;height:62%;display:block" fill="currentColor"><path d="M10.9 3.2H13.1V15H10.9Z"></path><path d="M7.6 7.1L9.6 5.8V15H7.6Z"></path><path d="M16.4 7.1L14.4 5.8V15H16.4Z"></path><path d="M6.8 15.4H17.2V16.2H6.8Z"></path><path d="M5.6 16.6H18.4V17.4H5.6Z"></path><path d="M4.4 17.8H19.6V18.6H4.4Z"></path></svg></span>
              <span style="flex:1; font-size:9.5px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase; color:var(--fl-text-bronze-label);">{{ m.label }}</span>
              <span style="flex:none; font-family:var(--fl-font-mono); font-size:10px; color:var(--fl-text-tertiary);">{{ m.at }}</span>
            </div>
            <span style="font-size:14.5px; line-height:1.6; color:var(--fl-text-primary); text-wrap:pretty;">{{ m.text }}</span>
            <span role="button" tabindex="0" onClick="{{ m.onOpen }}" style="display:inline-flex; align-items:center; gap:7px; align-self:flex-start; margin-top:2px; padding:8px 13px; border-radius:var(--fl-radius-sm); border:1px solid var(--fl-bronze-border); background:transparent; font-size:12px; font-weight:600; color:var(--fl-bronze-bright); cursor:pointer;">See the check-in<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></span>
          </div>
        </sc-if>
        <sc-if value="{{ m.isBubble }}" hint-placeholder-val="{{ true }}">
          <div style="max-width:82%; display:flex; flex-direction:column; gap:9px; padding:12px 15px; border-radius:{{ m.radius }}; border:1px solid {{ m.border }}; background:{{ m.bg }};">
            <sc-if value="{{ m.hasMedia }}" hint-placeholder-val="{{ false }}">
              <span style="display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:var(--fl-radius-sm); border:1px solid var(--fl-charcoal-600); background:var(--fl-surface-recessed);">
                <span style="flex:none; width:28px; height:28px; border-radius:6px; border:1px solid var(--fl-bronze-border-subtle); background:var(--fl-icon-container-bg); display:flex; align-items:center; justify-content:center; color:var(--fl-icon-bronze);">{{ m.glyph }}</span>
                <span style="flex:1; min-width:0; font-size:11.5px; font-weight:600; color:var(--fl-text-secondary);">{{ m.meta }}</span>
              </span>
            </sc-if>
            <span style="font-size:14.5px; line-height:1.55; color:{{ m.ink }}; text-wrap:pretty;">{{ m.text }}</span>
          </div>
          <span style="font-family:var(--fl-font-mono); font-size:10px; color:var(--fl-text-tertiary); padding:0 6px;">{{ m.at }}</span>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="flex:none; display:flex; align-items:flex-end; gap:9px; padding:12px 16px 10px; border-top:1px solid var(--fl-charcoal-700); background:linear-gradient(180deg, rgba(11,13,15,0.5), rgba(6,7,8,0.9));">
    <span role="button" tabindex="0" onClick="{{ onAttach }}" style="width:40px; height:40px; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--fl-radius-round); border:1px solid var(--fl-charcoal-600); background:var(--fl-surface-recessed); color:var(--fl-text-secondary); cursor:pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 7v10M7 12h10"></path></svg></span>
    <textarea class="cm-in" rows="1" placeholder="Message Ray…" value="{{ draft }}" onInput="{{ onDraft }}" style="flex:1; min-width:0;"></textarea>
    <span role="button" tabindex="0" onClick="{{ onSend }}" style="width:40px; height:40px; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--fl-radius-round); border:1px solid var(--fl-bronze-metal-border); background:var(--fl-bronze-fill); color:#F7F5F1; cursor:pointer; box-shadow:var(--fl-bronze-metal-top-rim), var(--fl-shadow-card);"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"></path></svg></span>
  </div>

  <div style="flex:none; display:flex; justify-content:center; padding:6px 0 10px;">
    <span style="width:132px; height:5px; border-radius:3px; background:rgba(240,238,234,0.28);"></span>
  </div>

  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute; left:50%; bottom:110px; transform:translateX(-50%); display:flex; align-items:center; gap:9px; padding:12px 18px; border-radius:var(--fl-radius-pill); background:var(--fl-surface-modal); border:1px solid var(--fl-bronze-border); box-shadow:var(--fl-shadow-float); animation:cmIn 200ms var(--fl-ease-out, ease-out) both; white-space:nowrap;">
      <span style="font-size:13px; font-weight:600; color:var(--fl-text-primary);">{{ toast }}</span>
    </div>
  </sc-if>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
// Sarah's side of the same thread the coach screen shows.
const THREAD = [
  { day: 'Mon, Feb 23' },
  { from: 'me', kind: 'text', at: '8:12am', text: 'Quick one — the gym swapped the leg curl machine. Is the seated one fine?' },
  { from: 'coach', kind: 'text', at: '8:40am', text: 'Seated is fine. Same muscle, slightly longer range. Use it.' },
  { day: 'Fri, Mar 3' },
  { from: 'me', kind: 'video', at: '6:58pm', text: 'Last set of squats. Something felt off on rep 4.', meta: 'Form check · 0:22' },
  { from: 'coach', kind: 'text', at: '9:15pm', text: 'Rep 4 is where your knees drift in. Push them out as you come up — that is all it needs.' },
  { day: 'Sun, Mar 6' },
  { from: 'coach', kind: 'checkin', at: '10:02am', week: 7, text: 'Week seven and the squat is moving — 315 for five at RPE 8 is real progress from where you started. On the shoulder, let\u2019s pull bench back to a 2-count pause and add band pull-aparts before every upper day.' },
  { from: 'me', kind: 'text', at: '10:20am', text: 'Got it. Pull-aparts before every upper day, two-count pause on bench.' }
];

class Component extends DCLogic {
  state = { draft: '', sent: [], toast: null };
  _scroll = React.createRef();
  _pin() { const el = this._scroll.current; if (el) el.scrollTop = el.scrollHeight; }
  componentDidMount() { this._pin(); }
  componentDidUpdate() { this._pin(); }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); }
  _toast(m) { if (this._t) clearTimeout(this._t); this.setState({ toast: m }); this._t = setTimeout(() => this.setState({ toast: null }), 2200); }

  renderVals() {
    const h = React.createElement, S = this.state;
    const P = (d) => h('path', { key: d, d: d });
    const ic = (kids) => h('svg', { width: 15, height: 15, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
      strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }, kids);
    const GLYPH = {
      video: ic([P('M4 6.5A1.5 1.5 0 0 1 5.5 5h8A1.5 1.5 0 0 1 15 6.5v11A1.5 1.5 0 0 1 13.5 19h-8A1.5 1.5 0 0 1 4 17.5z'), P('M15 10l5-3v10l-5-3z')]),
      photo: ic([P('M4 8.5h3l1.5-2h7l1.5 2h3v10H4z'), h('circle', { key: 'c', cx: 12, cy: 13, r: 3.4 })])
    };

    const all = THREAD.concat(S.sent);
    const thread = all.map((m, i) => {
      if (m.day) return { key: 'd' + i, isDay: true, isCheckin: false, isBubble: false, at: m.day, align: 'center', text: '', meta: '' };
      const mine = m.from === 'me';
      return { key: i, isDay: false,
        isCheckin: m.kind === 'checkin', isBubble: m.kind !== 'checkin',
        at: m.at, text: m.text, meta: m.meta || '',
        label: 'Ray on your Week ' + m.week + ' check-in',
        onOpen: () => this._toast('Opening your Week ' + m.week + ' check-in'),
        align: m.kind === 'checkin' ? 'stretch' : (mine ? 'flex-end' : 'flex-start'),
        radius: mine ? '16px 16px 5px 16px' : '16px 16px 16px 5px',
        border: mine ? 'var(--fl-bronze-border-subtle)' : 'var(--fl-charcoal-600)',
        bg: mine ? 'var(--fl-bronze-tint)' : 'var(--fl-surface-card)',
        ink: mine ? 'var(--fl-text-primary)' : 'var(--fl-text-secondary)',
        hasMedia: !!m.meta,
        glyph: h('span', { style: { display: 'inline-flex' } }, GLYPH[m.kind] || GLYPH.photo) };
    });

    return {
      thread,
      scrollRef: this._scroll,
      draft: S.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onAttach: () => this._toast('Send a photo or a form check'),
      onSend: () => {
        const v = (S.draft || '').trim();
        if (!v) { this._toast('Write something first'); return; }
        this.setState(s => ({ sent: s.sent.concat([{ from: 'me', kind: 'text', at: 'Just now', text: v }]), draft: '' }));
        this._toast('Sent to Ray');
      },
      toast: S.toast
    };
  }
}
</script>
</body>
</html>
