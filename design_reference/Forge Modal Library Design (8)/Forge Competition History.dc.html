<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/tokens/foundation.css">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/styles.css">
  <script src="forge-theme.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background: var(--fl-bg-atmospheric); background-attachment: fixed; color: var(--fl-text-primary); font-family: var(--fl-font-sans); -webkit-font-smoothing: antialiased; }
  .fl-scroll::-webkit-scrollbar { width:0; height:0; }
  .fl-scroll { scrollbar-width: none; }
  .fl-chips::-webkit-scrollbar { height:0; }
  .fl-chips { scrollbar-width: none; }
  input::placeholder { color: var(--fl-text-tertiary); }
  @keyframes cpRise { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
</style>
</helmet>
<div style="min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:30px 16px;">
  <div data-screen-label="Competition History" style="width:404px; max-width:100%; height:868px; position:relative; border-radius:32px; border:1px solid var(--fl-charcoal-600); background:linear-gradient(rgba(6,7,8,0.3), rgba(6,7,8,0.3)), #060708 url('assets/forge-bg-2.png') center center / cover no-repeat; box-shadow:var(--fl-shadow-ambient); overflow:hidden; display:flex; flex-direction:column;">

    <!-- header -->
    <div style="flex:none; position:relative; z-index:6; background:#070808; border-bottom:1px solid var(--fl-charcoal-700);">
      <div style="height:56px; display:flex; align-items:center; gap:6px; padding:0 8px;">
        <button onClick="{{ back }}" aria-label="Back" style="width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; background:transparent; border:none; cursor:pointer; color:var(--fl-text-secondary);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <span style="flex:1; font-size:11px; font-weight:700; letter-spacing:2.4px; text-transform:uppercase; color:var(--fl-text-primary);">Competition History</span>
        <span style="width:44px;"></span>
      </div>

      <!-- search -->
      <div style="padding:2px 16px 12px;">
        <div style="display:flex; align-items:center; gap:9px; padding:10px 13px; border-radius:var(--fl-radius-md); background:var(--fl-surface-recessed); border:1px solid var(--fl-charcoal-600);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fl-text-tertiary)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><circle cx="11" cy="11" r="7"></circle><path d="M16 16l4.5 4.5"></path></svg>
          <input type="text" value="{{ search }}" onInput="{{ setSearch }}" placeholder="Search by name or opponent" style="flex:1; min-width:0; background:transparent; border:none; outline:none; color:var(--fl-text-primary); font-size:13.5px; font-family:var(--fl-font-sans);">
        </div>
      </div>

      <!-- filter rows -->
      <div style="display:flex; flex-direction:column; gap:8px; padding:0 0 12px;">
        <div style="display:flex; align-items:center; gap:10px; padding:0 16px;">
          <span style="flex:none; width:46px; font-size:9px; font-weight:600; letter-spacing:0.8px; text-transform:uppercase; color:var(--fl-text-tertiary);">Group</span>
          <div class="fl-chips" style="display:flex; gap:7px; overflow-x:auto;"><sc-for list="{{ ctxChips }}" as="c" hint-placeholder-count="4"><span role="button" tabindex="0" onClick="{{ c.onClick }}" style="{{ c.style }}">{{ c.label }}</span></sc-for></div>
        </div>
        <div style="display:flex; align-items:center; gap:10px; padding:0 16px;">
          <span style="flex:none; width:46px; font-size:9px; font-weight:600; letter-spacing:0.8px; text-transform:uppercase; color:var(--fl-text-tertiary);">Type</span>
          <div class="fl-chips" style="display:flex; gap:7px; overflow-x:auto;"><sc-for list="{{ typeChips }}" as="c" hint-placeholder-count="6"><span role="button" tabindex="0" onClick="{{ c.onClick }}" style="{{ c.style }}">{{ c.label }}</span></sc-for></div>
        </div>
        <div style="display:flex; align-items:center; gap:10px; padding:0 16px;">
          <span style="flex:none; width:46px; font-size:9px; font-weight:600; letter-spacing:0.8px; text-transform:uppercase; color:var(--fl-text-tertiary);">Result</span>
          <div class="fl-chips" style="display:flex; gap:7px; overflow-x:auto;"><sc-for list="{{ resultChips }}" as="c" hint-placeholder-count="4"><span role="button" tabindex="0" onClick="{{ c.onClick }}" style="{{ c.style }}">{{ c.label }}</span></sc-for></div>
        </div>
      </div>
    </div>

    <!-- scroll body -->
    <div class="fl-scroll" style="flex:1; min-height:0; overflow-y:auto; position:relative;">

      <sc-for list="{{ yearGroups }}" as="yr" hint-placeholder-count="3">
        <div style="position:sticky; top:0; z-index:3; background:#060708; padding:14px 24px 8px; display:flex; align-items:baseline; justify-content:space-between; gap:10px;">
          <span style="font-family:var(--fl-font-display); font-size:19px; font-weight:600; letter-spacing:-0.2px; color:var(--fl-text-primary);">{{ yr.year }}</span>
          <span style="font-size:10.5px; color:var(--fl-text-tertiary); white-space:nowrap;">{{ yr.count }}</span>
        </div>
        <div style="display:flex; flex-direction:column; padding:0 24px;">
          <sc-for list="{{ yr.rows }}" as="p" hint-placeholder-count="4">
            <div role="button" tabindex="0" onClick="{{ p.open }}" style="display:flex; align-items:center; gap:14px; padding:14px 2px; border-top:1px solid var(--fl-charcoal-700); cursor:pointer; transition:background 180ms var(--fl-ease-out, ease-out);" style-hover="background:var(--fl-hover-wash);">
              <span style="{{ p.markStyle }}">
                <sc-if value="{{ p.isChamp }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v3a5 5 0 0 1-10 0z"></path><path d="M7 5H4.5v1a3 3 0 0 0 3 3M17 5h2.5v1a3 3 0 0 1-3 3M9 14.5h6M8 20h8M12 14v6"></path></svg></sc-if>
                <sc-if value="{{ p.notChamp }}" hint-placeholder-val="{{ true }}">{{ p.placeNum }}</sc-if>
              </span>
              <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;">
                <span style="font-family:var(--fl-font-display); font-size:15px; font-weight:600; letter-spacing:-0.1px; color:var(--fl-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ p.name }}</span>
                <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--fl-text-tertiary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"><span style="display:flex; flex:none; color:var(--fl-icon-inactive);">{{ p.typeIcon }}</span>{{ p.metaA }}</span>
              </div>
              <div style="flex:none; text-align:right; display:flex; flex-direction:column; gap:4px;">
                <span style="font-size:14.5px; font-weight:700; letter-spacing:0.1px; color:{{ p.placeColor }};">{{ p.placeLabel }}</span>
                <span style="font-size:10px; color:var(--fl-text-tertiary); opacity:0.85;">{{ p.standing }} · {{ p.date }}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-for>

      <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ false }}">
        <div style="padding:16px 24px 8px;">
          <button onClick="{{ loadMore }}" style="width:100%; padding:13px; border-radius:var(--fl-radius-md); background:transparent; border:1px solid var(--fl-charcoal-500); color:var(--fl-text-secondary); font-size:13px; font-weight:600; letter-spacing:0.3px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;">Load {{ moreCount }} More<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
        </div>
      </sc-if>

      <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
        <div style="padding:60px 30px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;">
          <span style="width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid var(--fl-charcoal-600); color:var(--fl-text-tertiary);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M16 16l4.5 4.5"></path></svg></span>
          <span style="font-size:13.5px; color:var(--fl-text-secondary);">No competitions match these filters.</span>
          <span role="button" tabindex="0" onClick="{{ clearFilters }}" style="font-size:12.5px; font-weight:600; color:var(--fl-bronze-primary); cursor:pointer;">Clear filters</span>
        </div>
      </sc-if>

      <div style="height:24px;"></div>
    </div>

    <!-- grain -->
    <div style="position:absolute; inset:0; pointer-events:none; z-index:20; opacity:0.06; mix-blend-mode:overlay; background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E'); background-size:160px 160px;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { search: '', ctx: 'All', type: 'All', result: 'All', limit: 12 };
  renderVals() {
    const h = React.createElement;
    const TYPE_PATHS = {
      'Most Workouts': ['M6.5 9v6', 'M17.5 9v6', 'M4 10.5v3', 'M20 10.5v3', 'M6.5 12h11'],
      'Most Volume': ['M4 20V10', 'M9 20V4', 'M14 20v-8', 'M19 20v-5'],
      'Most Duration': ['M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z', 'M12 7.5V12l3 2'],
      'Max Lift': ['M12 20V6', 'M6 12l6-6 6 6'],
      'Most PRs': ['M12 3.4l2.1 4.7 5.1.5-3.8 3.4 1.1 5L12 14l-4.6 2.4 1.1-5-3.8-3.4 5.1-.5z'],
    };
    const typeIcon = (type) => h('svg', { width: 13, height: 13, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }, (TYPE_PATHS[type] || ['M12 4v16']).map((d, i) => h('path', { key: i, d: d })));
    const openResults = (r) => () => {
      try {
        localStorage.setItem('forge_challenge_results_v1', JSON.stringify({
          name: r.name, type: r.type, scope: r.scope, opponent: r.opp,
          standing: r.standing, date: r.date, days: 28,
        }));
      } catch (e) {}
      window.location.href = 'Forge%20Challenge%20Results.dc.html';
    };

    const markChamp = 'width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fl-bronze-metallic);color:#1A1206;box-shadow:var(--fl-border-inset), 0 0 8px rgba(191,143,79,0.18);';
    const markPlace = 'width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fl-font-display);font-size:14px;font-weight:700;background:var(--fl-surface-recessed);color:var(--fl-text-tertiary);border:1px solid var(--fl-charcoal-600);';
    const resultOf = (standing) => {
      if (/^1st/.test(standing)) return { label: 'Champion', color: 'var(--fl-bronze-bright)', champ: true, key: 'Champion' };
      if (/^2nd/.test(standing) || /^3rd/.test(standing)) return { label: /^2nd/.test(standing) ? 'Runner-up' : 'Podium', color: 'var(--fl-text-secondary)', champ: false, key: 'Podium' };
      return { label: 'Completed', color: 'var(--fl-text-tertiary)', champ: false, key: 'Completed' };
    };

    const RAW = [
      { key: 'h1', type: 'Most Volume', name: 'Winter Volume War', opp: 'Dawn Patrol', scope: 'Squad', standing: '1st of 6', date: 'Feb 2026', year: '2026' },
      { key: 'h2', type: 'Most Duration', name: 'The Long Haul', opp: 'Marcus Vale', scope: 'Friends', standing: '2nd', date: 'Jan 2026', year: '2026' },
      { key: 'h3', type: 'Most PRs', name: 'January Breakthroughs', opp: 'Iron Vigil', scope: 'Squad', standing: '1st of 5', date: 'Jan 2026', year: '2026' },
      { key: 'h4', type: 'Most Volume', name: 'Collective Volume Open', opp: 'Iron Collective', scope: 'Community', standing: '3rd of 40', date: 'Jan 2026', year: '2026' },
      { key: 'h5', type: 'Max Lift', name: 'Bench Battle', opp: 'Theo Brandt', scope: 'Friends', standing: '2nd', date: 'Dec 2025', year: '2025' },
      { key: 'h6', type: 'Most Workouts', name: 'December Grind', opp: 'Iron Vigil', scope: 'Squad', standing: '1st of 5', date: 'Dec 2025', year: '2025' },
      { key: 'h7', type: 'Most Volume', name: 'Autumn Community Open', opp: 'Iron Collective', scope: 'Community', standing: '12th of 38', date: 'Nov 2025', year: '2025' },
      { key: 'h8', type: 'Most Volume', name: 'Fall Volume Clash', opp: 'Dawn Patrol', scope: 'Squad', standing: '1st of 6', date: 'Oct 2025', year: '2025' },
      { key: 'h9', type: 'Most Workouts', name: 'Summer Streak Duel', opp: 'Marcus Vale', scope: 'Friends', standing: '2nd', date: 'Aug 2025', year: '2025' },
      { key: 'h10', type: 'Max Lift', name: 'The Proving Trial', opp: 'The Proving', scope: 'Squad', standing: '1st of 4', date: 'Jun 2025', year: '2025' },
      { key: 'h11', type: 'Most Duration', name: 'Spring Endurance', opp: 'Iron Collective', scope: 'Community', standing: '5th of 30', date: 'Apr 2025', year: '2025' },
      { key: 'h12', type: 'Most Workouts', name: 'First Blood', opp: 'Theo Brandt', scope: 'Friends', standing: '1st', date: 'Feb 2025', year: '2025' },
      { key: 'h13', type: 'Most Volume', name: 'Iron Open', opp: 'Iron Vigil', scope: 'Squad', standing: '3rd of 5', date: 'Nov 2024', year: '2024' },
      { key: 'h14', type: 'Max Lift', name: 'Rookie Duel', opp: 'Marcus Vale', scope: 'Friends', standing: '2nd', date: 'Sep 2024', year: '2024' },
      { key: 'h15', type: 'Most Workouts', name: 'Founders Cup', opp: 'Dawn Patrol', scope: 'Squad', standing: '1st of 5', date: 'Jul 2024', year: '2024' },
      { key: 'h16', type: 'Most PRs', name: 'The First Test', opp: 'Iron Vigil', scope: 'Squad', standing: '4th of 5', date: 'May 2024', year: '2024' },
    ];

    const ctxOfFilter = { Squads: 'Squad', Friends: 'Friends', Communities: 'Community' };
    const S = this.state;
    const q = (S.search || '').trim().toLowerCase();
    const filtered = RAW.filter((r) => {
      if (S.ctx !== 'All' && r.scope !== ctxOfFilter[S.ctx]) return false;
      if (S.type !== 'All' && r.type !== S.type) return false;
      if (S.result !== 'All' && resultOf(r.standing).key !== S.result) return false;
      if (q && (r.name + ' ' + r.opp).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    const shown = filtered.slice(0, S.limit);

    // group shown by year (RAW is already newest-first)
    const order = [];
    const byYear = {};
    shown.forEach((r) => { if (!byYear[r.year]) { byYear[r.year] = []; order.push(r.year); } byYear[r.year].push(r); });
    const yearGroups = order.map((y) => ({
      key: y, year: y, count: byYear[y].length + (byYear[y].length === 1 ? ' competition' : ' competitions'),
      rows: byYear[y].map((p) => {
        const pl = resultOf(p.standing);
        const num = (p.standing.match(/^\d+/) || ['\u2013'])[0];
        return {
          key: p.key, name: p.name, standing: p.standing, date: p.date,
          metaA: p.type + ' \u00B7 ' + p.opp + ' \u00B7 ' + p.scope,
          typeIcon: typeIcon(p.type),
          placeLabel: pl.label, placeColor: pl.color, isChamp: pl.champ, notChamp: !pl.champ, placeNum: num,
          markStyle: pl.champ ? markChamp : markPlace,
          open: openResults(p),
        };
      }),
    }));

    const chipBase = 'flex:none; padding:6px 12px; border-radius:var(--fl-radius-pill); font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap; transition:all 150ms var(--fl-ease-out, ease-out);';
    const mkChips = (list, cur, setKey) => list.map((v) => ({
      key: v, label: v, onClick: () => this.setState({ [setKey]: v, limit: 12 }),
      style: v === cur
        ? (chipBase + ' background:var(--fl-bronze-tint); color:var(--fl-bronze-bright); border:1px solid var(--fl-bronze-border);')
        : (chipBase + ' background:transparent; color:var(--fl-text-tertiary); border:1px solid var(--fl-charcoal-600);'),
    }));

    return {
      back: () => { (function(){try{return !!document.referrer&&new URL(document.referrer).origin===window.location.origin;}catch(e){return false;}})() ? window.history.back() : (window.location.href = 'Forge%20Competitions.dc.html'); },
      search: S.search, setSearch: (e) => this.setState({ search: e && e.target ? e.target.value : '', limit: 12 }),
      ctxChips: mkChips(['All', 'Squads', 'Friends', 'Communities'], S.ctx, 'ctx'),
      typeChips: mkChips(['All', 'Most Workouts', 'Most Volume', 'Max Lift', 'Most Duration', 'Most PRs'], S.type, 'type'),
      resultChips: mkChips(['All', 'Champion', 'Podium', 'Completed'], S.result, 'result'),
      yearGroups,
      hasMore: filtered.length > S.limit,
      moreCount: filtered.length - S.limit,
      loadMore: () => this.setState((s) => ({ limit: s.limit + 12 })),
      noResults: filtered.length === 0,
      clearFilters: () => this.setState({ search: '', ctx: 'All', type: 'All', result: 'All', limit: 12 }),
    };
  }
}
</script>
</body>
</html>
