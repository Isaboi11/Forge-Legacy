</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/tokens/foundation.css">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/styles.css">
  <script src="forge-theme.js"></script>
<script>
  (function () {
    var SRC = "_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/_ds_bundle.js";
    function inject() { if (window.__flBundleInjected) return; window.__flBundleInjected = true; var s = document.createElement("script"); s.src = SRC; document.head.appendChild(s); }
    if (window.React && window.ReactDOM) { inject(); return; }
    var tries = 0; var iv = setInterval(function () { if ((window.React && window.ReactDOM) || ++tries > 600) { clearInterval(iv); inject(); } }, 25);
  })();

<script src="forge-symbols.js"></script>

<style>
  * { box-sizing: border-box; }
  body { margin:0; background: var(--fl-bg-atmospheric); background-attachment: fixed; color: var(--fl-text-primary); font-family: var(--fl-font-sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--fl-bronze-primary); text-decoration: none; }
  a:hover { color: var(--fl-bronze-bright); }
  .fl-scroll::-webkit-scrollbar { width:0; height:0; }
  .fl-scroll { scrollbar-width: none; }
  .fl-chips::-webkit-scrollbar { height:0; }
  .fl-chips { scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; } }
</style>
</helmet>
<div style="min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:30px 16px;">
  <div data-screen-label="W-18 Activity History" style="width:404px; max-width:100%; height:868px; position:relative; border-radius:32px; border:1px solid var(--fl-charcoal-600); background-color:#07080a; background-image:linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('forge-stone-texture.png'); background-size:cover; background-position:center; background-blend-mode:normal, normal; box-shadow:var(--fl-shadow-ambient); overflow:hidden; display:flex; flex-direction:column;">

    <sc-if value="{{ notReady }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--fl-bg-primary);">
        <span style="width:40px; height:40px; border-radius:var(--fl-radius-md); background:var(--fl-bronze-metallic); display:flex; align-items:center; justify-content:center; color:#1A1206; box-shadow:var(--fl-glow-subtle);"><svg viewBox="0 0 24 24" style="width:62%;height:62%;display:block" fill="currentColor"><path d="M10.9 3.2H13.1V15H10.9Z"/><path d="M7.6 7.1L9.6 5.8V15H7.6Z"/><path d="M16.4 7.1L14.4 5.8V15H16.4Z"/><path d="M6.8 15.4H17.2V16.2H6.8Z"/><path d="M5.6 16.6H18.4V17.4H5.6Z"/><path d="M4.4 17.8H19.6V18.6H4.4Z"/></svg></span>
      </div>
    </sc-if>

    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">

      <!-- header -->
      <div style="flex:none; position:relative; z-index:6; background:#070808; border-bottom:1px solid var(--fl-charcoal-700);">
        <div style="height:56px; display:flex; align-items:center; gap:6px; padding:0 8px;">
          <button type="button" onClick="{{ back }}" aria-label="Back" style="width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; background:transparent; border:none; cursor:pointer; color:var(--fl-text-secondary);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
          <span style="flex:1; font-size:11px; font-weight:700; letter-spacing:2.4px; text-transform:uppercase; color:var(--fl-text-primary);">Activity History</span>
          <span style="width:44px;"></span>
        </div>

        <!-- type filter · single-select, All + 9 activity types -->
        <div class="fl-chips" style="display:flex; gap:7px; overflow-x:auto; padding:0 16px 13px;">
          <sc-for list="{{ typeChips }}" as="c" hint-placeholder-count="6">
            <span role="button" tabindex="0" aria-pressed="{{ c.on }}" onClick="{{ c.onClick }}" style="{{ c.style }}">
              <sc-if value="{{ c.hasIcon }}" hint-placeholder-val="{{ false }}"><span style="display:flex;">{{ c.icon }}</span></sc-if>{{ c.label }}
            </span>
          </sc-for>
        </div>
      </div>

      <!-- scrollable session list -->
      <div class="fl-scroll" style="flex:1; min-height:0; overflow-y:auto; position:relative;">

        <sc-for list="{{ monthGroups }}" as="m" hint-placeholder-count="3">
          <div style="position:sticky; top:0; z-index:3; background:#060708; padding:40px 24px 14px; box-shadow:0 10px 16px -8px rgba(0,0,0,0.7);">
            <span style="font-size:15px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--fl-text-primary); opacity:0.82;">{{ m.month }}</span>
          </div>
          <div style="display:flex; flex-direction:column; padding:0 18px;">
            <sc-for list="{{ m.rows }}" as="s" hint-placeholder-count="5">
              <div role="button" tabindex="0" aria-label="{{ s.a11y }}" onClick="{{ s.open }}" style="display:flex; align-items:center; gap:14px; min-height:80px; padding:16px 4px; border-bottom:1px solid var(--fl-charcoal-700); cursor:pointer; transition:background 180ms var(--fl-ease-out, ease-out);" style-hover="background:var(--fl-hover-wash);">
                <span style="width:30px; flex:none; display:flex; align-items:center; justify-content:center; color:{{ s.iconColor }};">{{ s.icon }}</span>
                <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;">
                  <span style="display:flex; align-items:center; gap:8px; min-width:0;">
                    <span style="font-family:var(--fl-font-display); font-size:15.5px; font-weight:600; letter-spacing:-0.1px; color:var(--fl-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.2;">{{ s.title }}</span>
                    <sc-if value="{{ s.pr }}" hint-placeholder-val="{{ false }}">
                      <span style="flex:none; display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; background:var(--fl-bronze-tint); border:1px solid var(--fl-bronze-border-subtle);"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--fl-bronze-bright)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v3a5 5 0 0 1-10 0zM7 5H4v1a3 3 0 0 0 3 3M17 5h3v1a3 3 0 0 1-3 3M9 15h6M12 12v3M8 21h8"></path></svg><span style="font-size:9px; font-weight:700; letter-spacing:0.8px; color:var(--fl-bronze-bright);">PR</span></span>
                    </sc-if>
                  </span>
                  <sc-if value="{{ s.hasStat }}" hint-placeholder-val="{{ true }}">
                    <span style="font-size:12px; color:var(--fl-text-tertiary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ s.stat }}</span>
                  </sc-if>
                  <sc-if value="{{ s.hasAttr }}" hint-placeholder-val="{{ false }}">
                    <span style="display:flex; align-items:center; gap:8px; min-width:0;">
                      <sc-if value="{{ s.hasChapter }}" hint-placeholder-val="{{ true }}">
                        <span style="font-size:11px; color:var(--fl-text-tertiary); opacity:0.95; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ s.chapter }}</span>
                      </sc-if>
                      <sc-if value="{{ s.partial }}" hint-placeholder-val="{{ false }}">
                        <span style="flex:none; padding:2px 8px; border-radius:999px; border:1px solid var(--fl-charcoal-500); font-size:9px; font-weight:700; letter-spacing:0.9px; text-transform:uppercase; color:var(--fl-text-tertiary);">Partial</span>
                      </sc-if>
                      <sc-if value="{{ s.hasPartners }}" hint-placeholder-val="{{ false }}">
                        <span style="flex:none; display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; border:1px solid var(--fl-bronze-border-subtle); background:var(--fl-bronze-tint);"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--fl-bronze-bright)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"></path><circle cx="10" cy="8" r="3"></circle><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.6-3.4"></path></svg><span style="font-size:9.5px; font-weight:600; letter-spacing:0.2px; color:var(--fl-bronze-bright); white-space:nowrap;">{{ s.partnersLabel }}</span></span>
                      </sc-if>
                    </span>
                  </sc-if>
                </div>
                <div style="flex:none; text-align:right; display:flex; flex-direction:column; gap:4px;">
                  <span style="font-size:13.5px; font-weight:600; color:var(--fl-text-secondary); font-variant-numeric:tabular-nums; white-space:nowrap;">{{ s.dur }}</span>
                  <span style="font-size:11px; color:var(--fl-text-tertiary); white-space:nowrap;">{{ s.date }}</span>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-for>

        <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
          <div style="padding:70px 34px; display:flex; flex-direction:column; align-items:center; gap:13px; text-align:center;">
            <span style="width:48px; height:48px; border-radius:var(--fl-radius-md); display:flex; align-items:center; justify-content:center; border:1px solid var(--fl-charcoal-600); color:var(--fl-text-tertiary);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg></span>
            <span style="font-size:13.5px; color:var(--fl-text-secondary); line-height:1.5; text-wrap:pretty;">{{ emptyMsg }}</span>
          </div>
        </sc-if>

        <div style="height:22px;"></div>
      </div>

      <!-- persistent tab bar · Workouts active -->
      <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.TabBar" items="{{ tabItems }}" active-id="{{ activeTab }}" on-change="{{ setTab }}" hint-size="100%,74px"></x-import>

    </sc-if>

    <!-- grain -->
    <div style="position:absolute; inset:0; pointer-events:none; z-index:20; opacity:0.03; mix-blend-mode:overlay; background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E'); background-size:160px 160px;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:404,&quot;height&quot;:868},&quot;units&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mi&quot;,&quot;km&quot;],&quot;default&quot;:&quot;mi&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;iconTint&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bronze&quot;,&quot;category&quot;],&quot;default&quot;:&quot;bronze&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;}}">
class Component extends DCLogic {
  // filter state persists within one navigation session (not across fresh entries — the default)
  state = { ready: false, filter: 'all' };

  componentDidMount() {
    this._poll = () => {
      const r = typeof React !== 'undefined' && React && React.createElement;
      const fs = typeof window !== 'undefined' && window.ForgeSymbols;
      const ns = typeof window !== 'undefined' && window.ForgeLegacyVisualFoundation_5368b2;
      const fal = typeof window !== 'undefined' && window.ForgeActivityLog;
      if (r && fs && ns && fal) { this.setState({ ready: true }); }
      else { this._t = setTimeout(this._poll, 40); }
    };
    this._poll();
  }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); }

  renderVals() {
    if (!this.state.ready || typeof React === 'undefined' || !React.createElement) {
      return { ready: false, notReady: true };
    }
    const S = this.state;
    const FS = window.ForgeSymbols;
    const ico = (id, size, sw) => FS.create(React, id, { size: size || 22, strokeWidth: sw || 1.7 });

    const units = this.props.units || 'mi';
    const tint = this.props.iconTint || 'bronze';

    // ── activity type registry (All + 9 types, fixed order) ──
    const TYPES = {
      strength: { label: 'Strength', symbol: 'dumbbell',   color: 'var(--fl-icon-bronze)' },
      run:      { label: 'Run',      symbol: 'shoe',       color: 'oklch(0.74 0.10 55)' },
      walk:     { label: 'Walk',     symbol: 'footprints', color: 'oklch(0.74 0.05 145)' },
      bike:     { label: 'Bike',     symbol: 'bicycle',    color: 'oklch(0.72 0.06 235)' },
      swim:     { label: 'Swim',     symbol: 'swim',       color: 'oklch(0.74 0.07 205)' },
      hiit:     { label: 'HIIT',     symbol: 'glove',      color: 'oklch(0.66 0.13 35)' },
      mobility: { label: 'Mobility', symbol: 'lotus',      color: 'oklch(0.72 0.06 300)' },
      yoga:     { label: 'Yoga',     symbol: 'lotus',      color: 'oklch(0.74 0.07 20)' },
      other:    { label: 'Other',    symbol: 'mountain',   color: 'oklch(0.72 0.02 80)' },
    };
    const ORDER = ['strength', 'run', 'walk', 'bike', 'swim', 'hiit', 'mobility', 'yoga', 'other'];

    // distance (miles stored) → active unit; swim always reported in meters
    const dist = (mi) => units === 'km' ? (mi * 1.609).toFixed(1) + ' km' : mi.toFixed(1) + ' mi';

    // duration: "< 1 min" · "45 min" · "2 hr" (exact) · "1 hr 30 min"
    const fmtDur = (m) => {
      if (m < 1) return '< 1 min';
      if (m < 60) return m + ' min';
      const h = Math.floor(m / 60), r = m % 60;
      return r === 0 ? h + ' hr' : h + ' hr ' + r + ' min';
    };

    // ── the training log · reverse-chronological, read-only ──
    // shared source of truth (also feeds W-19 Activity Detail), so a tapped row opens its own session
    const RAW = window.ForgeActivityLog.records();

    // program name derived from the chapter era (snapshotted with the session)
    const programOf = (r) => !r.chapter ? '' : (/III/.test(r.chapter) ? 'Powerbuilding II' : 'Powerbuilding I');
    // primary detail line: program · sets for lifts, key metric for the rest
    const statOf = (r) => {
      if (r.type === 'strength') { const p = programOf(r); return (p ? p + ' · ' : '') + r.sets + ' sets'; }
      if (r.type === 'run' || r.type === 'walk' || r.type === 'bike') return dist(r.mi);
      if (r.type === 'swim') return r.swim;
      if (r.type === 'hiit') return r.rounds + ' rounds';
      return ''; // mobility / yoga / other — duration already covers it
    };

    const open = (key) => () => { window.location.href = 'Forge%20Activity%20Detail.dc.html?id=' + encodeURIComponent(key); };

    const filtered = RAW.filter((r) => S.filter === 'all' || r.type === S.filter);

    // group by month, newest first (RAW already ordered)
    const morder = [];
    const byMonth = {};
    filtered.forEach((r) => { if (!byMonth[r.month]) { byMonth[r.month] = []; morder.push(r.month); } byMonth[r.month].push(r); });
    const monthGroups = morder.map((mo) => ({
      key: mo, month: mo,
      rows: byMonth[mo].map((r) => {
        const t = TYPES[r.type];
        const stat = statOf(r);
        const dur = fmtDur(r.min);
        const displayDate = r.date.replace(/^\w{3},\s*/, ''); // drop weekday → "Jun 10"
        return {
          key: r.key, title: r.title,
          icon: ico(t.symbol, 22, 1.7),
          iconColor: tint === 'category' ? t.color : 'var(--fl-icon-bronze)',
          hasStat: !!stat, stat,
          hasChapter: !!r.chapter, chapter: r.chapter || '',
          partial: !!r.partial, pr: !!r.pr,
          hasPartners: !!(r.partners && r.partners.length),
          partnersLabel: (r.partners && r.partners.length) ? ('with ' + r.partners[0].split(' ')[0] + (r.partners.length > 1 ? ' +' + (r.partners.length - 1) : '')) : '',
          hasAttr: !!r.chapter || !!r.partial || !!(r.partners && r.partners.length),
          date: displayDate, dur,
          a11y: r.title + ', ' + t.label + ', ' + r.date + ', ' + dur + (stat ? ', ' + stat : '') + (r.pr ? ', personal record' : '') + (r.chapter ? ', ' + r.chapter : '') + (r.partial ? ', partial session' : '') + '. Double-tap for detail.',
          open: open(r.key),
        };
      }),
    }));

    // chip strip · All + 9 types (all shown regardless of whether the filter yields rows)
    const chipBase = 'flex:none; display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--fl-radius-pill); font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap; transition:all 150ms var(--fl-ease-out, ease-out);';
    const chipOn = chipBase + ' background:var(--fl-bronze-tint); color:var(--fl-bronze-bright); border:1px solid var(--fl-bronze-primary); font-weight:700; box-shadow:var(--fl-glow-subtle);';
    const chipOff = chipBase + ' background:transparent; color:var(--fl-text-tertiary); border:1px solid var(--fl-charcoal-600);';
    const mkChip = (key, label, symbol) => ({
      key, label, hasIcon: !!symbol, icon: symbol ? ico(symbol, 13, 1.9) : null, on: S.filter === key,
      onClick: () => this.setState({ filter: key }),
      style: S.filter === key ? chipOn : chipOff,
    });
    const typeChips = [mkChip('all', 'All', null)].concat(ORDER.map((t) => mkChip(t, TYPES[t].label, TYPES[t].symbol)));

    // tab bar (Workouts active)
    const navIcon = (id) => FS.create(React, id, { size: 22, strokeWidth: 2 });
    const legacyIcon = FS.create(React, 'forge-mark', { size: 20 });
    const tabItems = [
      { id: 'home', label: 'Home', icon: navIcon('home') },
      { id: 'workouts', label: 'Workouts', icon: navIcon('workouts') },
      { id: 'legacy', label: 'Legacy', icon: legacyIcon },
      { id: 'squads', label: 'Squads', icon: navIcon('squads') },
    ];

    return {
      ready: true, notReady: false,
      back: () => { (function(){try{return !!document.referrer&&new URL(document.referrer).origin===window.location.origin;}catch(e){return false;}})() ? window.history.back() : (window.location.href = 'Forge%20Programs%20Catalog.dc.html'); },
      typeChips,
      monthGroups,
      noResults: filtered.length === 0,
      emptyMsg: S.filter === 'all'
        ? 'Your workout history will appear here as you train.'
        : 'No ' + (TYPES[S.filter] ? TYPES[S.filter].label : '') + ' sessions yet.',
      tabItems, activeTab: 'workouts',
      setTab: (id) => {
        if (id === 'home') { window.location.href = 'Forge%20Home.dc.html'; return; }
        if (id === 'workouts') { window.location.href = 'Forge%20Programs%20Catalog.dc.html'; return; }
        if (id === 'legacy') { window.location.href = 'Forge%20Legacy.dc.html'; return; }
        if (id === 'squads') { window.location.href = 'Squads%20Hub.dc.html'; return; }
      },
    };
  }
}
</script>
</body>
</html>
