          <button type="button" onClick="{{ cancelConfirm }}" style="width:100%; padding:14px; border-radius:var(--fl-radius-md); border:1px solid var(--fl-charcoal-600); background:transparent; color:var(--fl-text-secondary); font-size:14.5px; font-weight:600; cursor:pointer;">Cancel</button>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- TOAST -->

    <div style="position:absolute; left:50%; bottom:96px; transform:translateX(-50%); z-index:1300; display:inline-flex; align-items:center; gap:11px; background:var(--fl-surface-modal); border:1px solid var(--fl-charcoal-500); border-radius:var(--fl-radius-pill); box-shadow:var(--fl-border-inset-md), var(--fl-shadow-float); padding:13px 20px; color:var(--fl-text-primary); font-size:14px; font-weight:500; white-space:nowrap; animation:toRise 260ms var(--fl-ease-out) both;">
      <span style="display:inline-flex; color:{{ toastIconColor }}; flex:none;">{{ toastIcon }}</span>{{ toastMsg }}
    </div>

  <!-- Forged grain -->
  <div style="position:absolute; inset:0; pointer-events:none; z-index:20; opacity:0.08; mix-blend-mode:overlay; background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E'); background-size:160px 160px;"></div>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:404,&quot;height&quot;:868},&quot;squadName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Iron Vigil&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;memberCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:1,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;confirmRequired&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}">
class Component extends DCLogic {
  state = { ready: false, toastMsg: null, toastTone: 'bronze', selectedId: null, confirmOpen: false };

  componentDidMount() {
    this._poll = () => {
      const r = typeof React !== 'undefined' && React && React.createElement;
      const ns = typeof window !== 'undefined' && window.ForgeLegacyVisualFoundation_5368b2;
      const fs = typeof window !== 'undefined' && window.ForgeSymbols;
      if (r && ns && fs) { this.setState({ ready: true }); }
      else { this._t = setTimeout(this._poll, 40); }
    };
    this._poll();
  }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); if (this._toastT) clearTimeout(this._toastT); if (this._navT) clearTimeout(this._navT); }

  _toast(msg, tone) { if (this._toastT) clearTimeout(this._toastT); this.setState({ toastMsg: msg, toastTone: tone || 'bronze' }); this._toastT = setTimeout(() => this.setState({ toastMsg: null }), 2600); }

  _tint(seed) {
    const T = [
      'radial-gradient(circle at 42% 32%, #4a3826, #1c1510)',
      'radial-gradient(circle at 45% 35%, #34302a, #17130f)',
      'radial-gradient(circle at 40% 30%, #40301f, #17120c)',
      'radial-gradient(circle at 48% 38%, #2d2822, #141210)',
      'radial-gradient(circle at 44% 34%, #453322, #1a140e)',
    ];
    return T[seed % T.length];
  }

  renderVals() {
    if (!this.state.ready || typeof React === 'undefined' || !React.createElement) { return { ready: false, notReady: true }; }
    const h = React.createElement;
    const FS = window.ForgeSymbols;
    const S = this.state;
    const ic = (id, size, sw) => FS.create(React, id, { size: size || 18, strokeWidth: sw || 1.8 });
    const svg = (d, size, sw) => h('svg', { width: size || 17, height: size || 17, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: sw || 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }, (Array.isArray(d) ? d : [d]).map((p, i) => h('path', { key: i, d: p })));
    const crown = (size) => h('svg', { width: size || 18, height: size || 18, viewBox: '0 0 24 24', fill: 'currentColor' }, h('path', { d: 'M3 8l4 3.5L12 5l5 6.5L21 8l-1.6 10.5H4.6L3 8z' }));

    // ── Props ──
    const squadName = this.props.squadName ?? 'Iron Vigil';
    const memberCount = this.props.memberCount ?? 5;
    const confirmRequired = this.props.confirmRequired ?? true;

    // ── What transferring means ──
    const clockGlyph = h('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }, h('circle', { cx: 12, cy: 12, r: 8.5 }), h('path', { d: 'M12 7v5l3.5 2' }));
    const facts = [
      { key: 'control', icon: h('span', { style: { display: 'inline-flex' } }, crown(15)), text: 'The new owner gains full control — identity, members, permissions, and competitions.', divider: 'none' },
      { key: 'member', icon: h('span', { style: { display: 'inline-flex' } }, ic('friend', 15, 1.9)), text: 'You stay in the squad as a regular member and keep your history.', divider: '1px solid var(--fl-charcoal-700)' },
      { key: 'undo', icon: h('span', { style: { display: 'inline-flex' } }, ic('shield', 15, 1.9)), text: 'Only the new owner can transfer ownership back to you.', divider: '1px solid var(--fl-charcoal-700)' },
    ];

    // ── Eligible members (owner excluded) ──
    const MEMBERS = [
      { id: 'marcus', name: 'Marcus Vale', type: 'Bodybuilder', rank: 'Architect', tenure: 'Member 1 yr', presence: 'online' },
      { id: 'theo', name: 'Theo Brandt', type: 'Strongman', rank: 'Legend', tenure: 'Member 2 yr', presence: 'active' },
      { id: 'dana', name: 'Dana Cole', type: 'Hybrid Athlete', rank: 'Craftsman', tenure: 'Member 8 mo' },
      { id: 'lena', name: 'Lena Cross', type: 'Olympic Lifter', rank: 'Builder', tenure: 'Member 5 mo' },
    ];
    const tintOf = {}; MEMBERS.forEach((m, i) => { tintOf[m.id] = this._tint(m.name.length + i); });
    const PRESENCE = { online: '#6E8E74', active: 'var(--fl-bronze-primary)' };

    const rowBase = { width: '100%', display: 'flex', alignItems: 'center', gap: '13px', padding: '13px 14px', borderRadius: 'var(--fl-radius-lg)', boxShadow: 'var(--fl-shadow-card)', cursor: 'pointer', transition: 'transform 120ms var(--fl-ease-out), border-color 180ms ease, background 180ms ease' };
    const rowOff = Object.assign({}, rowBase, { background: 'var(--fl-surface-card)', border: '1px solid var(--fl-bronze-border-subtle)' });
    const rowOn = Object.assign({}, rowBase, { background: 'linear-gradient(180deg, rgba(38,29,18,0.5), rgba(15,13,10,0.4)), var(--fl-surface-card)', border: '1px solid var(--fl-bronze-border)' });
    const radioBase = { position: 'relative', flex: 'none', width: '22px', height: '22px', borderRadius: 'var(--fl-radius-round)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', transition: 'border-color 160ms ease' };
    const radioOff = Object.assign({}, radioBase, { border: '2px solid var(--fl-charcoal-500)' });
    const radioOn = Object.assign({}, radioBase, { border: '2px solid var(--fl-bronze-primary)', boxShadow: 'var(--fl-glow-subtle)' });
    const dotOff = { width: '0', height: '0', borderRadius: 'var(--fl-radius-round)', background: 'var(--fl-bronze-metallic)', transition: 'width 140ms var(--fl-ease-out), height 140ms var(--fl-ease-out)' };
    const dotOn = { width: '11px', height: '11px', borderRadius: 'var(--fl-radius-round)', background: 'var(--fl-bronze-metallic)', boxShadow: 'var(--fl-glow-subtle)' };

    const members = MEMBERS.map(m => {
      const on = S.selectedId === m.id;
      return {
        key: m.id, name: m.name, sub: m.rank + ' \u00B7 ' + m.type, tint: tintOf[m.id],
        hasDot: !!m.presence, dotColor: m.presence ? PRESENCE[m.presence] : 'transparent',
        tenure: m.tenure, tenureIcon: h('span', { style: { display: 'inline-flex', color: 'var(--fl-text-tertiary)' } }, clockGlyph),
        selected: on, rowStyle: on ? rowOn : rowOff,
        radioStyle: on ? radioOn : radioOff, radioDot: on ? dotOn : dotOff,
        select: () => this.setState({ selectedId: on ? null : m.id }),
      };
    });

    const sel = MEMBERS.find(m => m.id === S.selectedId) || null;
    const first = sel ? sel.name.split(' ')[0] : '';

    const commitEnabled = !!sel;
    const commitStyle = { width: '100%', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '9px', padding: '15px', borderRadius: 'var(--fl-radius-md)', fontSize: '15px', fontWeight: 600, border: '1px solid ' + (commitEnabled ? 'var(--fl-bronze-border)' : 'var(--fl-charcoal-600)'), background: commitEnabled ? 'var(--fl-bronze-fill)' : 'var(--fl-charcoal-800)', color: commitEnabled ? 'var(--fl-bronze-bright)' : 'var(--fl-text-tertiary)', boxShadow: commitEnabled ? 'var(--fl-glow-subtle)' : 'none', cursor: commitEnabled ? 'pointer' : 'not-allowed', opacity: commitEnabled ? 1 : 0.75, transition: 'background 180ms ease, opacity 160ms ease' };

    const toastColor = S.toastTone === 'positive' ? '#6E8E74' : 'var(--fl-icon-bronze)';

    return {
      ready: true, notReady: false,
      squadName: squadName, metaLine: 'Private \u00B7 ' + memberCount + ' Members',
      facts: facts,
      members: members,

      crownIcon: h('span', { style: { display: 'inline-flex' } }, crown(17)),
      commitDisabled: !commitEnabled, commitStyle: commitStyle,
      commitLabel: sel ? ('Transfer to ' + first) : 'Select a New Owner',
      openConfirm: () => { if (!sel) return; if (confirmRequired) this.setState({ confirmOpen: true }); else this._commit(); },

      confirmOpen: S.confirmOpen && !!sel,
      confirmCrown: h('span', { style: { display: 'inline-flex' } }, crown(24)),
      confirmCrownSm: h('span', { style: { display: 'inline-flex' } }, crown(16)),
      confirmTitle: sel ? ('Make ' + first + ' the owner?') : '',
      confirmBody: sel ? (sel.name + ' will gain full control of ' + squadName + '. You\u2019ll remain a member but lose owner privileges. Only they can transfer it back.') : '',
      confirmCta: 'Transfer Ownership',
      cancelConfirm: () => this.setState({ confirmOpen: false }),
      doTransfer: () => this._commit(),

      goBack: () => { (function(){try{return !!document.referrer&&new URL(document.referrer).origin===window.location.origin;}catch(e){return false;}})() ? window.history.back() : (window.location.href = 'Squad%20Settings.dc.html'); },
      toastOpen: !!S.toastMsg, toastMsg: S.toastMsg || '', toastIcon: crown(18), toastIconColor: toastColor,
    };
  }

  _commit() {
    const MEMBERS = { marcus: 'Marcus Vale', theo: 'Theo Brandt', dana: 'Dana Cole', lena: 'Lena Cross' };
    const squadName = this.props.squadName ?? 'Iron Vigil';
    const name = MEMBERS[this.state.selectedId] || 'The new owner';
    this.setState({ confirmOpen: false });
    this._toast(name + ' is now the owner of ' + squadName, 'positive');
    if (this._navT) clearTimeout(this._navT);
    this._navT = setTimeout(() => { window.location.href = 'Squad%20Settings.dc.html'; }, 1200);
  }
}
</script>
