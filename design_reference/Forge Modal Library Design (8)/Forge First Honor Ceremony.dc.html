<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/tokens/foundation.css">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/styles.css">
<script src="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background: var(--fl-bg-atmospheric); background-attachment: fixed; color: var(--fl-text-primary); font-family: var(--fl-font-sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--fl-bronze-primary); }
  a:hover { color: var(--fl-bronze-bright); }

  @keyframes flStrike { 0% { transform: scale(0.82); opacity: 0; } 55% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes flBloom { 0%, 100% { opacity: 0.5; transform: translate(-50%,-50%) scale(0.9); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } }
  @keyframes flSweep { 0% { transform: translateX(-150%) skewX(-16deg); opacity: 0; } 18% { opacity: 0.85; } 42% { opacity: 0; } 100% { transform: translateX(260%) skewX(-16deg); opacity: 0; } }
  @keyframes flFlicker { 0%, 100% { opacity: 0.9; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
  @keyframes flRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    [style*="flStrike"], [style*="flBloom"], [style*="flSweep"], [style*="flFlicker"], [style*="flRise"] { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</helmet>

<!-- faint app context so the ceremony overlay reads as sitting on a real screen -->
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; text-align:center;">
  <div style="max-width:340px; opacity:0.45;">
    <span style="font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--fl-text-bronze-label);">Forge Legacy</span>
    <p style="margin:14px 0 0; font-size:14px; line-height:1.6; color:var(--fl-text-tertiary);">Your first honor is struck.</p>
  </div>
</div>

<!-- ══ LIVE CEREMONY MODAL (real DS component, open) ══ -->
<div style="position:absolute; width:0; height:0; overflow:visible;">
  <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Modal" open="{{ open }}" dismissible="{{ false }}" on-close="{{ keepOpen }}" eyebrow="Honor Earned" artwork="{{ artwork }}" footer="{{ footer }}" dc-props="{{ modalProps }}" hint-size="1px,1px">
    <div style="animation:flRise 620ms var(--fl-ease-out) both; animation-delay:260ms; font-family:var(--fl-font-display); font-size:27px; font-weight:600; letter-spacing:-0.3px; line-height:1.14; color:var(--fl-text-primary); margin-bottom:12px;">Initiative</div>
    <div style="animation:flRise 620ms var(--fl-ease-out) both; animation-delay:420ms; font-size:14.5px; line-height:1.6; color:var(--fl-text-secondary);">You made your first move. The hardest step is behind you — the full forge is open.</div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    this._raf = requestAnimationFrame(() => this.forceUpdate());
  }
  componentWillUnmount() { if (this._raf) cancelAnimationFrame(this._raf); }

  renderVals() {
    const NS = (typeof window !== 'undefined' && window.ForgeLegacyVisualFoundation_5368b2) || {};
    const Button = NS.Button;
    const Insignia = NS.Insignia;
    const h = React.createElement;

    // ── Artwork slot: living forged medallion ──
    // Flame + a light-sweep crossing the inset face + a gentle flicker.
    const flame = h('div', {
      style: { position: 'relative', width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', color: 'var(--fl-bronze-bright)' },
    },
      h('span', { 'aria-hidden': 'true', style: { position: 'absolute', left: '50%', top: '56%', width: '86%', height: '86%', transform: 'translate(-50%,-50%)', borderRadius: '50%', background: 'radial-gradient(circle at 50% 60%, rgba(205,160,99,0.55), rgba(191,143,79,0.16) 45%, transparent 72%)', animation: 'flFlicker 2.6s var(--fl-ease-out) infinite', pointerEvents: 'none' } }),
      h('span', { style: { position: 'absolute', top: 0, left: 0, width: '55%', height: '100%', background: 'linear-gradient(90deg, transparent, rgba(230,202,156,0.5), transparent)', animation: 'flSweep 4.2s var(--fl-ease-out) 900ms infinite', pointerEvents: 'none' } }),
      h('svg', {
        width: 50, height: 50, viewBox: '0 0 24 24', fill: 'none',
        stroke: 'currentColor', strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round',
        style: { position: 'relative', filter: 'drop-shadow(0 0 11px rgba(205,160,99,0.7))', animation: 'flFlicker 2.6s var(--fl-ease-out) infinite' },
      }, h('path', { d: 'M12 3c.6 3.2 3.4 4.4 3.4 7.6a3.4 3.4 0 0 1-6.8 0c0-1 .3-1.7.7-2.3-1.9 1-3.3 3-3.3 5.4a5.3 5.3 0 0 0 10.6 0C16.6 8.4 13.9 6 12 3z' })));

    // Ambient forge-heat bloom breathing behind the medallion, then the
    // medallion itself striking in over the ceremony curve.
    const artwork = Insignia ? h('div', { style: { position: 'relative', display: 'inline-flex', animation: 'flStrike var(--fl-duration-ceremony) var(--fl-ease-soft-spring) both' } },
      h('span', { 'aria-hidden': 'true', style: { position: 'absolute', left: '50%', top: '50%', width: 232, height: 232, transform: 'translate(-50%,-50%)', borderRadius: '50%', background: 'radial-gradient(circle, rgba(191,143,79,0.38), rgba(191,143,79,0.09) 46%, transparent 70%)', filter: 'blur(3px)', animation: 'flBloom 3.4s var(--fl-ease-out) infinite', pointerEvents: 'none' } }),
      h(Insignia, { variant: 'honor', size: 'xl', artwork: flame, style: { position: 'relative', zIndex: 1 } })
    ) : null;

    // ── Footer: one primary, staged in last ──
    const btn = (props, label) => Button ? h(Button, props, label) : null;
    const keepOpen = () => {};
    const wrap = (delay, node) => h('div', { style: { animation: 'flRise 620ms var(--fl-ease-out) both', animationDelay: delay } }, node);
    const footer = Button ? [
      wrap('560ms', btn({ variant: 'primary', fullWidth: true, onClick: keepOpen }, 'Keep Building')),
      wrap('660ms', btn({ variant: 'text', fullWidth: true, onClick: keepOpen }, 'View Honor')),
    ] : null;

    // Bronze machined edge + faint forge-glow, matching the hero cards.
    const modalProps = {
      style: {
        border: '1px solid var(--fl-bronze-border)',
        boxShadow: 'var(--fl-border-inset-md), var(--fl-shadow-ambient), var(--fl-glow-subtle)',
      },
    };

    return { open: true, keepOpen, artwork, footer, modalProps };
  }
}
</script>
</body>
</html>
