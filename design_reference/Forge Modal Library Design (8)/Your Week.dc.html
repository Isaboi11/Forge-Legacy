<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/tokens/foundation.css">
  <link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/styles.css">
  <script src="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/_ds_bundle.js"></script>
  <style>
    body { margin:0; background:#07090B; }
    a { color: var(--fl-bronze-primary); text-decoration: none; }
    a:hover { color: var(--fl-bronze-bright); }
    ::-webkit-scrollbar { width:0; height:0; }
  </style>
</helmet>

<div style="min-height:100vh; background:var(--fl-bg-atmospheric); display:flex; flex-direction:column; align-items:center; gap:26px; padding:40px 20px 56px; font-family:var(--fl-font-sans); box-sizing:border-box;">

  <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
    <span style="font-size:10.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:var(--fl-text-bronze-label);">S-2 · Your Week</span>
    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
        <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Pill" size="sm" tone="{{ c.tone }}" on-click="{{ c.set }}" hint-size="auto,26px">{{ c.label }}</x-import>
      </sc-for>
    </div>
    <span style="font-size:12.5px; color:var(--fl-text-tertiary); max-width:420px; text-align:center; text-wrap:pretty;">{{ stateNote }}</span>
  </div>

  <div style="width:390px; height:844px; flex:none; position:relative; display:flex; flex-direction:column; background:var(--fl-charcoal-900); border:1px solid var(--fl-charcoal-500); border-radius:46px; overflow:hidden; box-shadow:0 60px 120px -40px rgba(0,0,0,0.9), 0 0 0 10px #0A0C0E;">

    <div style="flex:none; display:flex; align-items:center; justify-content:space-between; padding:14px 26px 2px; font-size:12.5px; font-weight:600; letter-spacing:0.3px; color:var(--fl-text-secondary);">
      <span>9:41</span>
      <span style="display:flex; align-items:center; gap:6px;">
        <span style="width:16px; height:9px; border:1px solid var(--fl-gray-600); border-radius:2px; display:inline-block;"></span>
        <span style="font-size:11px;">Forge</span>
      </span>
    </div>

    <div style="flex:none;">
      <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.AppBar" title="Your Week" serif="{{ true }}" on-back="{{ noop }}" transparent="{{ true }}" hint-size="100%,56px"></x-import>
    </div>

    <div style="flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:26px; padding:4px 18px 34px;">

      <sc-if value="{{ isLoaded }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex; flex-direction:column; gap:26px;">

          <div style="display:flex; flex-direction:column; gap:18px;">
            <div style="display:flex; align-items:center; gap:9px;">
              <span style="width:18px; height:1px; background:var(--fl-bronze-border); display:inline-block;"></span>
              <span style="font-size:10.5px; font-weight:700; letter-spacing:1.7px; text-transform:uppercase; color:var(--fl-text-bronze-label);">{{ dateRange }}</span>
            </div>

            <div style="display:flex; gap:15px; align-items:flex-start;">
              <img src="assets/coach-holt-mark.png" alt="Coach Holt" style="width:52px; height:52px; flex:none; border-radius:var(--fl-radius-round); object-fit:cover; border:1px solid var(--fl-bronze-border); box-shadow:var(--fl-shadow-image);">
              <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:8px;">
                <span style="font-size:9.5px; font-weight:700; letter-spacing:1.7px; text-transform:uppercase; color:var(--fl-text-bronze-label);">Holt · your coach</span>
                <p style="margin:0; font-size:14px; line-height:1.5; color:var(--fl-text-secondary); text-wrap:pretty;">{{ note }}</p>
              </div>
            </div>
          </div>

          <div style="position:relative; display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--fl-charcoal-700); border:var(--fl-border-subtle); border-radius:var(--fl-radius-lg); box-shadow:var(--fl-shadow-card); overflow:hidden;">
            <span style="position:absolute; top:0; left:16px; right:16px; height:1px; background:linear-gradient(90deg, transparent, rgba(205,160,99,0.38), transparent); pointer-events:none; z-index:1;"></span>
            <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
              <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px 8px; background:var(--fl-surface-elevated);">
                <span style="display:flex; align-items:baseline; gap:4px;">
                  <span style="font-family:var(--fl-font-display); font-size:25px; font-weight:600; letter-spacing:-0.4px; line-height:1; color:var(--fl-text-stat);">{{ s.value }}</span>
                  <span style="font-size:12px; font-weight:600; color:var(--fl-text-tertiary);">{{ s.unit }}</span>
                </span>
                <span style="font-size:10px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--fl-text-bronze-label);">{{ s.label }}</span>
              </div>
            </sc-for>
          </div>

          <sc-if value="{{ hasTopLift }}" hint-placeholder-val="{{ false }}">
            <div>
              <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.SectionHeader" label="Heaviest" hint-size="100%,20px"></x-import>
              <div style="padding:6px; border:var(--fl-border-subtle); border-radius:var(--fl-radius-lg); background:var(--fl-surface-card);">
                <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.ListRow" title="{{ topLift.name }}" value="{{ topLift.weight }}" value-unit="{{ topLift.unit }}" trailing="{{ nothing }}" hint-size="100%,56px"></x-import>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ hasPrs }}" hint-placeholder-val="{{ false }}">
            <div>
              <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.SectionHeader" label="Personal records" hint-size="100%,20px"></x-import>
              <div style="display:flex; flex-direction:column; gap:2px; padding:6px; border:var(--fl-border-subtle); border-radius:var(--fl-radius-lg); background:var(--fl-surface-card);">
                <sc-for list="{{ prs }}" as="p" hint-placeholder-count="2">
                  <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.ListRow" title="{{ p.name }}" value="{{ p.value }}" value-unit="lb" trailing="{{ nothing }}" hint-size="100%,56px"></x-import>
                </sc-for>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ hasHonors }}" hint-placeholder-val="{{ false }}">
            <div>
              <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.SectionHeader" label="Honors" hint-size="100%,20px"></x-import>
              <div style="display:flex; flex-direction:column; gap:2px; padding:8px 12px; border:var(--fl-border-subtle); border-radius:var(--fl-radius-lg); background:var(--fl-surface-card);">
                <sc-for list="{{ honors }}" as="h" hint-placeholder-count="1">
                  <div style="display:flex; align-items:center; gap:13px; padding:8px 0;">
                    <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Insignia" variant="honor" size="{{ 40 }}" placeholder-label="{{ h.initial }}" hint-size="40px,40px"></x-import>
                    <span style="font-size:15px; font-weight:600; color:var(--fl-text-primary); min-width:0;">{{ h.name }}</span>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; gap:26px; padding-top:10px;">
          <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Skeleton" variant="text" count="{{ 3 }}" hint-size="100%,72px"></x-import>
          <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Skeleton" variant="card" hint-size="100%,140px"></x-import>
          <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Skeleton" variant="row" count="{{ 2 }}" hint-size="100%,120px"></x-import>
        </div>
      </sc-if>

      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div style="padding-top:60px;">
          <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.EmptyState" title="Nothing to review yet" message="Reviews arrive the week after you train. Log a session and this fills in." hint-size="100%,220px"></x-import>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:1060}}">
const WEEKS = {
  plainest: {
    label: 'Plainest week',
    note: 'The emptiest real week: two sentences, no middle beat, no heaviest lift, no records, no honors. Volume is legitimately 0 \u2014 a bodyweight and cardio week.',
    dateRange: '3 \u2013 9 August 2026',
    holt: 'You trained 2 times. Same again this week.',
    stats: [
      { value: '2', unit: '', label: 'Sessions' },
      { value: '2', unit: '', label: 'Days' },
      { value: '0', unit: 'lb', label: 'Volume' },
      { value: '1:12:40', unit: '', label: 'Under iron' }
    ]
  },
  typical: {
    label: 'Typical week',
    note: 'What most athletes actually see: some volume, one heaviest lift, no records, no honors.',
    dateRange: '3 \u2013 9 August 2026',
    holt: '3 sessions this week. Heaviest was Barbell Back Squat at 315 lb. Keep it there.',
    stats: [
      { value: '3', unit: '', label: 'Sessions' },
      { value: '3', unit: '', label: 'Days' },
      { value: '24,180', unit: 'lb', label: 'Volume' },
      { value: '2:41:05', unit: '', label: 'Under iron' }
    ],
    topLift: { name: 'Barbell Back Squat', weight: '315', unit: 'lb × 5' }
  },
  loaded: {
    label: 'Loaded week',
    note: 'Every section present: heaviest, two records, one honor. Holt still states one fact \u2014 the sections carry the rest.',
    dateRange: '27 July \u2013 2 August 2026',
    holt: '6 sessions. That is a heavy week. 3 personal records in it. Recovery earns that back.',
    stats: [
      { value: '6', unit: '', label: 'Sessions' },
      { value: '5', unit: '', label: 'Days' },
      { value: '71,940', unit: 'lb', label: 'Volume' },
      { value: '5:38:22', unit: '', label: 'Under iron' }
    ],
    topLift: { name: 'Barbell Deadlift', weight: '405', unit: 'lb × 3' },
    prs: [
      { name: 'Barbell Deadlift', value: '405', unit: 'lb' },
      { name: 'Weighted Pull-Up', value: '70', unit: 'lb' }
    ],
    honors: [{ name: 'Iron Discipline', initial: 'ID' }]
  },
  loading: { label: 'Loading', note: 'The screen is reached from the card, so the frame and app bar are already true \u2014 only the contents wait.' },
  empty: { label: 'Unreachable empty', note: 'Only reachable by deep link. The card is the only real door, so this state is a safety net, not a destination.' }
};

class Component extends DCLogic {
  state = { wk: 'plainest' };

  renderVals() {
    const key = WEEKS[this.state.wk] ? this.state.wk : 'plainest';
    const w = WEEKS[key];
    const loaded = key !== 'loading' && key !== 'empty';
    return {
      chips: Object.keys(WEEKS).map(k => ({
        label: WEEKS[k].label,
        tone: k === key ? 'bronze' : 'muted',
        set: () => this.setState({ wk: k })
      })),
      stateNote: w.note,
      isLoaded: loaded,
      isLoading: key === 'loading',
      isEmpty: key === 'empty',
      dateRange: w.dateRange,
      note: w.holt,
      stats: w.stats || [],
      hasTopLift: !!w.topLift,
      topLift: w.topLift || {},
      hasPrs: !!(w.prs && w.prs.length),
      prs: w.prs || [],
      hasHonors: !!(w.honors && w.honors.length),
      honors: w.honors || [],
      nothing: null,
      noop: () => {}
    };
  }
}
</script>
</body>
</html>
