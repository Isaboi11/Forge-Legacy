<div style="min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:30px 16px;">

      </div>
    </sc-if>

    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">

      <!-- app bar -->

        <a href="Forge%20Programs%20Catalog.dc.html" aria-label="Back" style="width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; color:var(--fl-text-secondary);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
        <span style="flex:1; font-size:16px; font-weight:600; letter-spacing:0.2px; color:var(--fl-text-primary);">Templates</span>
        <button type="button" onClick="{{ onNew }}" aria-label="New template" style="width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; background:transparent; border:none; cursor:pointer; color:var(--fl-bronze-primary);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>

      <div class="fl-scroll" style="flex:1; min-height:0; overflow-y:auto; padding:18px 20px 26px; position:relative; z-index:1;">
        <p style="margin:0 0 18px; font-size:13px; line-height:1.5; color:var(--fl-text-tertiary); text-wrap:pretty;">Reusable workouts, ready whenever you are. Recently used templates appear first.</p>

        <sc-if value="{{ hasTemplates }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex; flex-direction:column; gap:12px; animation:wtRise 360ms var(--fl-ease-out, ease-out) both;">
            <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
              <div role="button" tabindex="0" onClick="{{ c.onOpen }}" style="cursor:pointer; border-radius:var(--fl-radius-xl); border:1px solid {{ c.border }}; background:{{ c.bg }}; box-shadow:var(--fl-border-inset), var(--fl-shadow-card); overflow:hidden;" style-hover="border-color:var(--fl-bronze-border);">
                <div style="padding:16px 16px 14px;">
                  <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
                    <div style="min-width:0;">
                      <span style="display:block; font-family:var(--fl-font-display); font-size:19px; font-weight:600; line-height:1.12; color:var(--fl-text-primary);">{{ c.name }}</span>
                      <span style="display:block; margin-top:5px; font-size:12px; color:var(--fl-text-tertiary);">{{ c.structure }}</span>
                    </div>
                    <span style="flex:none; display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:var(--fl-radius-pill); border:1px solid {{ c.usedBorder }}; background:{{ c.usedBg }};">
                      <span style="width:5px; height:5px; border-radius:50%; background:{{ c.usedDot }};"></span>
                      <span style="font-size:10px; font-weight:600; letter-spacing:0.3px; white-space:nowrap; color:{{ c.usedInk }};">{{ c.usedLabel }}</span>
                    </span>
                  </div>
                  <sc-if value="{{ c.hasPills }}" hint-placeholder-val="{{ true }}">
                    <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;">
                      <sc-for list="{{ c.pills }}" as="p" hint-placeholder-count="3">
                        <span style="padding:4px 9px; border-radius:var(--fl-radius-sm); border:1px solid var(--fl-charcoal-600); background:var(--fl-surface-recessed); font-size:9.5px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:var(--fl-text-secondary);">{{ p.label }}</span>
                      </sc-for>
                    </div>
                  </sc-if>
                </div>
                <div style="display:flex; align-items:stretch; border-top:1px solid var(--fl-charcoal-700);">
                  <button type="button" onClick="{{ c.onStart }}" style="flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; background:transparent; border:none; border-right:1px solid var(--fl-charcoal-700); cursor:pointer; color:var(--fl-bronze-bright); font-size:13px; font-weight:700; letter-spacing:0.4px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"></path></svg>Start</button>
                  <button type="button" onClick="{{ c.onOpen }}" style="flex:none; width:96px; display:flex; align-items:center; justify-content:center; gap:6px; padding:13px; background:transparent; border:none; cursor:pointer; color:var(--fl-text-tertiary); font-size:12.5px; font-weight:600;">Details<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
                </div>
              </div>
            </sc-for>
          </div>

          <button type="button" onClick="{{ onNew }}" style="width:100%; margin-top:14px; display:flex; align-items:center; justify-content:center; gap:8px; padding:14px; border-radius:var(--fl-radius-lg); border:1px dashed var(--fl-bronze-border); background:var(--fl-bronze-tint); color:var(--fl-bronze-bright); font-size:13.5px; font-weight:600; letter-spacing:0.3px; cursor:pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>New Template</button>
        </sc-if>

        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="padding:60px 24px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px;">
            <span style="width:58px; height:58px; border-radius:var(--fl-radius-md); border:1px solid var(--fl-charcoal-600); background:var(--fl-surface-recessed); display:flex; align-items:center; justify-content:center; color:var(--fl-bronze-primary);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></span>
            <span style="font-family:var(--fl-font-display); font-size:22px; font-weight:600; color:var(--fl-text-primary);">No templates yet</span>
            <span style="font-size:13.5px; line-height:1.55; color:var(--fl-text-secondary); max-width:250px;">Build a reusable workout once and start it any time — no program required.</span>
            <button type="button" onClick="{{ onNew }}" style="margin-top:6px; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px 22px; border-radius:var(--fl-radius-md); border:1px solid var(--fl-bronze-metal-border); background:var(--fl-bronze-fill); color:#F7F5F1; font-size:14px; font-weight:700; letter-spacing:0.4px; cursor:pointer; box-shadow:var(--fl-bronze-metal-top-rim), var(--fl-shadow-card); text-shadow:0 1px 1px rgba(8,5,2,0.5);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>Create Template</button>
          </div>
        </sc-if>
      </div>

      <div aria-hidden="true" style="position:absolute; inset:0; pointer-events:none; z-index:20; opacity:0.06; mix-blend-mode:overlay; background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E'); background-size:160px 160px;"></div>

    </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: false, tick: 0 };

  componentDidMount() {
    this._poll = () => {
      const r = typeof React !== 'undefined' && React && React.createElement;
      const ns = typeof window !== 'undefined' && window.ForgeLegacyVisualFoundation_5368b2;
      const store = typeof window !== 'undefined' && window.ForgeTemplates;
      if (r && ns && store) this.setState({ ready: true });
      else this._t = setTimeout(this._poll, 40);
    };
    this._poll();
  }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); }

  _rel(ts) {
    if (!ts) return 'Never used';
    const day = 86400000, d = Date.now() - ts;
    if (d < day) return 'Today';
    const days = Math.round(d / day);
    if (days === 1) return 'Yesterday';
    if (days < 7) return days + ' days ago';
    const wk = Math.round(days / 7);
    if (wk < 5) return wk === 1 ? '1 week ago' : wk + ' weeks ago';
    const mo = Math.round(days / 30);
    return mo === 1 ? '1 month ago' : mo + ' months ago';
  }

  _label(items) {
    const MGROUP = { Chest: 'Chest', 'Upper Chest': 'Chest', Back: 'Back', Lats: 'Back', Shoulders: 'Shoulders', 'Side Delts': 'Shoulders', 'Rear Delts': 'Shoulders', Biceps: 'Arms', Triceps: 'Arms', Forearms: 'Arms', Traps: 'Back', Quads: 'Legs', Glutes: 'Legs', Hamstrings: 'Legs', Abs: 'Core', Core: 'Core' };
    const cnt = {};
    items.forEach((it) => (it.muscles || []).forEach((m) => { const g = MGROUP[m]; if (g) cnt[g] = (cnt[g] || 0) + 1; }));
    return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
  }

  _start(t) {
    if (window.ForgeTemplates) window.ForgeTemplates.startSession(t);   // snapshot; use is recorded when the session initializes
    window.location.href = 'Forge%20Active%20Workout.dc.html';
  }

  renderVals() {
    if (!this.state.ready) return { ready: false, notReady: true };
    const T = window.ForgeTemplates;
    const list = T.all().slice();
    // sort: recently-used first (desc), never-used after (by createdAt desc)
    list.sort((a, b) => {
      if (a.lastUsedAt && b.lastUsedAt) return b.lastUsedAt - a.lastUsedAt;
      if (a.lastUsedAt) return -1;
      if (b.lastUsedAt) return 1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });

    const cards = list.map((t) => {
      const count = T.exerciseCount(t);
      const est = T.estMinutes(t);
      const used = !!t.lastUsedAt;
      const groups = this._label(t.main.length ? t.main : t.warmup.concat(t.cooldown)).slice(0, 3);
      return {
        id: t.id,
        name: t.name,
        structure: count + (count === 1 ? ' exercise' : ' exercises') + ' · ~' + est + ' min',
        hasPills: groups.length > 0,
        pills: groups.map((g, i) => ({ key: i, label: g })),
        usedLabel: used ? ('Used ' + t.useCount + '×') : 'New',
        usedDot: used ? 'var(--fl-bronze-primary)' : 'var(--fl-charcoal-500)',
        usedBg: used ? 'var(--fl-surface-recessed)' : 'var(--fl-surface-recessed)',
        usedBorder: 'var(--fl-charcoal-600)',
        usedInk: 'var(--fl-text-tertiary)',
        border: used ? 'var(--fl-bronze-border-subtle)' : 'var(--fl-charcoal-600)',
        bg: 'var(--fl-surface-card)',
        onOpen: () => { window.location.href = 'Forge%20Workout%20Template%20Detail.dc.html?id=' + encodeURIComponent(t.id); },
        onStart: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this._start(t); },
      };
    });

    return {
      ready: true, notReady: false,
      hasTemplates: cards.length > 0,
      isEmpty: cards.length === 0,
      cards,
      onNew: () => { try { localStorage.removeItem('forge_template_draft_v1'); localStorage.removeItem('forge_template_inbox_v1'); } catch (e) {} window.location.href = 'Forge%20Free%20Workout%20Builder.dc.html'; },
    };
  }
}
</script>
