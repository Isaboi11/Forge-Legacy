    });

    // ── Filters ──
    const chip = (active) => ({ flex: 'none', padding: '8px 15px', borderRadius: 'var(--fl-radius-pill)', border: '1px solid ' + (active ? 'var(--fl-bronze-border)' : 'var(--fl-charcoal-500)'), background: active ? 'var(--fl-bronze-metallic)' : 'var(--fl-surface-card)', color: active ? '#1A1206' : 'var(--fl-text-primary)', fontSize: '12.5px', fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap', transition: 'background 180ms var(--fl-ease-out), color 180ms var(--fl-ease-out), border-color 180ms ease' });
    const filters = CATS.map(cat => ({ key: cat, label: cat, style: chip(S.category === cat), select: () => this.setState({ category: cat }) }));

    // ── Filtering ──
    const q = S.query.trim().toLowerCase();
    const filtered = COMMUNITIES.filter(s => (S.category === 'All' || s.cat === S.category) && (!q || s.name.toLowerCase().includes(q) || s.motto.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q) || (s.tags || '').includes(q)));

    // ── Tag styles (uniform width so Public / Private align) ──
    const tagBase = { flex: 'none', minWidth: '86px', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '5px', padding: '4px 10px', borderRadius: 'var(--fl-radius-pill)', fontSize: '10.5px', fontWeight: 600, letterSpacing: '0.3px' };
    const tagPublic = Object.assign({}, tagBase, { background: 'rgba(110,142,116,0.13)', border: '1px solid rgba(110,142,116,0.34)', color: '#8FB295' });
    const tagPrivate = Object.assign({}, tagBase, { background: 'var(--fl-bronze-tint)', border: '1px solid var(--fl-bronze-border-subtle)', color: 'var(--fl-bronze-bright)' });

    // ── Action button styles ──
    const btnJoin = { width: '100%', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '8px', padding: '11px', borderRadius: 'var(--fl-radius-md)', border: '1px solid var(--fl-bronze-border)', background: 'var(--fl-bronze-fill)', color: 'var(--fl-bronze-bright)', fontSize: '13.5px', fontWeight: 600, cursor: 'pointer', boxShadow: 'var(--fl-glow-subtle)', transition: 'transform 120ms var(--fl-ease-out), opacity 120ms ease' };
    const btnRequest = { width: '100%', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '8px', padding: '11px', borderRadius: 'var(--fl-radius-md)', border: '1px solid var(--fl-bronze-border)', background: 'transparent', color: 'var(--fl-bronze-bright)', fontSize: '13.5px', fontWeight: 600, cursor: 'pointer', transition: 'transform 120ms var(--fl-ease-out), background 160ms ease' };
    const btnDone = { width: '100%', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '8px', padding: '11px', borderRadius: 'var(--fl-radius-md)', border: '1px solid var(--fl-charcoal-600)', background: 'var(--fl-charcoal-800)', color: 'var(--fl-text-secondary)', fontSize: '13.5px', fontWeight: 600, cursor: 'pointer', transition: 'background 160ms ease' };

    const fmt = (n) => n >= 1000 ? (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'k' : ('' + n);

    const communities = filtered.map(s => {
      const state = S.membership[s.id] || null;
      const isPublic = s.join === 'public';
      const openDetail = () => { const cs = window.ForgeCommunities; if (cs) cs.setActive(s.id); else { try { window.localStorage.setItem('forge.community', s.id); } catch (e) {} } const joined = (S.membership[s.id] || (cs && cs.state(s.id))) === 'joined'; window.location.href = joined ? 'Community%20Home.dc.html' : 'Community%20Profile.dc.html'; };
      let btnStyle, btnLabel, btnIcon, action;
      if (state === 'joined') {
        btnStyle = btnDone; btnLabel = 'Joined'; btnIcon = checkIcon;
        action = (e) => { if (e && e.stopPropagation) e.stopPropagation(); openDetail(); };
      } else if (state === 'requested') {
        btnStyle = btnDone; btnLabel = 'Request Sent'; btnIcon = checkIcon;
        action = (e) => { if (e && e.stopPropagation) e.stopPropagation(); try { if (window.ForgeCommunities) window.ForgeCommunities.withdraw(s.id); } catch (er) {} this.setState(st => { const m = Object.assign({}, st.membership); delete m[s.id]; return { membership: m }; }); this._toast('Request to ' + s.name + ' withdrawn', 'bronze'); };
      } else if (isPublic) {
        btnStyle = btnJoin; btnLabel = 'Join Community'; btnIcon = plusIcon;
        action = (e) => { if (e && e.stopPropagation) e.stopPropagation(); try { if (window.ForgeCommunities) window.ForgeCommunities.join(s.id); } catch (er) {} this.setState(st => ({ membership: Object.assign({}, st.membership, { [s.id]: 'joined' }) })); try { if (window.ForgeGate) window.ForgeGate.unlock('community_joined'); } catch (er) {} this._toast('You joined ' + s.name, 'positive'); };
      } else {
        btnStyle = btnRequest; btnLabel = 'Request to Join'; btnIcon = plusIcon;
        action = (e) => { if (e && e.stopPropagation) e.stopPropagation(); try { if (window.ForgeCommunities) window.ForgeCommunities.request(s.id); } catch (er) {} this.setState(st => ({ membership: Object.assign({}, st.membership, { [s.id]: 'requested' }) })); this._toast('Request sent to ' + s.name, 'bronze'); };
      }
      const tagStyle = isPublic ? tagPublic : tagPrivate;
      const tagLabel = isPublic ? 'Public' : 'Private';
      const tagIcon = isPublic ? globeIcon : lockIcon;
      return {
        key: s.id, name: s.name, motto: s.motto,
        crest: h('span', { style: { display: 'inline-flex' } }, ic(s.crest, 26, 1.6)),
        mostActive: s.id === mostActiveId, sparkIcon: sparkIcon,
        tagStyle: tagStyle,
        tagIcon: h('span', { style: { display: 'inline-flex' } }, tagIcon),
        tagLabel: tagLabel,
        stats: [
          { key: 'm', icon: h('span', { style: { display: 'inline-flex' } }, membersGlyph), text: fmt(s.members) + ' members' },
          { key: 'p', icon: h('span', { style: { display: 'inline-flex' } }, activityGlyph), text: s.posts + ' posts/week' },
        ],
        openDetail: openDetail,
        btnStyle: btnStyle, btnLabel: btnLabel, btnIcon: h('span', { style: { display: 'inline-flex' } }, btnIcon), action: action,
      };
    });

    const n = filtered.length;
    const toastColor = S.toastTone === 'positive' ? '#6E8E74' : 'var(--fl-icon-bronze)';
    const searching = q.length > 0;
    const emptyTitle = searching ? 'No communities found' : 'No communities in this category';
    const emptyText = searching ? 'Try another search or category.' : 'Check back later, or start one yourself.';

    return {
      ready: true, notReady: false,
      searchIcon: searchIcon, query: S.query, onSearch: (e) => this.setState({ query: e.target.value }),
      filters: filters,
      browseCats: browseCats,
      showBrowse: S.category === 'All' && q.length === 0,
      showChips: !(S.category === 'All' && q.length === 0),
      resultsLabel: S.category === 'All' ? 'Public Communities' : S.category,
      resultsCount: n + (n === 1 ? ' community' : ' communities'),
      showSkeleton: S.loading, showResults: !S.loading && n > 0, isEmpty: !S.loading && n === 0, communities: communities,
      skeletons: [{ key: 'k1' }, { key: 'k2' }, { key: 'k3' }],

      emptyIcon: h('span', { style: { display: 'inline-flex' } }, communityGlyph(30, 1.6)),
      emptyTitle: emptyTitle, emptyText: emptyText,
      createGlyph: h('span', { style: { display: 'inline-flex' } }, plusIcon),
      goCreate: () => { window.location.href = 'Create%20Community.dc.html'; },

      goBack: () => {
        // Unwind in-screen state first: a category filter or active search returns to the browse grid.
        if (S.category !== 'All' || (S.query && S.query.trim())) { this.setState({ category: 'All', query: '' }); return; }
        var sameApp = false; try { sameApp = !!document.referrer && new URL(document.referrer).origin === window.location.origin; } catch (e) {}
        if (sameApp) window.history.back(); else window.location.href = 'Community%20Home.dc.html';
      },
      toastOpen: !!S.toastMsg, toastMsg: S.toastMsg || '', toastIcon: communityGlyph(18, 1.7), toastIconColor: toastColor,
    };
  }
}
</script>
</body>
</html>
