<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:transparent; }
  img { -webkit-user-drag:none; user-select:none; }
</style>
</helmet>
<div style="width:100%; display:flex; align-items:center; justify-content:center;">
  <img src="{{ src }}" alt="{{ alt }}" style="width:100%; height:auto; display:block;">
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:250,&quot;height&quot;:395},&quot;rank&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;foundation&quot;,&quot;builder&quot;,&quot;craftsman&quot;,&quot;architect&quot;,&quot;established&quot;,&quot;hall&quot;,&quot;legacy&quot;],&quot;default&quot;:&quot;foundation&quot;,&quot;tsType&quot;:&quot;'foundation' | 'builder' | 'craftsman' | 'architect' | 'established' | 'hall' | 'legacy'&quot;,&quot;label&quot;:&quot;Rank family&quot;},&quot;tier&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;2&quot;,&quot;3&quot;,&quot;4&quot;],&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;1 | 2 | 3 | 4&quot;,&quot;label&quot;:&quot;Sub-rank (I–IV)&quot;},&quot;sex&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;m&quot;,&quot;f&quot;],&quot;default&quot;:&quot;m&quot;,&quot;tsType&quot;:&quot;'m' | 'f'&quot;,&quot;label&quot;:&quot;Sex (established art only)&quot;}}">
class Component extends DCLogic {
  // Shared rank-badge asset. `rank` selects the family, `tier` the sub-rank (I–IV).
  // Renders the transparent badge cutout at assets/{rank}-{tier}.png.
  // The `established` family has gendered artwork — its cutout is
  // assets/established-{m|f}-{tier}.png. Sex comes from the `sex` prop, else the
  // canonical user (ForgeUser.sex), else male.
  renderVals() {
    const rank = ((this.props && this.props.rank) || 'foundation').toLowerCase();
    const tier = Math.max(1, Math.min(4, parseInt((this.props && this.props.tier), 10) || 1));
    const SUB = {
      foundation: ['', 'The Spark', 'The Flame', 'The Forge', 'The Hearth'],
      builder: ['', 'The First Step', 'The Marked Path', 'The Worn Trail', 'The Enduring Way'],
      craftsman: ['', 'The Foundation', 'The Practice', 'The Refinement', 'The Mastery'],
      architect: ['', 'The Vision', 'The Framework', 'The Integration', 'The Architect'],
      established: ['', 'The Builder', 'The Caretaker', 'The Oak Stands', 'The Established Oak'],
      hall: ['', 'The Threshold', 'The Passage', 'The Revelation', 'Among Legends'],
      legacy: ['', 'The Discovery', 'The Ascent', 'The Presence', 'The Legacy']
    };
    const roman = ['', 'I', 'II', 'III', 'IV'][tier];
    const fam = rank.charAt(0).toUpperCase() + rank.slice(1);
    const label = fam + ' ' + roman + ' \u00B7 ' + ((SUB[rank] || SUB.foundation)[tier]);
    let src;
    if (rank === 'established') {
      let sex = (this.props && this.props.sex);
      if (!sex && window.ForgeUser && window.ForgeUser.get) { try { sex = window.ForgeUser.get().sex; } catch (e) {} }
      sex = (String(sex || 'm').toLowerCase().charAt(0) === 'f') ? 'f' : 'm';
      src = 'assets/established-' + sex + '-' + tier + '.png';
    } else {
      src = 'assets/' + rank + '-' + tier + '.png';
    }
    return { src: src, alt: label };
  }
}
</script>
</body>
</html>
