document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

B;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"7410f30e-dca3-408a-a882-5271f8feb218\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"79dac85f-6a98-428f-ae08-d82576d6f350\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"78382380-2ca0-4a32-bb02-fd24657aa512\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"898d21c9-5484-433b-8d38-b4eb3e25c48c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7410f30e-dca3-408a-a882-5271f8feb218\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"79dac85f-6a98-428f-ae08-d82576d6f350\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/**\n * Forge Legacy — Visual Foundation\n * Material / atmosphere layer built ON TOP OF the canonical hex values in\n * src/constants/tokens.ts. Hex values below are copied 1:1 from that file —\n * this stylesheet does not invent new base colors, it defines how they\n * behave as materials (gradients, glow, shadow, border, imagery treatment).\n *\n * Source of truth for raw hex: src/constants/tokens.ts (_palette)\n * Source of truth for this material layer: this file.\n */\n\n:root {\n  /* ============================================================\n     CORE PALETTE — copied from src/constants/tokens.ts (_palette)\n     ============================================================ */\n  --fl-base:          #05080A;\n  --fl-charcoal-900:  #0C1013;\n  --fl-charcoal-800:  #131517;\n  --fl-charcoal-700:  #1A1A1E;\n  --fl-charcoal-600:  #24242A;\n  --fl-charcoal-500:  #2E2E35;\n\n  --fl-cream-100:     #F0EDE8;\n  --fl-gray-400:      #9E9890;\n  --fl-gray-600:      #666060;\n\n  --fl-bronze-300:    #CDA063;\n  --fl-bronze-400:    #BF8F4F;\n  --fl-bronze-600:    #7A6040;\n  --fl-bronze-dark:   #574029;\n  --fl-bronze-glow-a: rgba(186, 146, 92, 0.10);\n\n  --fl-green-muted:   #5A9E68;\n  --fl-red-muted:     #BE5A4C;\n  --fl-blue-muted:    #568AAE;\n\n  --fl-overlay-dark:       rgba(0, 0, 0, 0.75);\n  --fl-inner-highlight:    rgba(255, 255, 255, 0.04);\n  --fl-inner-highlight-md: rgba(255, 255, 255, 0.07);\n\n  /* ============================================================\n     BACKGROUND LANGUAGE\n     Never flat black — a cold, dark blue-black steel base (the \"cold iron\").\n     Warmth is reserved for bronze accents and imagery embers; it never lives\n     in the chrome itself. A faint cool apex reads as distant night sky.\n     ============================================================ */\n  --fl-bg-primary:  var(--fl-charcoal-900);\n  --fl-bg-secondary: var(--fl-charcoal-800);\n\n  --fl-bg-atmospheric:\n    radial-gradient(130% 85% at 50% -8%, rgba(88,124,160,0.06) 0%, rgba(88,124,160,0) 48%),\n    linear-gradient(180deg, #0B0F13 0%, var(--fl-charcoal-900) 44%, var(--fl-base) 100%);\n\n  /* Bottom-weighted scrim used over any photograph or landscape layer */\n  --fl-bg-cinematic:\n    linear-gradient(180deg, rgba(6,9,12,0) 0%, rgba(6,9,12,0.35) 45%, rgba(6,9,12,0.75) 78%, rgba(6,9,12,0.96) 100%);\n\n  /* Faint drifting warm/cool haze, layered above atmospheric bg for depth */\n  --fl-bg-smoke:\n    radial-gradient(55% 45% at 18% 6%, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0) 60%),\n    radial-gradient(50% 42% at 88% 18%, rgba(96,130,165,0.06) 0%, rgba(96,130,165,0) 62%),\n    radial-gradient(70% 60% at 50% 110%, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 60%);\n\n  /* ============================================================\n     SURFACE MATERIALS — forged steel, never a flat gray rectangle.\n     Each surface carries a faint top-to-bottom gradient + inset\n     top highlight, as if catching light along its upper edge.\n     ============================================================ */\n  --fl-surface-card:     linear-gradient(180deg, #181A1C 0%, var(--fl-charcoal-800) 100%);\n  --fl-surface-elevated: linear-gradient(180deg, #1F2024 0%, var(--fl-charcoal-700) 100%);\n  --fl-surface-recessed: linear-gradient(180deg, var(--fl-base) 0%, #0C0C0E 100%);\n  --fl-surface-panel:    var(--fl-charcoal-800);\n  --fl-surface-modal:    linear-gradient(180deg, #232329 0%, #1E1E23 100%);\n  --fl-surface-nav:      rgba(13, 13, 15, 0.92);\n\n  /* ============================================================\n     BRONZE MATERIAL SYSTEM\n     Warm, weathered, brushed metal — never yellow, orange,\n     champagne, white-gold, or neon.\n     ============================================================ */\n  --fl-bronze-primary:  var(--fl-bronze-400);   /* earned / active / progress */\n  --fl-bronze-bright:   var(--fl-bronze-300);   /* pressed / highlight state */\n  --fl-bronze-mid:      var(--fl-bronze-600);   /* muted accent, track tint */\n  --fl-bronze-deep:     var(--fl-bronze-dark);  /* weathered / recessed bronze */\n\n  /* Brushed-metal sweep — use as a thin highlight bar, never a full fill */\n  --fl-bronze-metallic:\n    linear-gradient(115deg,\n      var(--fl-bronze-mid) 0%,\n      var(--fl-bronze-primary) 38%,\n      var(--fl-bronze-bright) 50%,\n      var(--fl-bronze-primary) 62%,\n      var(--fl-bronze-deep) 100%);\n\n  --fl-bronze-border:        rgba(186, 146, 92, 0.40);\n  --fl-bronze-border-subtle: rgba(186, 146, 92, 0.19);\n  --fl-bronze-glow-ring:     0 0 24px 2px rgba(186, 146, 92, 0.22);\n\n  /* Warm forge-lit bronze highlight — the Home-canonical inner-highlight hue,\n     a touch warmer than the base bronze-glow rgba. LOCKED from the Home Screen;\n     the two near-identical inline variants (198,156,100 / 202,162,106) are now\n     reconciled to this single value. */\n  --fl-bronze-warm: 198, 156, 100; /* @kind color */\n\n  /* Sanctioned FORGED-METAL fill — the one exception to \"bronze is never a\n     large fill.\" Primary action button only. Reads as forged bronze catching\n     light: a polished bright top rim, deep bronze body, a strong bright bronze\n     specular band across the middle, deepest at the base. Hue stays in\n     bronze / burnished copper / brushed brass — never walnut or chocolate. */\n  --fl-bronze-fill:\n    linear-gradient(180deg,\n      #8A6A3E 0%,      /* thin polished top edge — reflected light, not a stripe */\n      #573F24 6%,\n      #3D2F1A 26%,\n      #2E2314 50%,     /* darkest forged-bronze core — center darker than the edges */\n      #342817 72%,\n      #42321C 92%,\n      #4A3822 97%,     /* soft reflected bottom edge */\n      #382A18 100%); /* @kind color */\n  --fl-bronze-fill-hover:\n    linear-gradient(180deg,\n      #A17E4A 0%,      /* hover: edges catch more light, the body barely lifts */\n      #63492A 6%,\n      #43331C 26%,\n      #322616 50%,\n      #382B19 72%,\n      #493720 92%,\n      #52402A 97%,\n      #3D2E1A 100%); /* @kind color */\n\n  /* Brushed-metal grain, layered OVER the fill. Dialed right down so it only\n     appears on close inspection — forged, not barcoded. */\n  --fl-bronze-brush:\n    repeating-linear-gradient(90deg,\n      rgba(255, 244, 214, 0.003) 0px, rgba(255, 244, 214, 0.003) 1px,\n      rgba(0, 0, 0, 0.004) 1px,       rgba(0, 0, 0, 0.004) 4px); /* @kind color */\n\n  /* Directional forged-metal lighting: a polished bright TOP edge, darker\n     SIDES (so the face reads slightly rounded), a faint reflected BOTTOM\n     light, and a tight top-biased glow that hugs the button. */\n  --fl-bronze-metal-border:       rgba(174, 136, 86, 0.55); /* @kind color */\n  --fl-bronze-metal-border-hover: rgba(196, 158, 104, 0.60); /* @kind color */\n  --fl-bronze-metal-top-rim:      inset 0 1px 0 rgba(222, 190, 148, 0.42); /* @kind shadow */\n  --fl-bronze-metal-bottom-rim:   inset 0 -1px 1px rgba(176, 134, 80, 0.14); /* @kind shadow */\n  --fl-bronze-metal-sides:        inset 10px 0 16px -12px rgba(0, 0, 0, 0.50), inset -10px 0 16px -12px rgba(0, 0, 0, 0.50); /* @kind shadow */\n  --fl-glow-forge:       0 0 2px rgba(186, 144, 90, 0.14);\n  --fl-glow-forge-hover: 0 0 4px rgba(198, 156, 100, 0.22), 0 0 1px rgba(198, 156, 100, 0.26);\n\n  /* Inactive primary — cool charcoal, desaturated bronze rim, no glow. */\n  --fl-bronze-fill-disabled:\n    linear-gradient(180deg, #1C1E22 0%, #15171B 100%); /* @kind color */\n  --fl-bronze-border-disabled: rgba(150, 140, 122, 0.22); /* @kind color */\n\n  /* Destructive — the SAME forged model as primary, in muted red: a dark forged\n     red-tinted body, a deep muted-red machined rim, a thin red edge highlight,\n     shaded sides, and an extremely subtle red glow. */\n  --fl-red-fill:\n    linear-gradient(180deg,\n      #2A1F1E 0%,      /* thin lit top edge */\n      #1E1615 8%,\n      #171111 50%,     /* dark forged center */\n      #1B1413 92%,\n      #241A19 97%,     /* soft reflected bottom edge */\n      #1B1413 100%); /* @kind color */\n  --fl-red-fill-hover:\n    linear-gradient(180deg,\n      #342624 0%,\n      #241918 8%,\n      #191212 50%,\n      #1F1615 92%,\n      #2B1F1D 97%,\n      #1F1615 100%); /* @kind color */\n  --fl-red-metal-border:       rgba(150, 74, 66, 0.72); /* @kind color */\n  --fl-red-metal-border-hover: rgba(178, 92, 82, 0.80); /* @kind color */\n  --fl-red-metal-top-rim:      inset 0 1px 0 rgba(190, 104, 92, 0.32); /* @kind shadow */\n  --fl-glow-red:       0 0 2px rgba(150, 70, 62, 0.16);\n  --fl-glow-red-hover: 0 0 4px rgba(170, 84, 74, 0.24), 0 0 1px rgba(170, 84, 74, 0.28);\n\n  /* ============================================================\n     BORDERS — machined, not drawn.\n     ============================================================ */\n  --fl-border-subtle:   1px solid var(--fl-charcoal-600);\n  --fl-border-bronze:   1px solid var(--fl-bronze-border);\n  --fl-border-active:   1.5px solid var(--fl-bronze-primary);\n  --fl-border-inset:    inset 0 1px 0 var(--fl-inner-highlight);\n  --fl-border-inset-md: inset 0 1px 0 var(--fl-inner-highlight-md);\n\n  /* ============================================================\n     RADIUS — one machined-corner scale for the whole system.\n     ============================================================ */\n  --fl-radius-xs:    6px;   /* @kind radius */\n  --fl-radius-sm:    8px;   /* @kind radius */\n  --fl-radius-md:    10px;  /* @kind radius */\n  --fl-radius-lg:    12px;  /* @kind radius */\n  --fl-radius-xl:    16px;  /* @kind radius */\n  --fl-radius-round: 50%;   /* @kind radius */\n  --fl-radius-pill:  999px; /* @kind radius */\n\n  /* ============================================================\n     SHADOWS — weight without obvious blur.\n     ============================================================ */\n  --fl-shadow-card:     0 2px 8px rgba(0, 0, 0, 0.35);\n  --fl-shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.5);\n  --fl-shadow-modal:    0 8px 24px rgba(0, 0, 0, 0.65);\n  --fl-shadow-image:    0 6px 20px rgba(0, 0, 0, 0.55);\n  --fl-shadow-ambient:  0 20px 60px rgba(0, 0, 0, 0.45);\n  --fl-shadow-float:    0 12px 28px rgba(0, 0, 0, 0.4);\n\n  /* Canonical forged-card treatments — LOCKED from the Home Screen.\n     hero = the Mission card; soft = secondary/list cards. Each carries a warm\n     inner top-highlight, a deep tight drop, and a faint bronze heat-glow. */\n  --fl-card-hero-wash:    linear-gradient(180deg, rgba(198,156,100,0.07) 0%, rgba(198,156,100,0) 42%); /* @kind color */\n  --fl-shadow-card-hero:  inset 0 1px 0 rgba(198,156,100,0.30), 0 18px 40px -24px rgba(0,0,0,0.82), 0 0 18px -6px rgba(186,146,92,0.11);\n  --fl-shadow-card-soft:  inset 0 1px 0 rgba(198,156,100,0.22), 0 12px 30px -24px rgba(0,0,0,0.72), 0 0 15px -6px rgba(186,146,92,0.09);\n\n  /* ============================================================\n     GLOW — heat from forged metal. Warm, restrained, localized. Metal glow\n     sits at the bronze accent hue; imagery embers (sunset behind a hero photo)\n     run deeper and more orange.\n     ============================================================ */\n  --fl-glow-ember:  radial-gradient(circle, rgba(186, 146, 92, 0.22) 0%, rgba(186, 146, 92, 0) 70%); /* @kind color */\n  --fl-glow-subtle: 0 0 20px rgba(186, 146, 92, 0.14);\n  --fl-glow-badge:  0 0 16px rgba(186, 146, 92, 0.28);\n  --fl-glow-focus:  drop-shadow(0 0 8px rgba(186, 146, 92, 0.5)); /* @kind other */\n\n  /* Deep sunset ember for imagery/hero embers — richer, more orange than metal\n     glow (matches the forge-light behind the hero and legacy photography). */\n  --fl-ember-sunset: #BD7829; /* @kind color */\n  --fl-glow-ember-deep:\n    radial-gradient(circle,\n      rgba(201, 128, 44, 0.55) 0%,\n      rgba(150, 84, 30, 0.24) 40%,\n      rgba(120, 66, 24, 0) 72%); /* @kind color */\n\n  /* Ember flame accent — the heat/flame icon stroke (Start Workout). LOCKED. */\n  --fl-ember-flame: #E0913F; /* @kind color */\n\n  /* Live / online status — the \"training now\" presence indicator. LOCKED. */\n  --fl-status-online:      #4CAF6E; /* @kind color */\n  --fl-status-online-glow: 0 0 6px rgba(76, 175, 110, 0.6); /* @kind shadow */\n\n  /* ============================================================\n     INTERACTION TINTS — faint washes for hover / active states.\n     ============================================================ */\n  --fl-hover-wash:  rgba(255, 255, 255, 0.02); /* @kind color */\n  --fl-bronze-tint: rgba(186, 146, 92, 0.05);  /* @kind color */\n\n  /* ============================================================\n     TYPOGRAPHY — FAMILIES\n     Sans carries labels, stats, and body. The display serif is\n     reserved for hero names, screen titles, and the legacy statement.\n     ============================================================ */\n  --fl-font-sans:    -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; /* @kind font */\n  --fl-font-display: \"Playfair Display\", Georgia, \"Times New Roman\", serif; /* @kind font */\n  --fl-font-mono:    ui-monospace, SFMono-Regular, Menlo, monospace; /* @kind font */\n\n  /* ============================================================\n     TYPOGRAPHY COLORS\n     ============================================================ */\n  --fl-text-primary:      var(--fl-cream-100);\n  --fl-text-secondary:    var(--fl-gray-400);\n  --fl-text-tertiary:     var(--fl-gray-600);\n  --fl-text-bronze-label: var(--fl-bronze-primary);\n  --fl-text-stat:         var(--fl-cream-100);\n\n  /* ============================================================\n     ICON TREATMENT — engraved into the interface, not floating on it.\n     ============================================================ */\n  --fl-icon-bronze:           var(--fl-bronze-primary);\n  --fl-icon-inactive:         var(--fl-gray-600);\n  --fl-icon-active:           var(--fl-bronze-primary);\n  --fl-icon-container-bg:     var(--fl-charcoal-800);\n  --fl-icon-container-border: var(--fl-bronze-border-subtle);\n\n  /* ============================================================\n     MOTION — deliberate, heavy, smooth. Never bouncy or exaggerated.\n     ============================================================ */\n  --fl-ease-out:  cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --fl-ease-in:   cubic-bezier(0.7, 0, 0.84, 0); /* @kind other */\n  --fl-ease-soft-spring: cubic-bezier(0.34, 1.1, 0.64, 1); /* @kind other */\n  --fl-duration-toggle:  50ms; /* @kind other */\n  --fl-duration-standard: 250ms; /* @kind other */\n  --fl-duration-ceremony: 500ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* cyrillic */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"78382380-2ca0-4a32-bb02-fd24657aa512\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"898d21c9-5484-433b-8d38-b4eb3e25c48c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"7410f30e-dca3-408a-a882-5271f8feb218\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"79dac85f-6a98-428f-ae08-d82576d6f350\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"78382380-2ca0-4a32-bb02-fd24657aa512\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"898d21c9-5484-433b-8d38-b4eb3e25c48c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"7410f30e-dca3-408a-a882-5271f8feb218\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"79dac85f-6a98-428f-ae08-d82576d6f350\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"78382380-2ca0-4a32-bb02-fd24657aa512\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"898d21c9-5484-433b-8d38-b4eb3e25c48c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7410f30e-dca3-408a-a882-5271f8feb218\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"79dac85f-6a98-428f-ae08-d82576d6f350\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n/**\n * Forge Legacy — Visual Foundation\n * Material / atmosphere layer built ON TOP OF the canonical hex values in\n * src/constants/tokens.ts. Hex values below are copied 1:1 from that file —\n * this stylesheet does not invent new base colors, it defines how they\n * behave as materials (gradients, glow, shadow, border, imagery treatment).\n *\n * Source of truth for raw hex: src/constants/tokens.ts (_palette)\n * Source of truth for this material layer: this file.\n */\n\n:root {\n  /* ============================================================\n     CORE PALETTE — copied from src/constants/tokens.ts (_palette)\n     ============================================================ */\n  --fl-base:          #05080A;\n  --fl-charcoal-900:  #0C1013;\n  --fl-charcoal-800:  #131517;\n  --fl-charcoal-700:  #1A1A1E;\n  --fl-charcoal-600:  #24242A;\n  --fl-charcoal-500:  #2E2E35;\n\n  --fl-cream-100:     #F0EDE8;\n  --fl-gray-400:      #9E9890;\n  --fl-gray-600:      #666060;\n\n  --fl-bronze-300:    #CDA063;\n  --fl-bronze-400:    #BF8F4F;\n  --fl-bronze-600:    #7A6040;\n  --fl-bronze-dark:   #574029;\n  --fl-bronze-glow-a: rgba(186, 146, 92, 0.10);\n\n  --fl-green-muted:   #5A9E68;\n  --fl-red-muted:     #BE5A4C;\n  --fl-blue-muted:    #568AAE;\n\n  --fl-overlay-dark:       rgba(0, 0, 0, 0.75);\n  --fl-inner-highlight:    rgba(255, 255, 255, 0.04);\n  --fl-inner-highlight-md: rgba(255, 255, 255, 0.07);\n\n  /* ============================================================\n     BACKGROUND LANGUAGE\n     Never flat black — a cold, dark blue-black steel base (the \"cold iron\").\n     Warmth is reserved for bronze accents and imagery embers; it never lives\n     in the chrome itself. A faint cool apex reads as distant night sky.\n     ============================================================ */\n  --fl-bg-primary:  var(--fl-charcoal-900);\n  --fl-bg-secondary: var(--fl-charcoal-800);\n\n  --fl-bg-atmospheric:\n    radial-gradient(130% 85% at 50% -8%, rgba(88,124,160,0.06) 0%, rgba(88,124,160,0) 48%),\n    linear-gradient(180deg, #0B0F13 0%, var(--fl-charcoal-900) 44%, var(--fl-base) 100%);\n\n  /* Bottom-weighted scrim used over any photograph or landscape layer */\n  --fl-bg-cinematic:\n    linear-gradient(180deg, rgba(6,9,12,0) 0%, rgba(6,9,12,0.35) 45%, rgba(6,9,12,0.75) 78%, rgba(6,9,12,0.96) 100%);\n\n  /* Faint drifting warm/cool haze, layered above atmospheric bg for depth */\n  --fl-bg-smoke:\n    radial-gradient(55% 45% at 18% 6%, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0) 60%),\n    radial-gradient(50% 42% at 88% 18%, rgba(96,130,165,0.06) 0%, rgba(96,130,165,0) 62%),\n    radial-gradient(70% 60% at 50% 110%, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 60%);\n\n  /* ============================================================\n     SURFACE MATERIALS — forged steel, never a flat gray rectangle.\n     Each surface carries a faint top-to-bottom gradient + inset\n     top highlight, as if catching light along its upper edge.\n     ============================================================ */\n  --fl-surface-card:     linear-gradient(180deg, #181A1C 0%, var(--fl-charcoal-800) 100%);\n  --fl-surface-elevated: linear-gradient(180deg, #1F2024 0%, var(--fl-charcoal-700) 100%);\n  --fl-surface-recessed: linear-gradient(180deg, var(--fl-base) 0%, #0C0C0E 100%);\n  --fl-surface-panel:    var(--fl-charcoal-800);\n  --fl-surface-modal:    linear-gradient(180deg, #232329 0%, #1E1E23 100%);\n  --fl-surface-nav:      rgba(13, 13, 15, 0.92);\n\n  /* ============================================================\n     BRONZE MATERIAL SYSTEM\n     Warm, weathered, brushed metal — never yellow, orange,\n     champagne, white-gold, or neon.\n     ============================================================ */\n  --fl-bronze-primary:  var(--fl-bronze-400);   /* earned / active / progress */\n  --fl-bronze-bright:   var(--fl-bronze-300);   /* pressed / highlight state */\n  --fl-bronze-mid:      var(--fl-bronze-600);   /* muted accent, track tint */\n  --fl-bronze-deep:     var(--fl-bronze-dark);  /* weathered / recessed bronze */\n\n  /* Brushed-metal sweep — use as a thin highlight bar, never a full fill */\n  --fl-bronze-metallic:\n    linear-gradient(115deg,\n      var(--fl-bronze-mid) 0%,\n      var(--fl-bronze-primary) 38%,\n      var(--fl-bronze-bright) 50%,\n      var(--fl-bronze-primary) 62%,\n      var(--fl-bronze-deep) 100%);\n\n  --fl-bronze-border:        rgba(186, 146, 92, 0.40);\n  --fl-bronze-border-subtle: rgba(186, 146, 92, 0.19);\n  --fl-bronze-glow-ring:     0 0 24px 2px rgba(186, 146, 92, 0.22);\n\n  /* Warm forge-lit bronze highlight — the Home-canonical inner-highlight hue,\n     a touch warmer than the base bronze-glow rgba. LOCKED from the Home Screen;\n     the two near-identical inline variants (198,156,100 / 202,162,106) are now\n     reconciled to this single value. */\n  --fl-bronze-warm: 198, 156, 100; /* @kind color */\n\n  /* Sanctioned FORGED-METAL fill — the one exception to \"bronze is never a\n     large fill.\" Primary action button only. Reads as forged bronze catching\n     light: a polished bright top rim, deep bronze body, a strong bright bronze\n     specular band across the middle, deepest at the base. Hue stays in\n     bronze / burnished copper / brushed brass — never walnut or chocolate. */\n  --fl-bronze-fill:\n    linear-gradient(180deg,\n      #8A6A3E 0%,      /* thin polished top edge — reflected light, not a stripe */\n      #573F24 6%,\n      #3D2F1A 26%,\n      #2E2314 50%,     /* darkest forged-bronze core — center darker than the edges */\n      #342817 72%,\n      #42321C 92%,\n      #4A3822 97%,     /* soft reflected bottom edge */\n      #382A18 100%); /* @kind color */\n  --fl-bronze-fill-hover:\n    linear-gradient(180deg,\n      #A17E4A 0%,      /* hover: edges catch more light, the body barely lifts */\n      #63492A 6%,\n      #43331C 26%,\n      #322616 50%,\n      #382B19 72%,\n      #493720 92%,\n      #52402A 97%,\n      #3D2E1A 100%); /* @kind color */\n\n  /* Brushed-metal grain, layered OVER the fill. Dialed right down so it only\n     appears on close inspection — forged, not barcoded. */\n  --fl-bronze-brush:\n    repeating-linear-gradient(90deg,\n      rgba(255, 244, 214, 0.003) 0px, rgba(255, 244, 214, 0.003) 1px,\n      rgba(0, 0, 0, 0.004) 1px,       rgba(0, 0, 0, 0.004) 4px); /* @kind color */\n\n  /* Directional forged-metal lighting: a polished bright TOP edge, darker\n     SIDES (so the face reads slightly rounded), a faint reflected BOTTOM\n     light, and a tight top-biased glow that hugs the button. */\n  --fl-bronze-metal-border:       rgba(174, 136, 86, 0.55); /* @kind color */\n  --fl-bronze-metal-border-hover: rgba(196, 158, 104, 0.60); /* @kind color */\n  --fl-bronze-metal-top-rim:      inset 0 1px 0 rgba(222, 190, 148, 0.42); /* @kind shadow */\n  --fl-bronze-metal-bottom-rim:   inset 0 -1px 1px rgba(176, 134, 80, 0.14); /* @kind shadow */\n  --fl-bronze-metal-sides:        inset 10px 0 16px -12px rgba(0, 0, 0, 0.50), inset -10px 0 16px -12px rgba(0, 0, 0, 0.50); /* @kind shadow */\n  --fl-glow-forge:       0 0 2px rgba(186, 144, 90, 0.14);\n  --fl-glow-forge-hover: 0 0 4px rgba(198, 156, 100, 0.22), 0 0 1px rgba(198, 156, 100, 0.26);\n\n  /* Inactive primary — cool charcoal, desaturated bronze rim, no glow. */\n  --fl-bronze-fill-disabled:\n    linear-gradient(180deg, #1C1E22 0%, #15171B 100%); /* @kind color */\n  --fl-bronze-border-disabled: rgba(150, 140, 122, 0.22); /* @kind color */\n\n  /* Destructive — the SAME forged model as primary, in muted red: a dark forged\n     red-tinted body, a deep muted-red machined rim, a thin red edge highlight,\n     shaded sides, and an extremely subtle red glow. */\n  --fl-red-fill:\n    linear-gradient(180deg,\n      #2A1F1E 0%,      /* thin lit top edge */\n      #1E1615 8%,\n      #171111 50%,     /* dark forged center */\n      #1B1413 92%,\n      #241A19 97%,     /* soft reflected bottom edge */\n      #1B1413 100%); /* @kind color */\n  --fl-red-fill-hover:\n    linear-gradient(180deg,\n      #342624 0%,\n      #241918 8%,\n      #191212 50%,\n      #1F1615 92%,\n      #2B1F1D 97%,\n      #1F1615 100%); /* @kind color */\n  --fl-red-metal-border:       rgba(150, 74, 66, 0.72); /* @kind color */\n  --fl-red-metal-border-hover: rgba(178, 92, 82, 0.80); /* @kind color */\n  --fl-red-metal-top-rim:      inset 0 1px 0 rgba(190, 104, 92, 0.32); /* @kind shadow */\n  --fl-glow-red:       0 0 2px rgba(150, 70, 62, 0.16);\n  --fl-glow-red-hover: 0 0 4px rgba(170, 84, 74, 0.24), 0 0 1px rgba(170, 84, 74, 0.28);\n\n  /* ============================================================\n     BORDERS — machined, not drawn.\n     ============================================================ */\n  --fl-border-subtle:   1px solid var(--fl-charcoal-600);\n  --fl-border-bronze:   1px solid var(--fl-bronze-border);\n  --fl-border-active:   1.5px solid var(--fl-bronze-primary);\n  --fl-border-inset:    inset 0 1px 0 var(--fl-inner-highlight);\n  --fl-border-inset-md: inset 0 1px 0 var(--fl-inner-highlight-md);\n\n  /* ============================================================\n     RADIUS — one machined-corner scale for the whole system.\n     ============================================================ */\n  --fl-radius-xs:    6px;   /* @kind radius */\n  --fl-radius-sm:    8px;   /* @kind radius */\n  --fl-radius-md:    10px;  /* @kind radius */\n  --fl-radius-lg:    12px;  /* @kind radius */\n  --fl-radius-xl:    16px;  /* @kind radius */\n  --fl-radius-round: 50%;   /* @kind radius */\n  --fl-radius-pill:  999px; /* @kind radius */\n\n  /* ============================================================\n     SHADOWS — weight without obvious blur.\n     ============================================================ */\n  --fl-shadow-card:     0 2px 8px rgba(0, 0, 0, 0.35);\n  --fl-shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.5);\n  --fl-shadow-modal:    0 8px 24px rgba(0, 0, 0, 0.65);\n  --fl-shadow-image:    0 6px 20px rgba(0, 0, 0, 0.55);\n  --fl-shadow-ambient:  0 20px 60px rgba(0, 0, 0, 0.45);\n  --fl-shadow-float:    0 12px 28px rgba(0, 0, 0, 0.4);\n\n  /* Canonical forged-card treatments — LOCKED from the Home Screen.\n     hero = the Mission card; soft = secondary/list cards. Each carries a warm\n     inner top-highlight, a deep tight drop, and a faint bronze heat-glow. */\n  --fl-card-hero-wash:    linear-gradient(180deg, rgba(198,156,100,0.07) 0%, rgba(198,156,100,0) 42%); /* @kind color */\n  --fl-shadow-card-hero:  inset 0 1px 0 rgba(198,156,100,0.30), 0 18px 40px -24px rgba(0,0,0,0.82), 0 0 18px -6px rgba(186,146,92,0.11);\n  --fl-shadow-card-soft:  inset 0 1px 0 rgba(198,156,100,0.22), 0 12px 30px -24px rgba(0,0,0,0.72), 0 0 15px -6px rgba(186,146,92,0.09);\n\n  /* ============================================================\n     GLOW — heat from forged metal. Warm, restrained, localized. Metal glow\n     sits at the bronze accent hue; imagery embers (sunset behind a hero photo)\n     run deeper and more orange.\n     ============================================================ */\n  --fl-glow-ember:  radial-gradient(circle, rgba(186, 146, 92, 0.22) 0%, rgba(186, 146, 92, 0) 70%); /* @kind color */\n  --fl-glow-subtle: 0 0 20px rgba(186, 146, 92, 0.14);\n  --fl-glow-badge:  0 0 16px rgba(186, 146, 92, 0.28);\n  --fl-glow-focus:  drop-shadow(0 0 8px rgba(186, 146, 92, 0.5)); /* @kind other */\n\n  /* Deep sunset ember for imagery/hero embers — richer, more orange than metal\n     glow (matches the forge-light behind the hero and legacy photography). */\n  --fl-ember-sunset: #BD7829; /* @kind color */\n  --fl-glow-ember-deep:\n    radial-gradient(circle,\n      rgba(201, 128, 44, 0.55) 0%,\n      rgba(150, 84, 30, 0.24) 40%,\n      rgba(120, 66, 24, 0) 72%); /* @kind color */\n\n  /* Ember flame accent — the heat/flame icon stroke (Start Workout). LOCKED. */\n  --fl-ember-flame: #E0913F; /* @kind color */\n\n  /* Live / online status — the \"training now\" presence indicator. LOCKED. */\n  --fl-status-online:      #4CAF6E; /* @kind color */\n  --fl-status-online-glow: 0 0 6px rgba(76, 175, 110, 0.6); /* @kind shadow */\n\n  /* ============================================================\n     INTERACTION TINTS — faint washes for hover / active states.\n     ============================================================ */\n  --fl-hover-wash:  rgba(255, 255, 255, 0.02); /* @kind color */\n  --fl-bronze-tint: rgba(186, 146, 92, 0.05);  /* @kind color */\n\n  /* ============================================================\n     TYPOGRAPHY — FAMILIES\n     Sans carries labels, stats, and body. The display serif is\n     reserved for hero names, screen titles, and the legacy statement.\n     ============================================================ */\n  --fl-font-sans:    -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; /* @kind font */\n  --fl-font-display: \"Playfair Display\", Georgia, \"Times New Roman\", serif; /* @kind font */\n  --fl-font-mono:    ui-monospace, SFMono-Regular, Menlo, monospace; /* @kind font */\n\n  /* ============================================================\n     TYPOGRAPHY COLORS\n     ============================================================ */\n  --fl-text-primary:      var(--fl-cream-100);\n  --fl-text-secondary:    var(--fl-gray-400);\n  --fl-text-tertiary:     var(--fl-gray-600);\n  --fl-text-bronze-label: var(--fl-bronze-primary);\n  --fl-text-stat:         var(--fl-cream-100);\n\n  /* ============================================================\n     ICON TREATMENT — engraved into the interface, not floating on it.\n     ============================================================ */\n  --fl-icon-bronze:           var(--fl-bronze-primary);\n  --fl-icon-inactive:         var(--fl-gray-600);\n  --fl-icon-active:           var(--fl-bronze-primary);\n  --fl-icon-container-bg:     var(--fl-charcoal-800);\n  --fl-icon-container-border: var(--fl-bronze-border-subtle);\n\n  /* ============================================================\n     MOTION — deliberate, heavy, smooth. Never bouncy or exaggerated.\n     ============================================================ */\n  --fl-ease-out:  cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --fl-ease-in:   cubic-bezier(0.7, 0, 0.84, 0); /* @kind other */\n  --fl-ease-soft-spring: cubic-bezier(0.34, 1.1, 0.64, 1); /* @kind other */\n  --fl-duration-toggle:  50ms; /* @kind other */\n  --fl-duration-standard: 250ms; /* @kind other */\n  --fl-duration-ceremony: 500ms; /* @kind other */\n}\n\n\n* { box-sizing: border-box; }\n\nhtml, body {\n 16px rgba(138,100,49,0.20);\n  --fl-glow-ember:radial-gradient(circle, rgba(138,100,49,0.16) 0%, rgba(138,100,49,0) 70%);\n  --fl-glow-focus:drop-shadow(0 0 8px rgba(138,100,49,0.4));\n  --fl-shadow-card:0 1px 2px rgba(70,58,42,0.07), 0 5px 14px -8px rgba(70,58,42,0.20);\n  --fl-shadow-elevated:0 2px 4px rgba(70,58,42,0.07), 0 12px 28px -12px rgba(70,58,42,0.28);\n  --fl-shadow-modal:0 4px 8px rgba(70,58,42,0.08), 0 28px 64px -20px rgba(70,58,42,0.38);\n  --fl-shadow-image:0 2px 5px rgba(70,58,42,0.10), 0 14px 32px -14px rgba(70,58,42,0.30);\n  --fl-shadow-ambient:0 30px 80px -30px rgba(70,58,42,0.34), 0 4px 12px rgba(70,58,42,0.06);\n  --fl-shadow-float:0 4px 10px rgba(70,58,42,0.08), 0 20px 44px -18px rgba(70,58,42,0.30);\n  --fl-card-hero-wash:linear-gradient(180deg, rgba(138,100,49,0.05) 0%, rgba(138,100,49,0) 42%);\n  --fl-shadow-card-hero:inset 0 1px 0 rgba(255,255,255,0.9),0 10px 26px -20px rgba(70,58,42,0.35);\n  --fl-shadow-card-soft:inset 0 1px 0 rgba(255,255,255,0.8),0 8px 20px -18px rgba(70,58,42,0.28);\n  --fl-status-online:#2F7D50; --fl-status-online-glow:0 0 6px rgba(47,125,80,0.35);\n  --fl-green-muted:#3E7A4C; --fl-red-muted:#A6402F; --fl-blue-muted:#3C6D92;\n  --fl-icon-container-bg:#EFEBE3; --fl-icon-inactive:#8C8478;\n\n  /* Fine paper tooth. Two crossed repeating gradients at very low alpha — no asset,\n     invisible as pattern, but it stops the canvas reading as a blank fill. */\n  --fl-paper-grain:repeating-linear-gradient(94deg, rgba(122,104,78,0.022) 0 1px, rgba(255,255,255,0) 1px 3px), repeating-linear-gradient(4deg, rgba(122,104,78,0.016) 0 1px, rgba(255,255,255,0) 1px 4px);\n  /* Forge warmth overhead, shade at the corners. */\n  --fl-paper-vignette:radial-gradient(120% 78% at 50% -12%, rgba(255,252,246,0.95) 0%, rgba(255,252,246,0) 52%), radial-gradient(105% 82% at 50% 112%, rgba(122,100,66,0.10) 0%, rgba(122,100,66,0) 58%), radial-gradient(78% 100% at -8% 50%, rgba(122,100,66,0.07) 0%, rgba(122,100,66,0) 46%), radial-gradient(78% 100% Feeling strong.' }\n    ],\n    draft: 'Three of four with a 20 lb deadlift jump is not a bad week — it is a busy one. Let\\u2019s move your Thursday session to Friday for the rest of the block so work stops taking it.' },\n  { id: 'dana', name: 'Dana Okafor', initials: 'DO', program: 'Base Build', week: 3, weeks: 8, day: 'Sat',\n    weight: '146 lb', wDelta: 'held', wDir: 'flat',\n    sessions: '4 of 4', sDelta: 'first full week', sDir: 'up',\n    lifts: [{ label: 'Squat', value: '135 × 8', delta: 'up 15 lb', dir: 'up' }, { label: 'Row', value: '85 × 10', delta: 'up 10 lb', dir: 'up' }],\n    then: { label: 'Week 1', weight: '147 lb' }, thenAlt: { label: 'Week 2', weight: '146 lb' }, thenLast: { label: 'Last week', weight: '146 lb' },\n    answers: [\n      { q: 'How did the week feel?', a: 'Four for four. I did not think I would get here in three weeks.' },\n      { q: 'What do you want more of?', a: 'More upper body. I like the pulling days.' }\n    ],\n    draft: 'First full week in the book — that is the whole point of the base block. Week four adds a second pull day since you are asking for it.' },\n  { id: 'rosa', name: 'Rosa Delgado', initials: 'RD', program: 'Base Build', week: 6, weeks: 8, day: 'Sat',\n    weight: '158 lb', wDelta: 'down 3 lb this week', wDir: 'down',\n    sessions: '4 of 4', sDelta: 'held', sDir: 'flat',\n    lifts: [{ label: 'Squat', value: '185 × 5', delta: 'up 10 lb', dir: 'up' }, { label: 'Bench', value: '115 × 8', delta: 'up 5 lb', dir: 'up' }],\n    then: { label: 'Week 1', weight: '169 lb' }, thenAlt: { label: 'Week 3', weight: '164 lb' }, thenLast: { label: 'Last week', weight: '161 lb' },\n    answers: [\n      { q: 'How did the week feel?', a: 'Tired but good tired. Sleep has been short — the baby is teething.' },\n      { q: 'Anything hurting?', a: 'No.' }\n    ],\n    draft: 'Down 11 lb across six weeks with every session logged, on short sleep. Let\\u2019s hold the loads where they are next week rather than pushing — recovery
