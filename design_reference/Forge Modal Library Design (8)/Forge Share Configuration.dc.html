    const VERB = { accomplishment: 'Share Accomplishment', honor: 'Share Honor', pr: 'Share PR', chapter: 'Share Chapter', rank: 'Share Rank', program: 'Share Program', transformation: 'Share Transformation' };
    const EYE = { accomplishment: 'Accomplishment', honor: 'Honor Earned', pr: 'Personal Record', chapter: 'Chapter Sealed', rank: 'Rank Ascended', program: 'Program', transformation: 'Transformation' };
    // Possible card fields per kind, in card order. A field renders ONLY when the source supplies it — no dead toggles.
    const FIELDS = {
      accomplishment: [ { key: 'value', label: 'Value', em: 'value' }, { key: 'chapter', label: 'Chapter', em: 'bronze' }, { key: 'date', label: 'Date', em: 'muted' } ],
      honor: [ { key: 'citation', label: 'Citation', em: 'body' }, { key: 'chapter', label: 'Chapter', em: 'bronze' }, { key: 'date', label: 'Date earned', em: 'muted' } ],
      pr: [ { key: 'prev', label: 'Previous PR', em: 'muted' }, { key: 'neu', label: 'New PR', em: 'value' }, { key: 'improve', label: 'Improvement', em: 'bronze' }, { key: 'chapter', label: 'Chapter', em: 'bronze' }, { key: 'date', label: 'Date', em: 'muted' } ],
      chapter: [ { key: 'stats', label: 'Stats', em: 'bronze' }, { key: 'reflection', label: 'Reflection', em: 'body' }, { key: 'date', label: 'Date', em: 'muted' } ],
      rank: [ { key: 'current', label: 'New rank', em: 'bronze' }, { key: 'date', label: 'Date', em: 'muted' } ],
      program: [ { key: 'status', label: 'Completion', em: 'value' }, { key: 'reflection', label: 'Reflection', em: 'body' }, { key: 'date', label: 'Date', em: 'muted' } ],
      transformation: [ { key: 'chapter', label: 'Chapter', em: 'bronze' }, { key: 'reflection', label: 'Reflection', em: 'body' }, { key: 'date', label: 'Date', em: 'muted' } ],
    };
    const RANK_FOOT = { accomplishment: true, pr: true, honor: false, chapter: false, rank: false, program: false, transformation: false };
    // Demo defaults — used ONLY when there is no launch context (standalone preview / tweak).
    const DEMO = {
      accomplishment: { title: '315 lb Barbell Bench Press', photo: demoPhoto, value: '315 lb', chapter: 'Chapter III · The Rebuild', date: 'May 3, 2026' },
      honor: { title: 'The Unbroken', citation: '30 sessions · no missed week', chapter: 'Chapter III · The Rebuild', date: 'Apr 2, 2026' },
      pr: { title: 'Back Squat', prev: 'Was 385 lb × 3', neu: '405 lb × 3', improve: '+20 lb' },
      chapter: { title: 'Ironborn', stats: '48 workouts · 14 weeks', date: 'Mar 1, 2026' },
      rank: { title: 'Architect · IV', current: 'Architect tier · IV', date: 'Jun 14, 2026' },
      program: { title: 'Powerbuilding II', status: 'Completed · 32 of 32', date: 'Jun 12, 2026' },
      transformation: { title: '12 Weeks', mode: 'compare', thenLabel: 'Oct 10', nowLabel: 'Mar 6', elapsed: '12 weeks', chapter: 'Chapter III · The Rebuild', date: 'Mar 6, 2026', reflection: 'The work is finally showing.',
        thenPhoto: 'data:image/svg+xml,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='180' height='240'><rect width='180' height='240' fill='#3a2f22'/><circle cx='90' cy='96' r='34' fill='rgba(201,161,94,0.35)'/></svg>"),
        nowPhoto: 'data:image/svg+xml,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='180' height='240'><rect width='180' height='240' fill='#4a3a1e'/><circle cx='90' cy='92' r='38' fill='rgba(205,160,99,0.55)'/></svg>") },
    };
    const ctx = this._ctx || null;
    const kind = (ctx && ctx.kind) || this.props.kind || 'accomplishment';
    const src = ctx || DEMO[kind] || {};
    const poss = FIELDS[kind] || FIELDS.accomplishment;
    const fields = poss.filter((f) => src[f.key] != null && src[f.key] !== '').map((f) => ({ key: f.key, label: f.label, text: String(src[f.key]), em: f.em, def: true }));
    const mode = src.mode || (kind === 'transformation' ? 'entry' : null);
    const compare = (mode === 'compare') ? { thenPhoto: src.thenPhoto || null, nowPhoto: src.nowPhoto || null, thenLabel: src.thenLabel || 'Then', nowLabel: src.nowLabel || 'Now', elapsed: src.elapsed || '' } : null;
    return {
      mode: mode, compare: compare,
      kind: kind,
      verb: VERB[kind] || 'Share',
      eyebrow: src.eyebrow || EYE[kind] || '',
      glyph: GLYPH[kind] || star,
      title: src.title || (DEMO[kind] && DEMO[kind].title) || 'Milestone',
      photo: ('photo' in src) ? src.photo : ((DEMO[kind] && DEMO[kind].photo) || null),
      athlete: src.athlete || 'Ada Ridge',
      rank: src.rank || 'Architect · IV',
      rankInFooter: !!RANK_FOOT[kind],
      back: (ctx && ctx.back) || 'Forge%20Legacy.dc.html',
      fields: fields,
    };
  }
  _close(back) { if ((function(){try{return !!document.referrer&&new URL(document.referrer).origin===window.location.origin;}catch(e){return false;}})()) window.history.back(); else window.location.href = back || 'Forge%20Legacy.dc.html'; }

  renderVals() {
    if (!this.state.ready || typeof React === 'undefined' || !React.createElement) return { ready: false, notReady: true };
    const h = React.createElement;
    const P = (d) => h('path', { key: d, d: d });
    const ic = (kids) => h('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }, kids);
    const cfg = this._config();
    const showCompare = cfg.mode === 'compare';
    const hasPhoto = !!cfg.photo && !showCompare;
    const cmpPhoto = (src) => src ? h('img', { src: src, style: { width: '100%', height: '100%', objectFit: 'cover', display: 'block' } }) : null;
    const compareEl = showCompare && cfg.compare ? h('div', { style: { width: '100%' } }, [
      h('div', { key: 'l', style: { display: 'flex', gap: '10px', marginBottom: '8px' } }, [
        h('span', { key: 't', style: { flex: 1, textAlign: 'center', fontSize: '9px', fontWeight: 700, letterSpacing: '0.8px', textTransform: 'uppercase', color: 'var(--fl-text-secondary)' } }, cfg.compare.thenLabel),
        h('span', { key: 'n', style: { flex: 1, textAlign: 'center', fontSize: '9px', fontWeight: 700, letterSpacing: '0.8px', textTransform: 'uppercase', color: 'var(--fl-bronze-bright)' } }, cfg.compare.nowLabel),
      ]),
      h('div', { key: 'p', style: { display: 'flex', gap: '10px' } }, [
        h('div', { key: 'a', style: { flex: 1, aspectRatio: '3 / 4', borderRadius: '12px', overflow: 'hidden', border: '1px solid var(--fl-charcoal-600)', background: 'var(--fl-surface-recessed)' } }, cmpPhoto(cfg.compare.thenPhoto)),
        h('div', { key: 'b', style: { flex: 1, aspectRatio: '3 / 4', borderRadius: '12px', overflow: 'hidden', border: '1px solid var(--fl-bronze-border-subtle)', background: 'var(--fl-surface-recessed)' } }, cmpPhoto(cfg.compare.nowPhoto)),
      ]),
      cfg.compare.elapsed ? h('div', { key: 'e', style: { textAlign: 'center', marginTop: '14px' } }, [
        h('span', { key: 'v', style: { display: 'block', fontFamily: 'var(--fl-font-display)', fontSize: '28px', fontWeight: 700, letterSpacing: '-0.5px', color: 'var(--fl-bronze-bright)', lineHeight: 1 } }, cfg.compare.elapsed),
        h('span', { key: 'k', style: { display: 'block', marginTop: '4px', fontSize: '9px', fontWeight: 600, letterSpacing: '1.6px', textTransform: 'uppercase', color: 'var(--fl-text-tertiary)' } }, 'Transformed'),
      ]) : null,
    ]) : null;

    // ── toggles (source-specific) + name + photo ──
    const togDefs = cfg.fields.map((f) => ({ key: f.key, label: f.label, def: f.def }));
    togDefs.push({ key: 'name', label: cfg.rankInFooter ? 'Name & Rank' : 'Name', def: true });
    if (hasPhoto) togDefs.push({ key: 'photo', label: 'Photo', def: true });
    const toggles = togDefs.map((t, i) => {
      const on = this._eff(t.key, t.def);
      return { label: t.label, on: on, off: !on, divider: i === 0 ? 'none' : '1px solid var(--fl-charcoal-700)', onToggle: () => this._toggle(t.key, t.def) };
    });

    // ── card lines (only enabled fields) ──
    const cardLines = cfg.fields.filter((f) => this._eff(f.key, f.def)).map((f) => ({
      text: f.text,
      isValue: f.em === 'value', isBronze: f.em === 'bronze', isMuted: f.em === 'muted', isBody: f.em === 'body',
    }));

    const inclPhoto = hasPhoto && this._eff('photo', true);
    const inclName = this._eff('name', true);

    // ── destinations ──
    const FORGE = [
      { id: 'squad', label: 'Squad', icon: ic([h('circle', { key: 'c', cx: 9, cy: 8, r: 3 }), P('M3.5 19a5.5 5.5 0 0 1 11 0'), P('M16.5 5.6a3 3 0 0 1 0 5.3'), P('M17.5 14.4a5.5 5.5 0 0 1 3 4.6')]), verb: 'Share to Squad' },
      { id: 'friends', label: 'Friends', icon: ic([h('circle', { key: 'c', cx: 12, cy: 8, r: 3.4 }), P('M5 20a7 7 0 0 1 14 0')]), verb: 'Share with Friends' },
      { id: 'community', label: 'Community', icon: ic([h('circle', { key: 'c', cx: 12, cy: 12, r: 9 }), P('M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18')]), verb: 'Post to Community' },
      { id: 'friend', label: 'A friend', icon: ic([h('circle', { key: 'c', cx: 10, cy: 8, r: 3.2 }), P('M4 19a6 6 0 0 1 12 0'), P('M18 8v6M15 11h6')]), verb: 'Send to a friend' },
    ];
    const dest = this.state.dest;
    const forgeDests = FORGE.map((d) => {
      const on = d.id === dest;
      return { id: d.id, label: d.label, icon: d.icon, onSelect: () => this.setState({ dest: d.id }),
        border: on ? 'var(--fl-bronze-border)' : 'var(--fl-charcoal-600)', bg: on ? 'var(--fl-bronze-tint)' : 'var(--fl-surface-card)',
        ink: on ? 'var(--fl-text-primary)' : 'var(--fl-text-secondary)', iconColor: on ? 'var(--fl-icon-bronze)' : 'var(--fl-text-tertiary)', iconBorder: on ? 'var(--fl-bronze-border-subtle)' : 'var(--fl-charcoal-600)' };
    });
    const FR = window.ForgeFriends;
    const friendId = this.state.friendId;
    const friendChoices = (FR ? FR.list() : []).map((f, i) => {
      const on = f.id === friendId;
      const initials = f.name.split(/\s+/).map((p) => p[0]).slice(0, 2).join('').toUpperCase();
      return { key: f.id, name: f.name, handle: '@' + f.handle, initials: initials, sel: on,
        onSelect: () => this.setState({ friendId: f.id }),
        divider: i === 0 ? 'none' : '1px solid var(--fl-charcoal-700)',
        bg: on ? 'var(--fl-bronze-tint)' : 'transparent' };
    });
    const selFriend = (FR && friendId) ? FR.get(friendId) : null;
    const showFriendPicker = dest === 'friend';
    let shareVerb = (FORGE.find((d) => d.id === dest) || FORGE[0]).verb;
    if (dest === 'friend') shareVerb = selFriend ? ('Send to ' + selFriend.name) : 'Choose a friend';

    const outActions = [
      { label: 'Message', icon: ic([P('M4 5h16v11H8l-4 4z')]), onTap: () => this._showToast('Message ready') },
      { label: 'Share…', icon: ic([P('M12 15V4M8.5 7.5L12 4l3.5 3.5'), P('M5 12v7h14v-7')]), onTap: () => this._shareSystem() },
      { label: 'Save image', icon: ic([P('M12 3v12M8 11l4 4 4-4M5 21h14')]), onTap: () => this._showToast('Image saved') },
      { label: 'Copy link', icon: ic([P('M9 15l6-6M10.5 6.5l1.8-1.8a3.5 3.5 0 0 1 5 5l-2 2M13.5 17.5l-1.8 1.8a3.5 3.5 0 0 1-5-5l2-2')]), onTap: () => this._showToast('Link copied') },
    ];

    const back = cfg.back;
    return {
      ready: true, notReady: false,
      onClose: () => this._close(back),
      shareTitle: cfg.verb,
      showCompare: showCompare, compareEl: compareEl,
      showPhoto: inclPhoto,
      photoBandEl: inclPhoto ? h('img', { src: cfg.photo, style: { width: '100%', height: '100%', objectFit: 'cover', display: 'block' } }) : null,
      showGlyph: !inclPhoto && !showCompare,
      kindGlyph: cfg.glyph,
      eyebrow: cfg.eyebrow, showTitle: !showCompare, title: cfg.title,
      cardLines,
      inclName, footerShowRank: !!cfg.rankInFooter,
      athlete: cfg.athlete, rank: cfg.rank,
      toggles, forgeDests, outActions, showFriendPicker, friendChoices,
      shareLabel: shareVerb,
      onShare: () => { if (dest === 'friend') { if (!selFriend) { this._showToast('Pick a friend first'); return; } if (FR) FR.sendProgram(selFriend.id, { programId: (this._ctx && this._ctx.programId) || null, programName: cfg.title }); this._showToast('Sent to ' + selFriend.name); if (this._doneT) clearTimeout(this._doneT); this._doneT = setTimeout(() => this._close(back), 950); return; } const done = shareVerb.replace(/^Share to /, 'Shared to ').replace(/^Share with /, 'Shared with ').replace(/^Post to /, 'Posted to '); this._showToast(done); if (this._doneT) clearTimeout(this._doneT); this._doneT = setTimeout(() => this._close(back), 950); },
      toast: this.state.toast,
    };
  }
  _shareSystem() {
    try { if (navigator.share) { navigator.share({ title: 'Forge Legacy', text: 'A milestone from my Forge Legacy.' }).catch(function () {}); this._showToast('Opening share…'); return; } } catch (e) {}
    this._showToast('Opening share…');
  }
}
