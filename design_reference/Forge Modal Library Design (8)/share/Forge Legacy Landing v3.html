"38\" height=\"38\" loading=\"lazy\" decoding=\"async\" style=\"flex:none; width:38px; height:38px; object-fit:contain; display:block;\">\n            <span style=\"flex:none; width:92px; font-size:10.5px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:var(--fl-bronze-primary);\">Craftsman<\u002Fspan>\n            <span style=\"flex:1; min-width:0; font-size:14.5px; color:var(--fl-text-secondary); text-wrap:pretty;\">I know how to train.<\u002Fspan>\n          <\u002Fdiv>\n          <div data-beat=\"1500\" style=\"display:flex; align-items:center; gap:14px; padding:11px 0; border-bottom:1px solid var(--fl-charcoal-700); opacity:0; transform:translateY(12px); transition:opacity 400ms var(--fl-ease-out), transform 400ms var(--fl-ease-out);\">\n            <img src=\"450fc43b-17c7-4c4e-a913-6b0c214ea452\" alt=\"\" width=\"38\" height=\"38\" loading=\"lazy\" decoding=\"async\" style=\"flex:none; width:38px; height:38px; object-fit:contain; display:block;\">\n            <span style=\"flex:none; width:92px; font-size:10.5px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:var(--fl-bronze-primary);\">Architect<\u002Fspan>\n            <span style=\"flex:1; min-width:0; font-size:14.5px; color:var(--fl-text-secondary); text-wrap:pretty;\">I'm shaping my development.<\u002Fspan>\n          <\u002Fdiv>\n          <div data-beat=\"2000\" style=\"display:flex; align-items:center; gap:14px; padding:11px 0; border-bottom:1px solid var(--fl-charcoal-700); opacity:0; transform:translateY(12px); transition:opacity 400ms var(--fl-ease-out), transform 400ms var(--fl-ease-out);\">\n            <img src=\"785e3a1c-5e29-4bc2-8fa4-6c399631780d\" alt=\"\" width=\"38\" height=\"38\" loading=\"lazy\" decoding=\"async\" style=\"flex:none; width:38px; height:38px; object-fit:contain; display:block;\">\n            <span style=\"flex:none; width:92px; font-size:10.5px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:var(--fl-bronze-primary);\">Established<\u002Fspan>\n            <span style=\"flex:1; min-width:0; font-size:14.5px; color:var(--fl-text-secondary); text-wrap:pretty;\">I've built something real.<\u002Fspan>\n          <\u002Fdiv>\n          <div data-beat=\"2700\" style=\"display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--fl-charcoal-700); opacity:0; transform:translateY(12px); transition:opacity 450ms var(--fl-ease-out), transform 450ms var(--fl-ease-out);\">\n            <img src=\"641d0526-3f01-4702-97bf-265532817c59\" alt=\"\" width=\"44\" height=\"44\" loading=\"lazy\" decoding=\"async\" style=\"flex:none; width:44px; height:44px; object-fit:contain; display:block;\">\n            <span style=\"flex:none; width:92px; font-size:11px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:var(--fl-bronze-bright);\">Legend<\u002Fspan>\n            <span style=\"flex:1; min-width:0; font-size:15px; text-wrap:pretty;\">My journey has become a meaningful story.<\u002Fspan>\n          <\u002Fdiv>\n          <div data-beat=\"3500\" style=\"display:flex; align-items:center; gap:14px; padding:14px 0; opacity:0; transform:translateY(12px); transition:opacity 500ms var(--fl-ease-out), transform 500ms var(--fl-ease-out);\">\n            <img src=\"83db94bb-88bb-4f40-9768-0fca0bcad2b1\" alt=\"\" width=\"50\" height=\"50\" loading=\"lazy\" decoding=\"async\" style=\"flex:none; width:50px; height:50px; object-fit:contain; display:block;\">\n            <span style=\"flex:none; width:92px; font-family:var(--fl-font-display); font-size:12px; font-weight:500; letter-spacing:2px; text-transform:uppercase; color:var(--fl-bronze-bright);\">Legacy<\u002Fspan>\n            <span style=\"flex:1; min-width:0; font-size:15.5px; text-wrap:pretty;\">I repeatedly become the person I intend to become.<\u002Fspan>\n          <\u002Fdiv>\n          <span data-beat=\"4300\" style=\"margin-top:16px; font-size:13px; color:var(--fl-gray-400); opacity:0; transition:opacity 400ms var(--fl-ease-out);\">Legacy takes seven years.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 6c · everything else, compact -->\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,225px), 1fr)); gap:10px; margin-top:clamp(40px,7vw,72px); padding-top:clamp(32px,6vw,52px); border-top:1px solid var(--fl-charcoal-700);\">\n        <div data-rev=\"1\" style=\"padding:18px 17px 20px; border-radius:var(--fl-radius-md); background:var(--fl-surface-card); border:1px solid var(--fl-charcoal-600); box-shadow:inset 0 1px 0 var(--fl-inner-highlight); opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">\n          <span style=\"display:block; font-size:16px; font-weight:600;\">Bring your own program<\u002Fspan>\n          <span style=\"display:block; margin-top:7px; font-size:13.5px; line-height:1.5; color:var(--fl-text-secondary); text-wrap:pretty;\">Paste in the program you already run. Forge matches the exercises and builds it. Or build one from scratch.<\u002Fspan>\n        <\u002Fdiv>\n        <div data-rev=\"1\" style=\"padding:18px 17px 20px; border-radius:var(--fl-radius-md); background:var(--fl-surface-card); border:1px solid var(--fl-charcoal-600); box-shadow:inset 0 1px 0 var(--fl-inner-highlight); opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">\n          <span style=\"display:block; font-size:16px; font-weight:600;\">Squads<\u002Fspan>\n          <span style=\"display:block; margin-top:7px; font-size:13.5px; line-height:1.5; color:var(--fl-text-secondary); text-wrap:pretty;\">A handful of people, not an audience. Shows what members did, never what they missed. No followers.<\u002Fspan>\n        <\u002Fdiv>\n        <div data-rev=\"1\" style=\"padding:18px 17px 20px; border-radius:var(--fl-radius-md); background:var(--fl-surface-card); border:1px solid var(--fl-charcoal-600); box-shadow:inset 0 1px 0 var(--fl-inner-highlight); opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">\n          <span style=\"display:block; font-size:16px; font-weight:600;\">Honors<\u002Fspan>\n          <span style=\"display:block; margin-top:7px; font-size:13.5px; line-height:1.5; color:var(--fl-text-secondary); text-wrap:pretty;\">Recognition you didn't ask for and can't buy. Awarded when you've actually done the thing.<\u002Fspan>\n        <\u002Fdiv>\n        <div data-rev=\"1\" style=\"padding:18px 17px 20px; border-radius:var(--fl-radius-md); background:var(--fl-surface-card); border:1px solid var(--fl-charcoal-600); box-shadow:inset 0 1px 0 var(--fl-inner-highlight); opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">\n          <span style=\"display:block; font-size:16px; font-weight:600;\">Progress &amp; photos<\u002Fspan>\n          <span style=\"display:block; margin-top:7px; font-size:13.5px; line-height:1.5; color:var(--fl-text-secondary); text-wrap:pretty;\">Strength over time, body metrics if you want them, and your own progress photos grouped by chapter. Private by default.<\u002Fspan>\n        <\u002Fdiv>\n        <div data-rev=\"1\" style=\"padding:18px 17px 20px; border-radius:var(--fl-radius-md); background:var(--fl-surface-card); border:1px solid var(--fl-charcoal-600); box-shadow:inset 0 1px 0 var(--fl-inner-highlight); opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">\n          <span style=\"display:block; font-size:16px; font-weight:600;\">Cardio &amp; conditioning<\u002Fspan>\n          <span style=\"display:block; margin-top:7px; font-size:13.5px; line-height:1.5; color:var(--fl-text-secondary); text-wrap:pretty;\">Runs, rides, rows, swims. Logged the same way, landing in the same chapter.<\u002Fspan>\n        <\u002Fdiv>\n        <div data-rev=\"1\" style=\"padding:18px 17px 20px; border-radius:var(--fl-radius-md); background:var(--fl-surface-card); border:1px solid var(--fl-charcoal-600); box-shadow:inset 0 1px 0 var(--fl-inner-highlight); opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">\n          <span style=\"display:block; font-size:16px; font-weight:600;\">Exercise library &amp; home gym<\u002Fspan>\n          <span style=\"display:block; margin-top:7px; font-size:13.5px; line-height:1.5; color:var(--fl-text-secondary); text-wrap:pretty;\">Coaching notes and substitutions on every movement. Tell it what you own and it stops recommending what you can't do.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ═══════════ 7 · PROMISES + WHAT'S REAL ═══════════ -->\n  <section style=\"border-top:1px solid var(--fl-charcoal-600); padding:clamp(64px,13vw,120px) var(--gut);\">\n    <div style=\"max-width:1180px; margin:0 auto;\">\n      <span data-rev=\"1\" style=\"display:block; font-size:11px; font-weight:500; letter-spacing:1.8px; text-transform:uppercase; color:var(--fl-bronze-primary); opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">What we're bound by<\u002Fspan>\n      <h2 data-rev=\"1\" style=\"margin:14px 0 0; font-family:var(--fl-font-display); font-size:clamp(27px,7vw,42px); font-weight:500; line-height:1.1; max-width:20em; text-wrap:pretty; opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">Four promises, in the architecture — not the marketing.<\u002Fh2>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,250px), 1fr)); gap:10px; margin-top:clamp(32px,6vw,52px);\">\n        <div data-rev=\"1\" style=\"padding:20px 18px 22px; border-radius:var(--fl-radius-md); background:var(--fl-surface-card); border:1px solid var(--fl-charcoal-600); box-shadow:inset 0 1px 0 var(--fl-inner-highlight); opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">\n          <span style=\"display:block; font-family:var(--fl-font-display); font-size:12px; font-weight:500; letter-spacing:2px; color:var(--fl-bronze-mid);\">01<\u002Fspan>\n          <span style=\"display:block; margin-top:11px; font-size:16.5px; font-weight:600;\">Never charge for history.<\u002Fspan>\n          <span style=\"display:block; margin-top:8px; font-size:13.5px; line-height:1.55; color:var(--fl-text-secondary); text-wrap:pretty;\">Everything you log is yours, forever. No tier locks your past.<\u002Fspan>\n        <\u002Fdiv>\n        <div data-rev=\"1\" style=\"padding:20px 18px 22px; border-radius:var(--fl-radius-md); background:var(--fl-surface-card); border:1px solid var(--fl-charcoal-600); box-shadow:inset 0 1px 0 var(--fl-inner-highlight); opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">\n          <span style=\"display:block; font-family:var(--fl-font-display); font-size:12px; font-weight:500; letter-spacing:2px; color:var(--fl-bronze-mid);\">02<\u002Fspan>\n          <span style=\"display:block; margin-top:11px; font-size:16.5px; font-weight:600;\">No shame mechanics.<\u002Fspan>\n          <span style=\"display:block; margin-top:8px; font-size:13.5px; line-height:1.55; color:var(--fl-text-secondary); text-wrap:pretty;\">Miss a week and the app says nothing. No \"days since your last workout.\" No red.<\u002Fspan>\n        <\u002Fdiv>\n        <div data-rev=\"1\" style=\"padding:20px 18px 22px; border-radius:var(--fl-radius-md); background:var(--fl-surface-card); border:1px solid var(--fl-charcoal-600); box-shadow:inset 0 1px 0 var(--fl-inner-highlight); opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">\n          <span style=\"display:block; font-family:var(--fl-font-display); font-size:12px; font-weight:500; letter-spacing:2px; color:var(--fl-bronze-mid);\">03<\u002Fspan>\n          <span style=\"display:block; margin-top:11px; font-size:16.5px; font-weight:600;\">Nothing is public.<\u002Fspan>\n          <span style=\"display:block; margin-top:8px; font-size:13.5px; line-height:1.55; color:var(--fl-text-secondary); text-wrap:pretty;\">No followers, no public stats, no feed a stranger can see.<\u002Fspan>\n        <\u002Fdiv>\n        <div data-rev=\"1\" style=\"padding:20px 18px 22px; border-radius:var(--fl-radius-md); background:var(--fl-surface-card); border:1px solid var(--fl-charcoal-600); box-shadow:inset 0 1px 0 var(--fl-inner-highlight); opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">\n          <span style=\"display:block; font-family:var(--fl-font-display); font-size:12px; font-weight:500; letter-spacing:2px; color:var(--fl-bronze-mid);\">04<\u002Fspan>\n          <span style=\"display:block; margin-top:11px; font-size:16.5px; font-weight:600;\">History can't be rewritten.<\u002Fspan>\n          <span style=\"display:block; margin-top:8px; font-size:13.5px; line-height:1.55; color:var(--fl-text-secondary); text-wrap:pretty;\">Sealed is sealed. You can add to your legacy; you cannot revise it.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-rev=\"1\" style=\"margin-top:clamp(28px,5vw,40px); padding:20px 18px 22px; border-radius:var(--fl-radius-md); background:var(--fl-surface-card); border:1px solid var(--fl-bronze-border-subtle); box-shadow:inset 0 1px 0 var(--fl-inner-highlight); opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">\n        <span style=\"display:block; font-size:11px; font-weight:500; letter-spacing:1.8px; text-transform:uppercase; color:var(--fl-bronze-primary);\">What's real today<\u002Fspan>\n        <span style=\"display:block; margin-top:11px; font-size:14.5px; line-height:1.6; color:var(--fl-text-secondary); max-width:76ch; text-wrap:pretty;\">Chapters, sealing, the Legacy timeline, logging, programs, squads, honors, rank, photos and cardio all run against a live backend — every screen here is a real account. Nothing you log is demo data, and there is no reset before launch. Android has no builds yet, and we'd rather say so.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ═══════════ 8 · FAQ ═══════════ -->\n  <section style=\"background:var(--fl-base); border-top:1px solid var(--fl-charcoal-600); padding:clamp(64px,13vw,120px) var(--gut);\">\n    <div style=\"max-width:820px; margin:0 auto;\">\n      <h2 data-rev=\"1\" style=\"margin:0 0 clamp(24px,5vw,36px); font-family:var(--fl-font-display); font-size:clamp(27px,7vw,42px); font-weight:500; line-height:1.1; opacity:0; transform:translateY(14px); transition:opacity 300ms var(--fl-ease-out), transform 300ms var(--fl-ease-out);\">The obvious questions<\u002Fh2>\n      <details data-analytics=\"faq-open\" style=\"border-top:1px solid var(--fl-charcoal-600);\">\n        <summary style=\"display:flex; align-items:center; gap:16px; min-height:44px; padding:16px 0; cursor:pointer; list-style:none; font-size:16.5px; font-weight:600;\"><span style=\"flex:1;\">Is my data private?<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none; color:var(--fl-bronze-primary);\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin:0 0 20px; font-size:15px; line-height:1.6; color:var(--fl-text-secondary); text-wrap:pretty;\">Yes, by default. Per-section visibility controls, no public profiles, and row-level security on every table. Nothing about you is discoverable by a stranger.<\u002Fp>\n      <\u002Fdetails>\n      <details data-analytics=\"faq-open\" style=\"border-top:1px solid var(--fl-charcoal-600);\">\n        <summary style=\"display:flex; align-items:center; gap:16px; min-height:44px; padding:16px 0; cursor:pointer; list-style:none; font-size:16.5px; font-weight:600;\"><span style=\"flex:1;\">Which phone do I need?<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none; color:var(--fl-bronze-primary);\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin:0 0 20px; font-size:15px; line-height:1.6; color:var(--fl-text-secondary); text-wrap:pretty;\">iPhone. Forge Legacy is an iOS app. Android isn't ready yet, and we'd rather say so than take your email for a list.<\u002Fp>\n      <\u002Fdetails>\n      <details data-analytics=\"faq-open\" style=\"border-top:1px solid var(--fl-charcoal-600);\">\n        <summary style=\"display:flex; align-items:center; gap:16px; min-height:44px; padding:16px 0; cursor:pointer; list-style:none; font-size:16.5px; font-weight:600;\"><span style=\"flex:1;\">I already use another app.<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none; color:var(--fl-bronze-primary);\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin:0 0 20px; font-size:15px; line-height:1.6; color:var(--fl-text-secondary); text-wrap:pretty;\">Run both for a couple of weeks. The program builder takes your existing program today, so you're not starting over to try it.<\u002Fp>\n      <\u002Fdetails>\n      <details data-analytics=\"faq-open\" style=\"border-top:1px solid var(--fl-charcoal-600);\">\n        <summary style=\"display:flex; align-items:center; gap:16px; min-height:44px; padding:16px 0; cursor:pointer; list-style:none; font-size:16.5px; font-weight:600;\"><span style=\"flex:1;\">What if I stop for a while?<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none; color:var(--fl-bronze-primary);\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin:0 0 20px; font-size:15px; line-height:1.6; color:var(--fl-text-secondary); text-wrap:pretty;\">Nothing happens. Your rank doesn't fall, your chapter doesn't fail, and the app doesn't send you a guilt notification. Come back and keep going.<\u002Fp>\n      <\u002Fdetails>\n      <details data-analytics=\"faq-open\" style=\"border-top:1px solid var(--fl-charcoal-600);\">\n        <summary style=\"display:flex; align-items:center; gap:16px; min-height:44px; padding:16px 0; cursor:pointer; list-style:none; font-size:16.5px; font-weight:600;\"><span style=\"flex:1;\">Does it track calories?<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none; color:var(--fl-bronze-primary);\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin:0 0 20px; font-size:15px; line-height:1.6; color:var(--fl-text-secondary); text-wrap:pretty;\">No, and it isn't going to. Nutrition is a different product. This one does training and what training builds.<\u002Fp>\n      <\u002Fdetails>\n      <!-- MEASURED 2026-08-14. Re-measure on publish day. -->\n      <details data-analytics=\"faq-open\" style=\"border-top:1px solid var(--fl-charcoal-600); border-bottom:1px solid var(--fl-charcoal-600);\">\n        <summary style=\"display:flex; align-items:center; gap:16px; min-height:44px; padding:16px 0; cursor:pointer; list-style:none; font-size:16.5px; font-weight:600;\"><span style=\"flex:1;\">How is it built?<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none; color:var(--fl-bronze-primary);\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin:0 0 20px; font-size:15px; line-height:1.6; color:var(--fl-text-secondary); text-wrap:pretty;\">161 database migrations, security policies on every table, 2,362 automated tests, and a live backend. A real application, not a prototype.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ═══════════ 9 · FINAL CTA + FOOTER ═══════════ -->\n  <section id=\"final\" style=\"border-top:1px solid var(--fl-bronze-border-subtle); padding:clamp(72px,14vw,132px) var(--gut) clamp(40px,7vw,64px);\">\n    <div data-scene=\"1\" style=\"max-width:760px; margin:0 auto; text-align:center;\">\n      <!-- PRICING STAGE 1. True until Phase F of the launch checklist. -->\n      <span data-beat=\"0\" style=\"display:block; font-size:11px; font-weight:500; letter-spacing:1.8px; text-transform:uppercase; color:var(--fl-bronze-primary); opacity:0; transition:opacity 400ms var(--fl-ease-out);\">Free while we're testing<\u002Fspan>\n      <p data-beat=\"150\" style=\"margin:16px 0 0; font-family:var(--fl-font-display); font-size:clamp(25px,6.4vw,38px); font-weight:500; line-height:1.18; color:var(--fl-text-secondary); text-wrap:balance; opacity:0; transform:translateY(14px); transition:opacity 450ms var(--fl-ease-out), transform 450ms var(--fl-ease-out);\">Forge Legacy is not helping you win today.<\u002Fp>\n      <p data-beat=\"500\" style=\"margin:12px 0 0; font-family:var(--fl-font-display); font-size:clamp(25px,6.4vw,38px); font-weight:500; line-height:1.18; text-wrap:balance; opacity:0; transform:translateY(14px); transition:opacity 450ms var(--fl-ease-out), transform 450ms var(--fl-ease-out);\">It's helping you become someone you're proud of ten years from now.<\u002Fp>\n\n      <div data-beat=\"1000\" style=\"display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:clamp(32px,6vw,52px); opacity:0; transform:translateY(14px); transition:opacity 400ms var(--fl-ease-out), transform 400ms var(--fl-ease-out);\">\n        <a href=\"#\" data-analytics=\"cta-final\" style=\"display:flex; align-items:center; justify-content:center; width:100%; max-width:340px; height:56px; border-radius:var(--fl-radius-pill); background:var(--fl-bronze-metallic); border:1px solid var(--fl-bronze-metal-border); box-shadow:var(--fl-bronze-metal-top-rim); color:#100B04; font-size:16.5px; font-weight:600;\">Start Chapter One<\u002Fa>\n        <span style=\"font-size:13px; color:var(--fl-gray-400);\">Free to start. On the App Store, for iPhone.<\u002Fspan>\n      <\u002Fdiv>\n\n      <div data-beat=\"1300\" style=\"display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:clamp(44px,8vw,72px); opacity:0; transition:opacity 500ms var(--fl-ease-out);\">\n        <img src=\"09cb0b29-27e0-48ea-9db3-8e3cd09e8048\" alt=\"Forge Legacy\" width=\"88\" height=\"88\" loading=\"lazy\" decoding=\"async\" style=\"width:50px; height:auto; display:block; opacity:0.9;\">\n        <span style=\"font-family:var(--fl-font-display); font-size:12px; font-weight:500; letter-spacing:2.8px; color:var(--fl-text-tertiary);\">FORGE LEGACY<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding:22px var(--gut) 92px; border-top:1px solid var(--fl-charcoal-600);\">\n    <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px; max-width:1180px; margin:0 auto; font-size:13px; color:var(--fl-gray-400);\">\n      <!-- Privacy + Terms must be REAL pages at stable URLs on this domain (App Store Connect fields). -->\n      <a href=\"/privacy\">Privacy<\u002Fa>\n      <a href=\"/terms\">Terms<\u002Fa>\n      <span>[CONTACT EMAIL — must be on this domain]<\u002Fspan>\n      <span style=\"flex:1;\"><\u002Fspan>\n      <span>© 2026 Forge Legacy LLC<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- ═══════════ Sticky CTA — appears once the hook is behind you ═══════════ -->\n  <sc-if value=\"{{ showSticky }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-sticky=\"1\" aria-hidden=\"true\" style=\"position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; align-items:center; gap:14px; padding:9px clamp(14px,4vw,28px); padding-bottom:max(9px, env(safe-area-inset-bottom)); background:var(--fl-surface-nav); backdrop-filter:blur(12px); border-top:1px solid var(--fl-charcoal-600); opacity:0; transform:translateY(100%); transition:opacity 250ms var(--fl-ease-out), transform 250ms var(--fl-ease-out); pointer-events:none;\">\n      <span style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;\">\n        <span style=\"font-family:var(--fl-font-display); font-size:12px; letter-spacing:2.2px;\">FORGE LEGACY<\u002Fspan>\n        <span style=\"font-size:11.5px; color:var(--fl-gray-400);\">Free to start · iPhone<\u002Fspan>\n      <\u002Fspan>\n      <a href=\"#\" data-analytics=\"cta-sticky\" style=\"flex:none; display:flex; align-items:center; justify-content:center; height:44px; padding:0 22px; border-radius:var(--fl-radius-pill); background:var(--fl-bronze-metallic); border:1px solid var(--fl-bronze-metal-border); box-shadow:var(--fl-bronze-metal-top-rim); color:#100B04; font-size:14.5px; font-weight:600;\">Start Chapter One<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;stickyBar&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Sections&quot; }\n}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { showSticky: this.props.stickyBar !== false };\n  }\n\n  componentDidMount() {\n    const root = document.getElementById('flp');\n    if (!root || root.dataset.wired) return;\n    root.dataset.wired = '1';\n\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n    const settle = (el) => {\n      const end = el.dataset.settle;\n      if (end) { el.style.cssText += ';' + end; return; }\n      el.style.opacity = '1';\n      el.style.transform = 'none';\n    };\n\n    const play = (scene) => {\n      if (scene.dataset.played) return;\n      scene.dataset.played = '1';\n      scene.querySelectorAll('[data-beat]').forEach((el) => {\n        const d = reduce ? 0 : parseInt(el.dataset.beat, 10) || 0;\n        if (!d) { settle(el); return; }\n        setTimeout(() => settle(el), d);\n      });\n    };\n\n    const stagger = new Map();\n    const reveal = (el) => {\n      if (el.dataset.revealed) return;\n      el.dataset.revealed = '1';\n      const sec = el.closest('section') || root;\n      const n = stagger.get(sec) || 0;\n      stagger.set(sec, n + 1);\n      const d = reduce ? 0 : Math.min(n, 8) * 70;\n      if (!d) { settle(el); return; }\n      setTimeout(() => settle(el), d);\n    };\n\n    // Repeated sweep rather than one-shot registration: the template streams in,\n    // and a visitor can scroll past a section before it exists.\n    const sweep = () => {\n      const h = window.innerHeight;\n      root.querySelectorAll('[data-rev]:not([data-revealed])').forEach((el) => {\n        if (reduce || el.getBoundingClientRect().top < h * 0.92) reveal(el);\n      });\n      root.querySelectorAll('[data-scene]:not([data-played])').forEach((el) => {\n        if (reduce || el.getBoundingClientRect().top < h * 0.85) play(el);\n      });\n    };\n    this._sweep = sweep;\n\n    const hero = root.firstElementChild;\n    if (hero) play(hero);\n    sweep();\n    window.addEventListener('scroll', sweep, { passive: true });\n    window.addEventListener('resize', sweep);\n    let ticks = 0;\n    const timer = setInterval(() => { sweep(); if (++ticks > 80) clearInterval(timer); }, 250);\n\n    // Sticky CTA: once the hero is behind you, hidden again over the final CTA.\n    let shown = null;\n    const onScroll = () => {\n      const bar = root.querySelector('[data-sticky]');\n      const final = document.getElementById('final');\n      if (!bar || !hero || !final) return;\n      const past = hero.getBoundingClientRect().bottom < window.innerHeight * 0.4;\n      const atFinal = final.getBoundingClientRect().top < window.innerHeight * 0.85;\n      const want = past && !atFinal;\n      if (want === shown) return;\n      shown = want;\n      bar.style.opacity = want ? '1' : '0';\n      bar.style.transform = want ? 'none' : 'translateY(100%)';\n      bar.style.pointerEvents = want ? 'auto' : 'none';\n      bar.setAttribute('aria-hidden', want ? 'false' : 'true');\n    };\n    window.addEventListener('scroll', onScroll, { passive: true });\n    window.addEventListener('resize', onScroll);\n    onScroll();\n\n    root.querySelectorAll('details').forEach((d) => {\n      d.addEventListener('toggle', () => {\n        const mark = d.querySelector('summary span[aria-hidden]');\n        if (mark) mark.textContent = d.open ? '–' : '+';\n      });\n    });\n  }\n\n  componentDidUpdate() {\n    if (this._sweep) this._sweep();\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
