<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:404,&quot;height&quot;:868}}">
class Component extends DCLogic {

  componentDidMount() {

  _tint(seed) {
    const T = [
      'radial-gradient(circle at 42% 32%, #4a3826, #1c1510)',
      'radial-gradient(circle at 45% 35%, #34302a, #17130f)',
      'radial-gradient(circle at 40% 30%, #40301f, #17120c)',

    if (!this.state.ready || typeof React === 'undefined' || !React.createElement) { return { ready: false, notReady: true }; }

    const upArrow = (color) => h('svg', { width: 12, height: 12, viewBox: '0 0 24 24', fill: 'none', stroke: color || 'currentColor', strokeWidth: 2.4, strokeLinecap: 'round', strokeLinejoin: 'round' }, h('path', { d: 'M12 19V5' }), h('path', { d: 'M6 11l6-6 6 6' }));
    const downArrow = (color) => h('svg', { width: 12, height: 12, viewBox: '0 0 24 24', fill: 'none', stroke: color || 'currentColor', strokeWidth: 2.4, strokeLinecap: 'round', strokeLinejoin: 'round' }, h('path', { d: 'M12 5v14' }), h('path', { d: 'M6 13l6 6 6-6' }));
    const crownGlyph = (size) => h('svg', { width: size || 15, height: size || 15, viewBox: '0 0 24 24', fill: 'currentColor' }, h('path', { d: 'M3 8l4 3.5L12 5l5 6.5L21 8l-1.6 10.5H4.6L3 8z' }));

    // rank 1 → 5 (workouts desc); ties keep listed order
    const STAND = [
      { name: 'Marcus Vale', workouts: 7, loggedToday: true, mom: '+1 today', momUp: true },
      { name: 'Ada Ridge', you: true, workouts: 5, loggedToday: true, mom: 'Push Day A · 14m ago' },

      { name: 'Lena Cross', workouts: 2, loggedToday: false, mom: 'Last logged 2 days ago', stale: true },
    ];

    const standings = STAND.map((s, i) => {
      const leader = i === 0;
      const third = i === 2;
      let rowBg = 'var(--fl-surface-card)';
      let rowBorder = '1px solid var(--fl-bronze-border-subtle)';
      let rowShadow = 'var(--fl-shadow-card)';

    const behindTone = '#A97E68';

      chaseColor: behindTone,
      behindLine: '2 behind Marcus',
      leadIcon: h('span', { style: { display: 'inline-flex' } }, downArrow(aheadTone)),
      leadColor: aheadTone,
      aheadLine: '1 ahead of Dana',
      standings: standings,
      rules: rules,
      goBack: () => { (function(){try{return !!document.referrer&&new URL(document.referrer).origin===window.location.origin;}catch(e){return false;}})() ? window.history.back() : (window.location.href = 'Squad%20Detail.dc.html'); },
    };
  }
}
