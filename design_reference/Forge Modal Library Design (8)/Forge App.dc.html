<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/tokens/foundation.css">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/styles.css">
<style>
  html,body{margin:0;height:100%;background:#060708;}
  *{box-sizing:border-box;}
  .fa-scroll::-webkit-scrollbar{width:9px;}
  .fa-scroll::-webkit-scrollbar-thumb{background:rgba(191,143,79,0.22);border-radius:6px;}
  .fa-scroll::-webkit-scrollbar-track{background:transparent;}
</style>
</helmet>
<div style="display:flex; height:100vh; width:100%; overflow:hidden; font-family:var(--fl-font-sans, system-ui, sans-serif); background:radial-gradient(120% 100% at 50% 0%, #101113 0%, #060708 60%);">

  <!-- ══════════ SHEET · screen index ══════════ -->
  <aside style="flex:none; width:308px; height:100%; display:flex; flex-direction:column; border-right:1px solid var(--fl-charcoal-700, #26282c); background:rgba(10,11,13,0.72);">
    <div style="flex:none; padding:20px 20px 14px; border-bottom:1px solid var(--fl-charcoal-800, #1a1b1e);">
      <div style="display:flex; align-items:center; gap:11px;">
        <svg width="22" height="32" viewBox="16 0 68 102" aria-hidden="true" style="display:block; flex:none; filter:drop-shadow(0 0 8px rgba(198,156,100,0.22));"><defs><linearGradient id="faLogo" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#DCB57A"></stop><stop offset="52%" stop-color="#BF8F4F"></stop><stop offset="100%" stop-color="#835F32"></stop></linearGradient></defs><g fill="url(#faLogo)"><polygon points="43,6 57,6 57,96 43,96"></polygon><polygon points="23,42 37,27 37,96 23,96"></polygon><polygon points="63,27 77,42 77,96 63,96"></polygon></g></svg>
        <div style="display:flex; flex-direction:column; gap:1px;">
          <span style="font-family:var(--fl-font-display); font-size:17px; font-weight:600; letter-spacing:0.2px; color:var(--fl-text-primary, #ece7de);">Forge Legacy</span>
          <span style="font-size:10.5px; font-weight:600; letter-spacing:1.6px; text-transform:uppercase; color:var(--fl-text-bronze-label, #bf8f4f);">App Map · {{ total }} screens</span>
        </div>
      </div>
      <div style="margin-top:15px; position:relative; display:flex; align-items:center;">
        <span style="position:absolute; left:11px; display:inline-flex; color:var(--fl-text-tertiary, #7c7d80); pointer-events:none;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></span>
        <input value="{{ query }}" onInput="{{ onQuery }}" placeholder="Search screens" spellcheck="false" style="width:100%; padding:9px 12px 9px 32px; font-size:13px; color:var(--fl-text-primary,#ece7de); background:var(--fl-surface-recessed,#141518); border:1px solid var(--fl-charcoal-600,#33353a); border-radius:9px; outline:none;">
      </div>
    </div>

    <div class="fa-scroll" style="flex:1; min-height:0; overflow-y:auto; padding:8px 10px 30px;">
      <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="6">
        <div style="margin-top:14px;">
          <div style="display:flex; align-items:center; justify-content:space-between; padding:4px 10px 7px;">
            <span style="font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--fl-text-bronze-label,#bf8f4f);">{{ sec.title }}</span>
            <span style="font-size:10px; font-weight:600; color:var(--fl-text-tertiary,#7c7d80);">{{ sec.count }}</span>
          </div>
          <sc-for list="{{ sec.items }}" as="item" hint-placeholder-count="4">
            <div onClick="{{ item.load }}" role="button" tabindex="0" style="position:relative; padding:8px 12px 8px 15px; border-radius:8px; cursor:pointer; font-size:13px; line-height:1.3; color:var(--fl-text-secondary,#b4b0a8); transition:color 140ms ease, background 140ms ease;" style-hover="background:rgba(191,143,79,0.07); color:var(--fl-text-primary,#ece7de);">
              <sc-if value="{{ item.active }}" hint-placeholder-val="{{ false }}">
                <span aria-hidden="true" style="position:absolute; inset:0; background:var(--fl-bronze-tint, rgba(191,143,79,0.12)); border:1px solid var(--fl-bronze-border, rgba(191,143,79,0.34)); border-radius:8px; pointer-events:none;"></span>
                <span aria-hidden="true" style="position:absolute; left:0; top:7px; bottom:7px; width:3px; border-radius:2px; background:var(--fl-bronze-primary,#bf8f4f);"></span>
              </sc-if>
              <span style="position:relative;">{{ item.label }}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
      <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
        <div style="padding:26px 14px; text-align:center; font-size:12.5px; color:var(--fl-text-tertiary,#7c7d80);">No screens match "{{ query }}".</div>
      </sc-if>
    </div>
  </aside>

  <!-- ══════════ APP · live navigable frame ══════════ -->
  <main style="flex:1; min-width:0; height:100%; display:flex; flex-direction:column;">
    <!-- control bar -->
    <div style="flex:none; display:flex; align-items:center; gap:8px; padding:12px 20px; border-bottom:1px solid var(--fl-charcoal-800,#1a1b1e);">
      <div onClick="{{ back }}" role="button" tabindex="0" title="Back" style="width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; color:var(--fl-text-secondary,#b4b0a8); border:1px solid var(--fl-charcoal-700,#26282c);" style-hover="border-color:var(--fl-bronze-border,rgba(191,143,79,0.34)); color:var(--fl-text-primary,#ece7de);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></div>
      <div onClick="{{ fwd }}" role="button" tabindex="0" title="Forward" style="width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; color:var(--fl-text-secondary,#b4b0a8); border:1px solid var(--fl-charcoal-700,#26282c);" style-hover="border-color:var(--fl-bronze-border,rgba(191,143,79,0.34)); color:var(--fl-text-primary,#ece7de);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></div>
      <div onClick="{{ reload }}" role="button" tabindex="0" title="Reload" style="width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; color:var(--fl-text-secondary,#b4b0a8); border:1px solid var(--fl-charcoal-700,#26282c);" style-hover="border-color:var(--fl-bronze-border,rgba(191,143,79,0.34)); color:var(--fl-text-primary,#ece7de);"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v5h-5"></path></svg></div>

      <div style="flex:1; min-width:0; margin:0 4px; padding:8px 14px; display:flex; align-items:center; gap:9px; border-radius:9px; background:var(--fl-surface-recessed,#141518); border:1px solid var(--fl-charcoal-700,#26282c);">
        <span style="width:6px; height:6px; flex:none; border-radius:50%; background:var(--fl-bronze-primary,#bf8f4f);"></span>
        <span style="flex:1; min-width:0; font-size:12.5px; color:var(--fl-text-secondary,#b4b0a8); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ currentLabel }}</span>
      </div>

      <div onClick="{{ home }}" role="button" tabindex="0" title="Home" style="height:34px; flex:none; display:flex; align-items:center; gap:7px; padding:0 13px; border-radius:8px; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--fl-text-secondary,#b4b0a8); border:1px solid var(--fl-charcoal-700,#26282c);" style-hover="border-color:var(--fl-bronze-border,rgba(191,143,79,0.34)); color:var(--fl-text-primary,#ece7de);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>Home</div>
      <div onClick="{{ onboarding }}" role="button" tabindex="0" title="Start from onboarding" style="height:34px; flex:none; display:flex; align-items:center; gap:7px; padding:0 13px; border-radius:8px; cursor:pointer; font-size:12.5px; font-weight:600; color:#1A1206; background:var(--fl-bronze-metallic, linear-gradient(180deg,#d9b578,#bf8f4f)); border:1px solid rgba(176,136,84,0.5);" style-hover="filter:brightness(1.06);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>Onboarding</div>
    </div>

    <!-- device stage -->
    <div style="flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:22px; overflow:auto;">
      <div style="position:relative; flex:none; width:428px; height:904px; max-height:100%; padding:13px; border-radius:52px; background:linear-gradient(160deg,#1c1d20,#0c0d0f); border:1px solid var(--fl-charcoal-600,#33353a); box-shadow:0 40px 90px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);">
        <div style="position:relative; width:100%; height:100%; border-radius:40px; overflow:hidden; background:#08090B; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.6);">
          <span aria-hidden="true" style="position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:29px; border-radius:16px; background:#000; z-index:5;"></span>
          <iframe title="Forge Legacy app" src="{{ srcEnc }}" ref="{{ frameRef }}" style="width:100%; height:100%; border:0; display:block; background:#08090B;"></iframe>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { current: 'Forge Home.dc.html', query: '' };

  componentDidMount() {
    this._poll = setInterval(() => {
      try {
        const w = this._frame && this._frame.contentWindow;
        if (!w || !w.location) return;
        const file = decodeURIComponent((w.location.pathname || '').split('/').pop() || '');
        if (file && file.endsWith('.dc.html') && file !== this.state.current) {
          this.setState({ current: file });
        }
      } catch (e) { /* cross-doc timing; ignore */ }
    }, 500);
  }
  componentWillUnmount() { if (this._poll) clearInterval(this._poll); }

  _nav(file) {
    const href = encodeURI(file);
    try {
      if (this._frame && this._frame.contentWindow) { this._frame.contentWindow.location.href = href; }
    } catch (e) {
      if (this._frame) this._frame.setAttribute('src', href);
    }
    this.setState({ current: file });
  }

  renderVals() {
    const SECTIONS = [
      { title: 'Onboarding & Start', items: ['Forge Onboarding', 'Forge Legacy Landing'] },
      { title: 'Home & Training', items: ['Forge Home', 'Forge Home Gym', 'Forge Beginner Home', 'Forge Beginner Home Day 2', 'Forge Programs Catalog', 'Forge Program', 'Forge Program Detail', 'Forge Program Builder', 'Forge Free Workout Builder', 'Forge Strength Start', 'Forge Active Workout', 'Forge Workout Complete', 'Forge Active Run', 'Forge Run Record', 'Forge Activity Type Picker', 'Forge Activity Detail', 'Forge Activity History', 'Forge Workout Templates', 'Forge Workout Template Detail', 'Forge Workout Modalities Collection', 'Forge Training Splits Collection', 'Forge Exercise Library', 'Forge Exercise Detail', 'Forge Exercise Picker', 'Forge Create Custom Exercise'] },
      { title: 'Legacy & Progress', items: ['Forge Legacy', 'Forge Legacy Timeline', 'Forge Legacy Unlocked', 'Forge Chapter Detail', 'Forge Chapter Reflection', 'Forge Honors Hub', 'Honors Catalog', 'Forge Honor Engraved', 'Forge Accomplishments', 'Forge Trophy Case', 'Forge Progress Hub', 'Forge Goal Hub', 'Forge Goal Detail', 'Forge Goal Create Edit', 'Forge Mission', 'Forge Transformation', 'Forge Transformation Entry Detail', 'Forge Photos Gallery', 'Rank Progression'] },
      { title: 'Social & Profile', items: ['Forge Friends Feed', 'Forge Public Profile', 'Forge Status Update', 'Post Detail', 'Add Friend by Handle', 'Invite by Handle'] },
      { title: 'Squads', items: ['Squads Hub', 'Squad Detail', 'Squad Preview', 'Squad Composer', 'Squad Records', 'Squad Settings', 'Squad Settings Member', 'Squad Join Requests', 'Squad Invite', 'Squad Transfer Ownership', 'Report Squad', 'Create Squad', 'Discover Squads'] },
      { title: 'Communities', items: ['Community Home', 'Community Composer', 'Community Profile', 'Create Community', 'Edit Community', 'Discover Communities'] },
      { title: 'Competitions', items: ['Forge Competitions', 'Forge Competition History', 'Forge Challenge', 'Forge Challenge Invite', 'Forge Challenge Results', 'Forge Create Challenge', 'Forge Podium Reveal', 'Forge Current Champions', 'Forge Hall of Champions'] },
      { title: 'Settings & Account', items: ['Forge Settings Root', 'Forge Account Settings', 'Forge Preferences', 'Forge Profile Visibility', 'Forge Subscription', 'Forge Notifications', 'Forge Share Configuration'] },
      { title: 'System & Reference', items: ['Forge Screen Gallery', 'Forge Modal Library', 'Forge Symbol Library', 'Forge Tier-3 Cards', 'Forge Accent Palettes', 'Forge Artwork Reference', 'Forge Workout Artwork', 'Forge Home Artwork Resolver', 'Forge Resolver Test Bench', 'Forge Animation Coloring Preview', 'Forge Ceremony Language', 'Forge Build Status', 'Forge QA Audit', 'Social Architecture Verification', 'Canvas', 'Rank System Reference', 'Forge Rank Seal', 'Rank Progression', 'Architect Rank Badges', 'Builder Rank Badges', 'Craftsman Rank Badges', 'Established Rank Badges', 'Foundation Rank Badges', 'Legacy Rank Badges', 'Legends Rank Badges', 'FoundationBadge', 'RankFrame'] },
    ];

    const q = (this.state.query || '').trim().toLowerCase();
    const total = SECTIONS.reduce((n, s) => n + s.items.length, 0);
    const cur = this.state.current;

    const sections = SECTIONS.map((s) => {
      const items = s.items
        .filter((f) => !q || f.toLowerCase().includes(q))
        .map((f) => ({
          file: f,
          label: f.replace(/^Forge /, ''),
          active: (f + '.dc.html') === cur,
          load: () => this._nav(f + '.dc.html'),
        }));
      return { title: s.title, count: items.length, items };
    }).filter((s) => s.items.length);

    return {
      sections,
      total,
      noResults: q && sections.length === 0,
      query: this.state.query,
      currentLabel: (cur || '').replace(/\.dc\.html$/, '').replace(/^Forge /, ''),
      srcEnc: encodeURI('Forge Home.dc.html'),
      onQuery: (e) => this.setState({ query: e.target.value }),
      frameRef: (el) => { this._frame = el; },
      back: () => { try { this._frame.contentWindow.history.back(); } catch (e) {} },
      fwd: () => { try { this._frame.contentWindow.history.forward(); } catch (e) {} },
      reload: () => { try { this._frame.contentWindow.location.reload(); } catch (e) {} },
      home: () => this._nav('Forge Home.dc.html'),
      onboarding: () => this._nav('Forge Onboarding.dc.html'),
    };
  }
}
</script>
</body>
</html>
