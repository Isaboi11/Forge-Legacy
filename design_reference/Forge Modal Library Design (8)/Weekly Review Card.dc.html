<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/tokens/foundation.css">
  <link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/styles.css">
  <script src="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/_ds_bundle.js"></script>
  <style>
    body { margin:0; background:#07090B; }
    a { color: var(--fl-bronze-primary); text-decoration: none; }
    a:hover { color: var(--fl-bronze-bright); }
    ::-webkit-scrollbar { width:0; height:0; }
  </style>
</helmet>

<div style="min-height:100vh; background:var(--fl-bg-atmospheric); display:flex; flex-direction:column; align-items:center; gap:26px; padding:40px 20px 56px; font-family:var(--fl-font-sans); box-sizing:border-box;">

  <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
    <span style="font-size:10.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:var(--fl-text-bronze-label);">S-1 · Home card</span>
    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
        <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Pill" size="sm" tone="{{ c.tone }}" on-click="{{ c.set }}" hint-size="auto,26px">{{ c.label }}</x-import>
      </sc-for>
    </div>
    <span style="font-size:12.5px; color:var(--fl-text-tertiary); max-width:400px; text-align:center; text-wrap:pretty;">{{ stateNote }}</span>
  </div>

  <div style="width:390px; height:844px; flex:none; position:relative; display:flex; flex-direction:column; background:var(--fl-charcoal-900); border:1px solid var(--fl-charcoal-500); border-radius:46px; overflow:hidden; box-shadow:0 60px 120px -40px rgba(0,0,0,0.9), 0 0 0 10px #0A0C0E;">

    <div style="flex:none; display:flex; align-items:center; justify-content:space-between; padding:14px 26px 2px; font-size:12.5px; font-weight:600; letter-spacing:0.3px; color:var(--fl-text-secondary);">
      <span>9:41</span>
      <span style="display:flex; align-items:center; gap:6px;">
        <span style="width:16px; height:9px; border:1px solid var(--fl-gray-600); border-radius:2px; display:inline-block;"></span>
        <span style="font-size:11px;">Forge</span>
      </span>
    </div>

    <div style="flex:none;">
      <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.AppBar" title="Forge" serif="{{ true }}" transparent="{{ true }}" hint-size="100%,56px"></x-import>
    </div>

    <div style="flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:24px; padding:2px 18px 30px;">

      <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Card" variant="hero" padding="22px" hint-size="100%,240px">
        <div style="display:flex; flex-direction:column; gap:16px;">
          <span style="font-size:11px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:var(--fl-text-bronze-label);">In progress</span>
          <div style="display:flex; flex-direction:column; gap:7px;">
            <span style="font-family:var(--fl-font-display); font-size:26px; letter-spacing:-0.4px; color:var(--fl-text-primary);">Push A · Week 3</span>
            <span style="font-size:13.5px; color:var(--fl-text-tertiary);">2 of 6 exercises · started 18 min ago</span>
          </div>
          <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.ProgressBar" value="{{ 2 }}" max="{{ 6 }}" hint-size="100%,10px"></x-import>
          <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Button" variant="primary" full-width="{{ true }}" hint-size="100%,46px">Resume session</x-import>
        </div>
      </x-import>

      <sc-if value="{{ showCard }}" hint-placeholder-val="{{ true }}">
        <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Card" padding="0" hint-size="100%,300px">
          <div style="position:relative; overflow:hidden; border-radius:inherit;">
            <span style="position:absolute; top:0; left:18px; right:18px; height:1px; background:linear-gradient(90deg, transparent, rgba(205,160,99,0.42), transparent); pointer-events:none;"></span>
            <span style="position:absolute; top:-70px; left:-40px; width:250px; height:190px; background:radial-gradient(circle at 35% 40%, rgba(191,143,79,0.16), transparent 70%); pointer-events:none;"></span>

            <div style="position:relative; display:flex; flex-direction:column; gap:18px; padding:22px 20px 20px;">

              <div style="display:flex; align-items:center; gap:14px;">
                <img src="assets/coach-holt-mark.png" alt="Coach Holt" style="width:54px; height:54px; flex:none; border-radius:var(--fl-radius-round); object-fit:cover; border:1px solid var(--fl-bronze-border); box-shadow:var(--fl-shadow-image);">
                <div style="display:flex; flex-direction:column; gap:6px; min-width:0;">
                  <span style="font-size:9.5px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:var(--fl-text-bronze-label);">3 – 9 August</span>
                  <span style="font-family:var(--fl-font-display); font-size:18px; font-weight:600; line-height:1.2; color:var(--fl-text-primary);">{{ title }}</span>
                </div>
              </div>

              <p style="margin:0; font-size:14px; line-height:1.5; color:var(--fl-text-secondary); text-wrap:pretty;">{{ body }}</p>

              <div style="display:flex; gap:1px; background:var(--fl-charcoal-700); border:var(--fl-border-subtle); border-radius:var(--fl-radius-md); box-shadow:var(--fl-border-inset); overflow:hidden;">
                <sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
                  <div style="flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:6px; padding:13px 6px; background:var(--fl-surface-recessed);">
                    <span style="display:flex; align-items:baseline; gap:3px;">
                      <span style="font-family:var(--fl-font-display); font-size:19px; font-weight:600; letter-spacing:-0.3px; line-height:1; color:var(--fl-text-stat);">{{ s.value }}</span>
                      <span style="font-size:11px; font-weight:600; color:var(--fl-text-tertiary);">{{ s.unit }}</span>
                    </span>
                    <span style="font-size:9px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--fl-text-bronze-label);">{{ s.label }}</span>
                  </div>
                </sc-for>
              </div>

              <div style="display:flex; align-items:center; gap:14px;">
                <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Button" variant="primary" on-click="{{ noop }}" hint-size="auto,46px">{{ primaryLabel }}</x-import>
                <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Button" variant="text" on-click="{{ skip }}" hint-size="auto,44px">Skip</x-import>
              </div>
            </div>
          </div>
        </x-import>
      </sc-if>

      <div>
        <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.SectionHeader" label="Your squads" action="All" hint-size="100%,20px"></x-import>
        <div style="display:flex; flex-direction:column; gap:2px; padding:6px; border:var(--fl-border-subtle); border-radius:var(--fl-radius-lg); background:var(--fl-surface-card);">
          <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.ListRow" title="Iron Ledger" subtitle="4 of 6 trained this week" on-click="{{ noop }}" hint-size="100%,56px"></x-import>
          <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.ListRow" title="Sunday Long Haul" subtitle="Recap posted" on-click="{{ noop }}" hint-size="100%,56px"></x-import>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:1060}}">
const STATES = {
  entitled: {
    label: 'Entitled',
    note: 'The common case. Holt\u2019s sentence carries the card; the three stats are a teaser, and each one is now labelled.',
    title: 'Holt looked at your week',
    body: '3 sessions this week. Heaviest was Barbell Back Squat at 315 lb. Keep it there.',
    stats: [
      { value: '3', unit: '', label: 'Sessions' },
      { value: '24,180', unit: 'lb', label: 'Volume' },
      { value: '2:41:05', unit: '', label: 'Under iron' }
    ],
    primaryLabel: 'View review'
  },
  long: {
    label: 'Long note',
    note: 'Longest composed note (~180 characters). The frame grows downward; nothing reflows.',
    title: 'Holt looked at your week',
    body: '6 sessions. That is a heavy week. 3 personal records in it. Recovery earns that back.',
    stats: [
      { value: '6', unit: '', label: 'Sessions' },
      { value: '71,940', unit: 'lb', label: 'Volume' },
      { value: '5:38:22', unit: '', label: 'Under iron' }
    ],
    primaryLabel: 'View review'
  },
  locked: {
    label: 'Locked',
    note: 'Same frame, same position, same mark. Only the title, body and primary action change.',
    title: 'Your week is ready',
    body: '4 sessions last week. Holt\u2019s read on it comes with the paid tier.',
    stats: [
      { value: '4', unit: '', label: 'Sessions' },
      { value: '31,260', unit: 'lb', label: 'Volume' },
      { value: '3:24:18', unit: '', label: 'Under iron' }
    ],
    primaryLabel: 'See what you get'
  },
  absent: {
    label: 'Skipped / no review',
    note: 'Skipped this session, or no row was written at all. Nothing renders in its place \u2014 the feed simply closes up.'
  }
};

class Component extends DCLogic {
  state = { st: 'entitled' };

  renderVals() {
    const key = STATES[this.state.st] ? this.state.st : 'entitled';
    const s = STATES[key];
    return {
      chips: Object.keys(STATES).map(k => ({
        label: STATES[k].label,
        tone: k === key ? 'bronze' : 'muted',
        set: () => this.setState({ st: k })
      })),
      stateNote: s.note,
      showCard: key !== 'absent',
      title: s.title,
      body: s.body,
      stats: s.stats,
      primaryLabel: s.primaryLabel,
      skip: () => this.setState({ st: 'absent' }),
      noop: () => {}
    };
  }
}
</script>
</body>
</html>
