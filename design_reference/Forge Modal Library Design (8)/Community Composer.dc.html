        trophy: sv(['M7 5h10v3a5 5 0 0 1-10 0z', 'M7 6H4v1.5a3.5 3.5 0 0 0 3.5 3.5', 'M17 6h3v1.5A3.5 3.5 0 0 1 16.5 11', 'M9.5 14h5', 'M12 11v3', 'M8.5 18.5h7'], size, sw),
        help: sv(['M9 9a3 3 0 1 1 4 2.8c-.9.5-1.5 1-1.5 2.2', 'M12 17.5v.01', 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z'], size, sw),
        poll: sv(['M6 20V10', 'M12 20V4', 'M18 20v-7'], size, sw),
        calendar: sv(['M4 6h16v14H4z', 'M4 10h16', 'M8.5 3.5v4', 'M15.5 3.5v4'], size, sw),
        dumbbell: ic('dumbbell', size, sw),
        external: sv(['M14 5h5v5', 'M19 5l-8 8', 'M12 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19h11a1.5 1.5 0 0 0 1.5-1.5V13'], size, sw),
        flag: sv(['M6 21V4', 'M6 5h11l-1.6 3.2L17 12H6'], size, sw)
      };
      return M[tid] || M.message;
    };

    const lockIcon = wrap(sv(['M6 11V8a4 4 0 0 1 8 0', 'M5 11h10v7H5z'], 12, 1.9));
    const shieldIcon = wrap(ic('shield', 15, 1.9));
    const plusIcon = wrap(sv('M12 5v14M5 12h14', 13, 2.2));
    const removeIcon = wrap(sv('M6 6l12 12M18 6L6 18', 14, 2));

    // ── type picker ──
    const allTypes = PS.TYPES;
    const memberTypes = allTypes.filter(t => t.gate === 'member').map(t => ({ key: t.id, label: t.label, icon: wrap(typeGlyph(t.icon, 20, 1.8)), select: () => this._pick(t.id) }));
    const modList = allTypes.filter(t => t.gate === 'mod');
    const canMod = role === 'owner' || role === 'mod';
    const modTypes = modList.map(t => {
      const locked = !canMod;
      return {
        key: t.id, label: t.label, locked,
        icon: wrap(typeGlyph(t.icon, 20, 1.8)),
        iconBg: locked ? 'var(--fl-charcoal-800)' : 'radial-gradient(circle at 50% 34%, rgba(191,143,79,0.18), transparent 72%), var(--fl-surface-recessed)',
        iconBorder: locked ? 'var(--fl-charcoal-600)' : 'var(--fl-bronze-border-subtle)',
        iconColor: locked ? 'var(--fl-text-tertiary)' : 'var(--fl-bronze-bright)',
        labelColor: locked ? 'var(--fl-text-secondary)' : 'var(--fl-text-primary)',
        cardStyle: { display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: '9px', padding: '14px', borderRadius: 'var(--fl-radius-lg)', border: '1px solid ' + (locked ? 'var(--fl-charcoal-700)' : 'var(--fl-bronze-border-subtle)'), background: locked ? 'var(--fl-surface-recessed)' : 'var(--fl-surface-card)', boxShadow: locked ? 'none' : 'var(--fl-shadow-card)', opacity: locked ? 0.72 : 1, cursor: 'pointer', textAlign: 'left', transition: 'transform 120ms var(--fl-ease-out)' },
        select: () => { if (locked) this._toast('Only owners and moderators can post ' + t.label.toLowerCase() + 's', 'bronze'); else this._pick(t.id); }
      };
    });

    // ── compose fields ──
    const F = S.form;
    const field = (key, label, ph, area, rows) => ({ key, label, ph, isArea: !!area, isText: !area, rows: rows || 3, value: F[key] || '', onInput: (e) => this._set(key, e.target.value) });
    let fields = [], hasMediaField = false, mediaPlaceholder = 'Photo', hasPollFields = false, showAchPreview = false;
    switch (S.type) {
      case 'discussion': fields = [field('body', 'Post', 'Share a training note, a win, a question\u2026', true, 5)]; break;
      case 'question': fields = [field('body', 'Your question', 'Ask the community\u2026', true, 4)]; break;
      case 'photo': hasMediaField = true; mediaPlaceholder = 'Add a photo'; fields = [field('body', 'Caption', 'Say something (optional)\u2026', true, 3)]; break;
      case 'formcheck': hasMediaField = true; mediaPlaceholder = 'Add a video'; fields = [field('dur', 'Clip length', '0:27'), field('body', 'What should people look at?', 'e.g. Does my hip rise look early?', true, 3)]; break;
      case 'achievement': showAchPreview = true; fields = [field('exercise', 'Lift / movement', 'Bench Press'), field('value', 'Result', '405 lb'), field('label', 'Label', 'New Personal Record'), field('body', 'Say something (optional)', 'All glory to the process\u2026', true, 2)]; break;
      case 'poll': hasPollFields = true; fields = [field('body', 'Question', 'What should we\u2026')]; break;
      case 'event': fields = [field('title', 'Event name', 'Saturday Community Lift'), field('date', 'Date', 'Oct 12'), field('when', 'Time & place', 'Sat \u00b7 9:00 AM \u00b7 Main Floor'), field('body', 'Details (optional)', 'Bring a friend\u2026', true, 2)]; break;
      case 'forgeprogram': fields = [field('title', 'Program name', 'October Strength Block'), field('meta', 'Details', '8 weeks \u00b7 Upper / Lower \u00b7 4 days/wk'), field('body', 'Say something (optional)', 'Save it and run it when\u2026', true, 2)]; break;
      case 'paidprogram': fields = [field('title', 'Program name', 'Hypertrophy Foundations'), field('meta', 'Details', '12 weeks \u00b7 PPL \u00b7 imports to Forge'), field('price', 'Price', '$29'), field('body', 'Say something (optional)', 'Same plan my clients run\u2026', true, 2)]; break;
      case 'milestone': fields = [field('title', 'Goal', 'Collective 1,000,000 lb month'), field('mile', 'Progress %', '0'), field('body', 'Rally the community (optional)', 'Every set counts\u2026', true, 2)]; break;
    }

    // poll options
    const pollOptions = S.pollOptions.map((v, i) => ({ key: i, value: v, ph: 'Option ' + (i + 1), removable: S.pollOptions.length > 2,
      onInput: (e) => this.setState(st => { const a = st.pollOptions.slice(); a[i] = e.target.value; return { pollOptions: a }; }),
      remove: () => this.setState(st => ({ pollOptions: st.pollOptions.filter((_, j) => j !== i) })) }));
    const canAddOption = S.pollOptions.length < 4;
    const addOption = () => this.setState(st => ({ pollOptions: st.pollOptions.concat(['']) }));

    const TYPE = PS.type(S.type) || {};
    const valid = this._valid();
    const postBtnStyle = { flex: 'none', padding: '9px 18px', borderRadius: 'var(--fl-radius-md)', border: '1px solid ' + (valid ? 'var(--fl-bronze-border)' : 'var(--fl-charcoal-600)'), background: valid ? 'var(--fl-bronze-fill)' : 'var(--fl-charcoal-800)', color: valid ? 'var(--fl-bronze-bright)' : 'var(--fl-text-tertiary)', fontSize: '13.5px', fontWeight: 700, letterSpacing: '0.3px', cursor: valid ? 'pointer' : 'default', boxShadow: valid ? 'var(--fl-glow-subtle)' : 'none' };

    const toastColor = S.toastTone === 'positive' ? '#6E8E74' : 'var(--fl-icon-bronze)';
    const modGate = TYPE.gate === 'mod';

    return {
      ready: true, notReady: false,
      isPick: S.step === 'pick', isCompose: S.step === 'compose',
      leftIcon: wrap(S.step === 'compose' ? sv('M15 5l-7 7 7 7', 19, 2) : sv('M6 6l12 12M18 6L6 18', 19, 2)),
      onLeftAction: () => { if (S.step === 'compose') this.setState({ step: 'pick', type: null }); else this._close(); },
      barTitle: S.step === 'compose' ? (TYPE.label || 'Post') : 'Create Post',
      barSub: S.step === 'compose' ? (community.name || '') : 'Choose what to share',
      submitPost: () => this._submit(), postBtnStyle,
      memberTypes, modTypes, hasModTypes: modList.length > 0, viewerCanMod: canMod,
      lockIcon, plusIcon, removeIcon, shieldIcon,
      typeIcon: wrap(typeGlyph(TYPE.icon || 'message', 12, 1.9)), typeLabel: TYPE.label || '', communityName: community.name || '',
      hasMediaField, mediaPlaceholder, fields,
      hasPollFields, pollOptions, canAddOption, addOption,
      showAchPreview, achValuePreview: (F.value || '').trim() || '405 lb', achExercisePreview: (F.exercise || '').trim() || 'Bench Press', achLabelPreview: (F.label || 'New Personal Record').trim(),
      showGateNote: modGate && S.step === 'compose', gateNote: 'You\u2019re posting as ' + (role === 'owner' ? 'the owner' : 'a moderator') + '. ' + (TYPE.label || 'This') + ' posts are visible to everyone in the community.',
      toastOpen: !!S.toastMsg, toastMsg: S.toastMsg || '', toastIcon: wrap(ic('flame', 17, 1.9)), toastIconColor: toastColor
    };
  }

  _close() { if ((function(){try{return !!document.referrer&&new URL(document.referrer).origin===window.location.origin;}catch(e){return false;}})()) window.history.back(); else window.location.href = 'Community%20Home.dc.html'; }
}
</script>
