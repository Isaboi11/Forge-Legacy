    <sc-if value="{{ notReady }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--fl-bg-primary);">

      </div>
    </sc-if>

    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">

        <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.AppBar" title="{{ title }}" on-close="{{ onClose }}" actions="{{ filterBtn }}" hint-size="100%,56px"></x-import>

      <!-- sub-header: replacing banner + search + applied filters -->

            <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;">
              <span style="font-size:8.5px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--fl-text-tertiary);">Replacing</span>

        </sc-if>

          <input class="fl-pick-search" type="text" placeholder="Search exercises" value="{{ search }}" onInput="{{ onSearch }}" />
        </div>
        <sc-if value="{{ hasFilters }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; align-items:center; gap:7px; flex-wrap:wrap;">
            <sc-for list="{{ appliedChips }}" as="f" hint-placeholder-count="1">
              <button type="button" onClick="{{ f.onRemove }}" style="display:inline-flex; align-items:center; gap:6px; padding:5px 8px 5px 11px; border-radius:var(--fl-radius-pill); border:1px solid var(--fl-bronze-border); background:var(--fl-bronze-tint); cursor:pointer;"><span style="font-size:11px; font-weight:600; color:var(--fl-bronze-bright);">{{ f.label }}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--fl-bronze-bright)" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>

            <button type="button" onClick="{{ onClearFilters }}" style="padding:5px 10px; background:transparent; border:none; cursor:pointer; font-size:11px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:var(--fl-text-tertiary);">Clear</button>
          </div>
        </sc-if>
      </div>

      <!-- ═══ SCROLL BODY ═══ -->
      <div class="fl-scroll" style="flex:1; min-height:0; overflow-y:auto; padding:16px 18px 20px; position:relative; z-index:1;">

        <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">

          <sc-if value="{{ hasBest }}" hint-placeholder-val="{{ false }}">
            <div style="padding:0 2px 3px;"><x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.SectionHeader" label="Best replacements" hint-size="100%,20px"></x-import></div>
            <span style="display:block; padding:0 2px 11px; font-size:11.5px; color:var(--fl-text-tertiary);">Closest functional matches to {{ replacingName }}</span>
            <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:22px;">
              <sc-for list="{{ best }}" as="it" hint-placeholder-count="3">
                <button type="button" onClick="{{ it.onSelect }}" style="width:100%; display:flex; align-items:center; gap:13px; padding:11px 13px; border-radius:var(--fl-radius-lg); border:1px solid {{ it.borderColor }}; background:{{ it.bg }}; cursor:pointer; text-align:left;">
                  <span style="flex:none; width:40px; height:40px; border-radius:var(--fl-radius-round); border:1px solid var(--fl-bronze-border-subtle); background:var(--fl-icon-container-bg); display:flex; align-items:center; justify-content:center; color:var(--fl-icon-bronze);">{{ it.icon }}</span>
                  <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
                    <span style="font-size:14.5px; font-weight:600; color:var(--fl-text-primary);">{{ it.name }}</span>
                    <span style="font-size:11.5px; color:var(--fl-text-tertiary); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ it.sub }}</span>

                  <span role="button" tabindex="0" aria-label="Exercise details" onClick="{{ it.onInfo }}" style="flex:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--fl-text-tertiary); cursor:pointer;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5" stroke-linecap="round"></path><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"></circle></svg></span>
                  <span style="flex:none; width:22px; height:22px; display:flex; align-items:center; justify-content:center;">{{ it.mark }}</span>
                </button>
              </sc-for>
            </div>
          </sc-if>

          <sc-if value="{{ hasMine }}" hint-placeholder-val="{{ false }}">

                    <span style="font-size:11.5px; color:var(--fl-text-tertiary); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ it.sub }}</span>
                  </span>
                  <span role="button" tabindex="0" aria-label="Exercise details" onClick="{{ it.onInfo }}" style="flex:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--fl-text-tertiary); cursor:pointer;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5" stroke-linecap="round"></path><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"></circle></svg></span>

                <span style="font-size:10px; font-weight:600; color:var(--fl-text-tertiary);">{{ cat.count }}</span>
              </div>
              <div style="display:flex; flex-direction:column; gap:8px;">
                <sc-for list="{{ cat.items }}" as="it" hint-placeholder-count="3">

                  </button>
                </sc-for>
              </div>
            </div>
          </sc-for>

        </sc-if>

        <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">

        </div>
      </sc-if>

      <div aria-hidden="true" style="position:absolute; inset:0; pointer-events:none; z-index:20; opacity:0.06; mix-blend-mode:overlay; background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E'); background-size:160px 160px;"></div>

    </sc-if>
  </div>
</div>

<!-- ═══ FILTER SHEET (filter-by-Apply) ═══ -->

        <sc-for list="{{ equipChips }}" as="c" hint-placeholder-count="5">
          <button type="button" onClick="{{ c.onToggle }}" style="padding:8px 14px; border-radius:var(--fl-radius-pill); border:1px solid {{ c.borderColor }}; background:{{ c.bg }}; color:{{ c.color }}; font-size:12.5px; font-weight:600; cursor:pointer;">{{ c.label }}</button>
        </sc-for>
      </div>
    </div>
    <div>

      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <sc-for list="{{ muscleChips }}" as="c" hint-placeholder-count="6">
          <button type="button" onClick="{{ c.onToggle }}" style="padding:8px 14px; border-radius:var(--fl-radius-pill); border:1px solid {{ c.borderColor }}; background:{{ c.bg }}; color:{{ c.color }}; font-size:12.5px; font-weight:600; cursor:pointer;">{{ c.label }}</button>

    </div>

          <button type="button" onClick="{{ c.onToggle }}" style="padding:8px 14px; border-radius:var(--fl-radius-pill); border:1px solid {{ c.borderColor }}; background:{{ c.bg }}; color:{{ c.color }}; font-size:12.5px; font-weight:600; cursor:pointer;">{{ c.label }}</button>

      confirmLabel,
      confirmBg: confirmDisabled ? 'var(--fl-bronze-fill-disabled)' : 'var(--fl-bronze-fill)',
      confirmBorder: confirmDisabled ? 'var(--fl-bronze-border-disabled)' : 'var(--fl-bronze-metal-border)',
      confirmColor: confirmDisabled ? 'var(--fl-text-tertiary)' : '#F7F5F1',
      confirmCursor: confirmDisabled ? 'default' : 'pointer',
      confirmShadow: confirmDisabled ? 'none' : 'var(--fl-bronze-metal-top-rim), var(--fl-shadow-card)',
      onConfirm: () => { if (isBuilder) { const items = s.picked.map((k) => byKey[k]).filter(Boolean); if (isWorkoutAdd && isFresh) { try { localStorage.setItem('forge_workout_launch_context_v1', JSON.stringify({ sourceType: 'freestyle', at: Date.now() })); } catch (e) {} } this._commitBuilderMulti(items, commitCtx); return; } if (!selectedEx) return; if (isReplace) this.setState({ persistOpen: true }); else this._commit(selectedEx, commitCtx); },

      // filter sheet
      filterOpen: s.filterOpen,
      onCloseFilter: () => this.setState({ filterOpen: false }),
      equipChips,
      muscleChips,
      diffChips,
      typeChips,
      applyLabel: draftCount ? 'Apply · ' + draftCount : 'Apply',
      onApplyFilter: () => this.setState({ appliedEquip: this.state.draftEquip.slice(), appliedType: this.state.draftType.slice(), appliedMuscle: this.state.draftMuscle.slice(), appliedDiff: this.state.draftDiff.slice(), filterOpen: false }),
      onResetFilter: () => this.setState({ draftEquip: [], draftType: [], draftMuscle: [], draftDiff: [] }),

      // persistence sheet
      persistOpen: s.persistOpen,
      onClosePersist: () => this.setState({ persistOpen: false }),
      persistTitle: isReplace ? 'Apply replacement' : 'Add exercise',
      persistBlurb: selectedEx ? (isReplace ? 'Swap ' + replacingName + ' for ' + selectedEx.name + '.' : 'Add ' + selectedEx.name + ' to this workout.') : '',
      onPersistSession: () => this._commit(selectedEx, commitCtx),
      onPersistFuture: () => this._commit(selectedEx, commitCtx),

      // success toast + undo
      toastOpen: !!s.toast,
      toastText: s.toast ? (isReplace ? (replacingName + ' replaced with ' + s.toast.to) : ('Added ' + s.toast.to)) : '',
      onUndo: () => { if (this._navT) clearTimeout(this._navT); this.setState({ toast: null }); },
    };
  }
}
</script>
</body>
</html>
