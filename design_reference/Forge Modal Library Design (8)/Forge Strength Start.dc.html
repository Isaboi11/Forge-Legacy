<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/tokens/foundation.css">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/styles.css">
  <script src="forge-theme.js"></script>
<script>
  (function () {
    var SRC = "_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/_ds_bundle.js";
    function inject() { if (window.__flBundleInjected) return; window.__flBundleInjected = true; var s = document.createElement("script"); s.src = SRC; document.head.appendChild(s); }
    if (window.React && window.ReactDOM) { inject(); return; }
    var tries = 0; var iv = setInterval(function () { if ((window.React && window.ReactDOM) || ++tries > 600) { clearInterval(iv); inject(); } }, 25);
  })();
</script>
<script src="forge-symbols.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background: var(--fl-bg-atmospheric); background-attachment: fixed; color: var(--fl-text-primary); font-family: var(--fl-font-sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--fl-bronze-primary); text-decoration: none; }
  a:hover { color: var(--fl-bronze-bright); }
  @keyframes ssRise { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes ssToast { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; } }
</style>
</helmet>
<div style="min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:30px 16px;">
  <div data-screen-label="W-8b Start Strength" style="width:404px; max-width:100%; height:868px; position:relative; border-radius:32px; border:1px solid var(--fl-charcoal-600); background:linear-gradient(rgba(5,5,5,0.32), rgba(5,5,5,0.32)), #050505 url('assets/forge-slate.png') center center / cover no-repeat; box-shadow:var(--fl-shadow-ambient); overflow:hidden; display:flex; flex-direction:column;">

    <sc-if value="{{ notReady }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--fl-bg-primary);">
        <span style="width:40px; height:40px; border-radius:var(--fl-radius-md); background:var(--fl-bronze-metallic); display:flex; align-items:center; justify-content:center; color:#1A1206; box-shadow:var(--fl-glow-subtle);"><svg viewBox="0 0 24 24" style="width:62%;height:62%;display:block" fill="currentColor"><path d="M10.9 3.2H13.1V15H10.9Z"/><path d="M7.6 7.1L9.6 5.8V15H7.6Z"/><path d="M16.4 7.1L14.4 5.8V15H16.4Z"/><path d="M6.8 15.4H17.2V16.2H6.8Z"/><path d="M5.6 16.6H18.4V17.4H5.6Z"/><path d="M4.4 17.8H19.6V18.6H4.4Z"/></svg></span>
      </div>
    </sc-if>

    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">

      <!-- header -->
      <div style="flex:none; height:56px; display:flex; align-items:center; gap:6px; padding:0 8px; border-bottom:1px solid var(--fl-charcoal-700);">
        <button type="button" onClick="{{ back }}" aria-label="Back" style="width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; background:transparent; border:none; cursor:pointer; color:var(--fl-text-secondary);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <span style="flex:1; font-size:11px; font-weight:700; letter-spacing:2.4px; text-transform:uppercase; color:var(--fl-text-primary);">Strength</span>
        <span style="width:44px;"></span>
      </div>

      <div style="flex:1; min-height:0; overflow-y:auto; padding:26px 22px 30px;">
        <span style="display:block; font-family:var(--fl-font-display); font-size:26px; font-weight:600; letter-spacing:-0.3px; line-height:1.08; color:var(--fl-text-primary); animation:ssRise 700ms var(--fl-ease-out, ease-out) both;">How do you want to lift?</span>
        <p style="margin:9px 0 24px; font-size:13.5px; line-height:1.5; color:var(--fl-text-secondary); max-width:288px; text-wrap:pretty; animation:ssRise 800ms var(--fl-ease-out, ease-out) both; animation-delay:60ms;">A one-off session — pick a starting point. Everything you log lands in your record.</p>

        <div style="display:flex; flex-direction:column; gap:12px; animation:ssRise 900ms var(--fl-ease-out, ease-out) both; animation-delay:120ms;">
          <sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
            <div role="button" tabindex="0" aria-label="{{ o.a11y }}" onClick="{{ o.onClick }}" style="{{ o.cardStyle }}" style-hover="{{ o.hoverStyle }}">
              <span style="width:46px; height:46px; flex:none; border-radius:var(--fl-radius-round); border:1px solid {{ o.ringBorder }}; background:{{ o.ringBg }}; display:flex; align-items:center; justify-content:center; color:{{ o.iconColor }};">{{ o.icon }}</span>
              <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;">
                <span style="font-size:15.5px; font-weight:600; color:var(--fl-text-primary);">{{ o.title }}<sc-if value="{{ o.soon }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block; margin-left:8px; vertical-align:middle; padding:2px 7px; border-radius:999px; border:1px solid var(--fl-charcoal-500); font-size:8px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:var(--fl-text-tertiary);">Soon</span></sc-if></span>
                <span style="font-size:12.5px; line-height:1.45; color:var(--fl-text-secondary); text-wrap:pretty;">{{ o.sub }}</span>
              </div>
              <sc-if value="{{ o.live }}" hint-placeholder-val="{{ true }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--fl-bronze-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M9 6l6 6-6 6"></path></svg>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>

      <sc-if value="{{ toastOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; left:16px; right:16px; bottom:26px; z-index:40; display:flex; align-items:center; gap:11px; padding:13px 16px; border-radius:var(--fl-radius-md); background:#17130d; border:1px solid var(--fl-bronze-border-subtle); box-shadow:var(--fl-shadow-float); animation:ssToast 220ms var(--fl-ease-out, ease-out) both;">
          <span style="flex:1; font-size:13px; line-height:1.4; color:var(--fl-text-secondary);">{{ toastMsg }}</span>
        </div>
      </sc-if>

    </sc-if>

    <div style="position:absolute; inset:0; pointer-events:none; z-index:20; opacity:0.05; mix-blend-mode:overlay; background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E'); background-size:160px 160px;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:404,&quot;height&quot;:868}}">
class Component extends DCLogic {
  state = { ready: false, toast: null };

  componentDidMount() {
    this._poll = () => {
      const r = typeof React !== 'undefined' && React && React.createElement;
      const fs = typeof window !== 'undefined' && window.ForgeSymbols;
      if (r && fs) this.setState({ ready: true });
      else this._t = setTimeout(this._poll, 40);
    };
    this._poll();
  }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); if (this._toastT) clearTimeout(this._toastT); }
  _toast(msg) { this.setState({ toast: msg }); if (this._toastT) clearTimeout(this._toastT); this._toastT = setTimeout(() => this.setState({ toast: null }), 2800); }

  renderVals() {
    if (!this.state.ready || typeof React === 'undefined' || !React.createElement) {
      return { ready: false, notReady: true };
    }
    const FS = window.ForgeSymbols;
    const ico = (id) => FS.create(React, id, { size: 22, strokeWidth: 1.7 });
    const go = (href) => () => { window.location.href = href; };

    const cardBase = 'display:flex; align-items:center; gap:14px; padding:16px 16px; border-radius:var(--fl-radius-xl); transition:border-color 180ms var(--fl-ease-out, ease-out), background 180ms var(--fl-ease-out, ease-out), transform 180ms var(--fl-ease-out, ease-out);';

    const mk = (o) => ({
      key: o.id, title: o.title, sub: o.sub, icon: ico(o.symbol), live: !!o.route || !!o.onClick,
      soon: !o.route && !o.onClick,
      a11y: o.title + '. ' + o.sub,
      onClick: o.onClick ? o.onClick : (o.route ? go(o.route) : () => this._toast('Build-as-you-go logging is coming soon.')),
      cardStyle: cardBase + ((o.route || o.onClick)
        ? ' cursor:pointer; background:var(--fl-bg-primary); border:1px solid var(--fl-bronze-border); box-shadow:var(--fl-shadow-card-soft);'
        : ' cursor:default; background:var(--fl-surface-recessed); border:1px solid var(--fl-charcoal-700);'),
      hoverStyle: (o.route || o.onClick) ? 'border-color:var(--fl-bronze-primary); background:var(--fl-hover-wash); transform:translateY(-2px);' : '',
      ringBorder: (o.route || o.onClick) ? 'var(--fl-bronze-border)' : 'var(--fl-charcoal-600)',
      ringBg: (o.route || o.onClick) ? 'var(--fl-icon-container-bg)' : 'transparent',
      iconColor: (o.route || o.onClick) ? 'var(--fl-icon-bronze)' : 'var(--fl-charcoal-500)',
    });

    const options = [
      mk({ id: 'template', title: 'From a template', sub: 'Start a workout you\u2019ve saved \u2014 or one built by Forge.', symbol: 'notes', route: 'Forge%20Workout%20Templates.dc.html' }),
      mk({ id: 'build', title: 'Build it first', sub: 'Plan every exercise, then start the session.', symbol: 'dumbbell', route: 'Forge%20Free%20Workout%20Builder.dc.html' }),
      mk({ id: 'freestyle', title: 'Build as you go', sub: 'Pick your first move, then add more as you lift.', symbol: 'spark', route: 'Forge%20Exercise%20Picker.dc.html#o=workoutadd&fresh=1' }),
    ];

    return {
      ready: true, notReady: false,
      options,
      back: () => { window.location.href = 'Forge%20Programs%20Catalog.dc.html'; },
      toastOpen: !!this.state.toast, toastMsg: this.state.toast || '',
    };
  }
}
</script>
</body>
</html>
