              <button type="button" onClick="{{ c.onTap }}" style="padding:8px 14px; border-radius:var(--fl-radius-pill); border:1px solid {{ c.border }}; background:{{ c.bg }}; color:{{ c.ink }}; font-size:12.5px; font-weight:600; white-space:nowrap; cursor:pointer;">{{ c.label }}</button>

        </sc-if>
      </div>

      <!-- footer · save -->
      <div style="flex:none; padding:12px 18px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--fl-charcoal-700); background:linear-gradient(180deg, rgba(6,7,8,0.4), rgba(6,7,8,0.86)); position:relative; z-index:5;">
        <sc-if value="{{ saveDisabled }}" hint-placeholder-val="{{ true }}">
          <span style="display:flex; align-items:center; gap:8px; margin-bottom:11px; font-size:12px; color:var(--fl-text-tertiary);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>Give your exercise a name to save.</span>
        </sc-if>

      </div>

      <sc-if value="{{ deleteOpen }}" hint-placeholder-val="{{ false }}">

          <h2 style="margin:0 0 8px; font-family:var(--fl-font-display); font-size:21px; font-weight:700; color:var(--fl-text-primary);">Delete this exercise?</h2>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: false, form: null, deleteOpen: false };

  componentDidMount() {
    this._poll = () => {
      const r = typeof React !== 'undefined' && React && React.createElement;
      const ns = typeof window !== 'undefined' && window.ForgeLegacyVisualFoundation_5368b2;
      const store = typeof window !== 'undefined' && window.ForgeCustomExercises;
      if (r && ns && store) { this._boot(); this.setState({ ready: true }); }
      else this._t = setTimeout(this._poll, 40);
    };
    this._poll();
  }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); }

  _id() { try { return new URLSearchParams(window.location.search).get('id') || ''; } catch (e) { return ''; } }
  _boot() {
    const id = this._id();
    const STD = ['Barbell', 'Dumbbell', 'Kettlebell', 'Cable', 'Machine', 'Band', 'Bodyweight', 'Custom'];
    let form = { id: null, name: '', cat: 'Other', equip: 'Custom', equipCustom: '', type: 'Compound', muscles: [], env: ['Gym'], notes: '' };
    if (id) {
      const r = window.ForgeCustomExercises.get(id);
      if (r) {
        const stdEquip = STD.indexOf(r.equip) >= 0;
        form = { id: r.id, name: r.name, cat: r.cat || 'Other', equip: stdEquip ? r.equip : 'Custom', equipCustom: stdEquip ? '' : (r.equip || ''), type: r.type || 'Compound', muscles: (r.muscles || []).slice(), env: (r.env || []).slice(), notes: r.notes || '' };
      }
    }
    this.setState({ form });
  }
  _set(patch) { this.setState((s) => ({ form: Object.assign({}, s.form, patch) })); }
  _val(e) { return (e && e.target && typeof e.target.value === 'string') ? e.target.value : e; }
  _toggle(list, v) { return list.indexOf(v) >= 0 ? list.filter((x) => x !== v) : list.concat([v]); }

  renderVals() {
    if (!this.state.ready || !this.state.form) return { ready: false, notReady: true };
    const f = this.state.form;

    const chip = (v, active, onTap, label) => ({
      label: label || v, onTap,
      border: active ? 'var(--fl-bronze-metal-border)' : 'var(--fl-charcoal-600)',
      bg: active ? 'var(--fl-bronze-tint)' : 'var(--fl-surface-recessed)',
      ink: active ? 'var(--fl-bronze-bright)' : 'var(--fl-text-secondary)',
    });
    const CATS = ['Chest', 'Back', 'Shoulders', 'Legs', 'Arms', 'Core', 'Conditioning', 'Full Body', 'Other'];
    const EQUIP = ['Barbell', 'Dumbbell', 'Kettlebell', 'Cable', 'Machine', 'Band', 'Bodyweight', 'Custom'];
    const TYPES = ['Compound', 'Isolation', 'Other'];
    const MUSCLES = ['Chest', 'Upper Chest', 'Back', 'Lats', 'Shoulders', 'Side Delts', 'Rear Delts', 'Biceps', 'Triceps', 'Forearms', 'Traps', 'Quads', 'Glutes', 'Hamstrings', 'Core', 'Abs'];
    const ENV = ['Gym', 'Home', 'Outside'];

    const catChips = CATS.map((v) => chip(v, f.cat === v, () => this._set({ cat: v })));
    const equipChips = EQUIP.map((v) => chip(v, f.equip === v, () => this._set({ equip: v })));
    const typeChips = TYPES.map((v) => chip(v, f.type === v, () => this._set({ type: v })));
    const muscleChips = MUSCLES.map((v) => chip(v, f.muscles.indexOf(v) >= 0, () => this._set({ muscles: this._toggle(f.muscles, v) })));
    const envChips = ENV.map((v) => chip(v, f.env.indexOf(v) >= 0, () => this._set({ env: this._toggle(f.env, v) })));

    const nameOk = !!f.name.trim();

    return {
      ready: true, notReady: false,
      headerTitle: f.id ? 'Edit Exercise' : 'New Exercise',
      isEdit: !!f.id,
      name: f.name, onName: (e) => this._set({ name: this._val(e) }),
      notes: f.notes, onNotes: (e) => this._set({ notes: this._val(e) }),
      showCustomEquip: f.equip === 'Custom',
      equipCustom: f.equipCustom || '', onEquipCustom: (e) => this._set({ equipCustom: this._val(e) }),
      catChips, equipChips, typeChips, muscleChips, envChips,
      saveDisabled: !nameOk,
      saveLabel: f.id ? 'Save Changes' : 'Create Exercise',
      saveBg: nameOk ? 'var(--fl-bronze-fill)' : 'var(--fl-bronze-fill-disabled)',
      saveBorder: nameOk ? 'var(--fl-bronze-metal-border)' : 'var(--fl-bronze-border-disabled)',
      saveColor: nameOk ? '#F7F5F1' : 'var(--fl-text-tertiary)',
      saveCursor: nameOk ? 'pointer' : 'default',
      saveShadow: nameOk ? 'var(--fl-bronze-metal-top-rim), var(--fl-shadow-card)' : 'none',
      onSave: () => {
        if (!nameOk) return;
        const equip = f.equip === 'Custom' ? (f.equipCustom.trim() || 'Custom') : f.equip;
        window.ForgeCustomExercises.save({ id: f.id || undefined, name: f.name.trim(), cat: f.cat, equip: equip, type: f.type, muscles: f.muscles, env: f.env.length ? f.env : ['Gym'], notes: f.notes.trim() });
        window.location.href = 'Forge%20Exercise%20Library.dc.html';
      },
      onCancel: () => { if ((function(){try{return !!document.referrer&&new URL(document.referrer).origin===window.location.origin;}catch(e){return false;}})()) window.history.back(); else window.location.href = 'Forge%20Exercise%20Library.dc.html'; },
      onDelete: () => this.setState({ deleteOpen: true }),
      deleteOpen: this.state.deleteOpen,
      deleteMsg: '“' + (f.name || 'This exercise') + '” will be removed from your custom exercises. This can’t be undone.',
      onCancelDelete: () => this.setState({ deleteOpen: false }),
      onConfirmDelete: () => { if (f.id) window.ForgeCustomExercises.remove(f.id); window.location.href = 'Forge%20Exercise%20Library.dc.html'; },
    };
  }
}
</script>
