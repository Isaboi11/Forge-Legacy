<script>

<script src="forge-symbols.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background: var(--fl-bg-atmospheric); background-attachment: fixed; color: var(--fl-text-primary); font-family: var(--fl-font-sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--fl-bronze-primary); text-decoration: none; }
  a:hover { color: var(--fl-bronze-bright); }
  @keyframes atpRise { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes atpToast { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; } }
</style>
</helmet>
<div style="min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:30px 16px;">
  <div data-screen-label="W-8 Activity Type Picker" style="width:404px; max-width:100%; height:868px; position:relative; border-radius:32px; border:1px solid var(--fl-charcoal-600); background:linear-gradient(rgba(5,5,5,0.32), rgba(5,5,5,0.32)), #050505 url('assets/forge-slate.png') center center / cover no-repeat; box-shadow:var(--fl-shadow-ambient); overflow:hidden; display:flex; flex-direction:column;">

    <sc-if value="{{ notReady }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--fl-bg-primary);">
        <span style="width:40px; height:40px; border-radius:var(--fl-radius-md); background:var(--fl-bronze-metallic); display:flex; align-items:center; justify-content:center; color:#1A1206; box-shadow:var(--fl-glow-subtle);"><svg viewBox="0 0 24 24" style="width:62%;height:62%;display:block" fill="currentColor"><path d="M10.9 3.2H13.1V15H10.9Z"/><path d="M7.6 7.1L9.6 5.8V15H7.6Z"/><path d="M16.4 7.1L14.4 5.8V15H16.4Z"/><path d="M6.8 15.4H17.2V16.2H6.8Z"/><path d="M5.6 16.6H18.4V17.4H5.6Z"/><path d="M4.4 17.8H19.6V18.6H4.4Z"/></svg></span>
      </div>
    </sc-if>

    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">

      <!-- header -->
      <div style="flex:none; height:56px; display:flex; align-items:center; gap:6px; padding:0 8px; border-bottom:1px solid var(--fl-charcoal-700);">
        <button type="button" onClick="{{ back }}" aria-label="Back" style="width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; background:transparent; border:none; cursor:pointer; color:var(--fl-text-secondary);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <span style="flex:1; font-size:11px; font-weight:700; letter-spacing:2.4px; text-transform:uppercase; color:var(--fl-text-primary);">Start Activity</span>
        <span style="width:44px;"></span>
      </div>

      <div style="flex:1; min-height:0; overflow-y:auto; padding:26px 22px 30px;">
        <span style="display:block; font-family:var(--fl-font-display); font-size:26px; font-weight:600; letter-spacing:-0.3px; line-height:1.08; color:var(--fl-text-primary); animation:atpRise 700ms var(--fl-ease-out, ease-out) both;">What are you training?</span>
        <p style="margin:9px 0 22px; font-size:13.5px; line-height:1.5; color:var(--fl-text-secondary); max-width:280px; text-wrap:pretty; animation:atpRise 800ms var(--fl-ease-out, ease-out) both; animation-delay:60ms;">Choose an activity to begin. Every session is logged to your record.</p>

        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:11px; animation:atpRise 900ms var(--fl-ease-out, ease-out) both; animation-delay:120ms;">
          <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="9">
            <div role="button" tabindex="0" aria-label="{{ t.a11y }}" onClick="{{ t.onClick }}" style="{{ t.tileStyle }}" style-hover="{{ t.hoverStyle }}">
              <sc-if value="{{ t.soon }}" hint-placeholder-val="{{ false }}">
                <span style="position:absolute; top:8px; right:8px; padding:2px 6px; border-radius:999px; border:1px solid var(--fl-charcoal-500); font-size:8px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:var(--fl-text-tertiary);">Soon</span>
              </sc-if>
              <span style="width:46px; height:46px; border-radius:var(--fl-radius-round); display:flex; align-items:center; justify-content:center; border:1px solid {{ t.ringBorder }}; background:{{ t.ringBg }}; color:{{ t.iconColor }}; box-shadow:{{ t.ringGlow }};">{{ t.icon }}</span>
              <span style="font-size:12.5px; font-weight:600; letter-spacing:0.1px; color:{{ t.labelColor }};">{{ t.label }}</span>
            </div>
          </sc-for>
        </div>

      </div>

      <sc-if value="{{ toastOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; left:16px; right:16px; bottom:26px; z-index:40; display:flex; align-items:center; gap:11px; padding:13px 16px; border-radius:var(--fl-radius-md); background:#17130d; border:1px solid var(--fl-bronze-border-subtle); box-shadow:var(--fl-shadow-float); animation:atpToast 220ms var(--fl-ease-out, ease-out) both;">
          <span style="flex:1; font-size:13px; line-height:1.4; color:var(--fl-text-secondary);">{{ toastMsg }}</span>
        </div>
      </sc-if>

    </sc-if>

    <!-- grain -->
    <div style="position:absolute; inset:0; pointer-events:none; z-index:20; opacity:0.05; mix-blend-mode:overlay; background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E'); background-size:160px 160px;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:404,&quot;height&quot;:868}}">
class Component extends DCLogic {
  state = { ready: false, toast: null };

  componentDidMount() {
    this._poll = () => {
      const r = typeof React !== 'undefined' && React && React.createElement;
      const fs = typeof window !== 'undefined' && window.ForgeSymbols;
      const ns = typeof window !== 'undefined' && window.ForgeLegacyVisualFoundation_5368b2;
      if (r && fs && ns) this.setState({ ready: true });
      else this._t = setTimeout(this._poll, 40);
    };
    this._poll();
  }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); if (this._toastT) clearTimeout(this._toastT); }
  _toast(msg) { this.setState({ toast: msg }); if (this._toastT) clearTimeout(this._toastT); this._toastT = setTimeout(() => this.setState({ toast: null }), 2600); }

  renderVals() {
    if (!this.state.ready || typeof React === 'undefined' || !React.createElement) {
      return { ready: false, notReady: true };
    }
    const FS = window.ForgeSymbols;
    const ico = (id) => FS.create(React, id, { size: 24, strokeWidth: 1.7 });
    const go = (href) => () => { window.location.href = href; };

    // 9 activity types (blueprint order). `route` set = built execution flow; else queued.
    const TYPES = [
      { id: 'strength', label: 'Strength', symbol: 'dumbbell',   route: 'Forge%20Strength%20Start.dc.html' },
      { id: 'run',      label: 'Run',      symbol: 'shoe',       route: 'Forge%20Active%20Run.dc.html' },
      { id: 'walk',     label: 'Walk',     symbol: 'footprints', route: 'Forge%20Active%20Run.dc.html?type=walk' },
      { id: 'bike',     label: 'Bike',     symbol: 'bicycle',    route: 'Forge%20Active%20Run.dc.html?type=bike' },
      { id: 'swim',     label: 'Swim',     symbol: 'swim' },
      { id: 'hiit',     label: 'HIIT',     symbol: 'glove' },
      { id: 'mobility', label: 'Mobility', symbol: 'lotus' },
      { id: 'yoga',     label: 'Yoga',     symbol: 'lotus' },
      { id: 'other',    label: 'Other',    symbol: 'mountain' },
    ];

    const tileBase = 'position:relative; aspect-ratio:1 / 1; border-radius:var(--fl-radius-xl); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; transition:border-color 180ms var(--fl-ease-out, ease-out), background 180ms var(--fl-ease-out, ease-out), transform 180ms var(--fl-ease-out, ease-out);';

    const tiles = TYPES.map((t) => {
      const live = !!t.route;
      return {
        key: t.id,
        label: t.label,
        icon: ico(t.symbol),
        soon: !live,
        a11y: live ? ('Start ' + t.label) : (t.label + ' — coming soon'),
        onClick: live ? go(t.route) : () => this._toast(t.label + ' tracking is coming soon.'),
        tileStyle: tileBase + (live
          ? ' cursor:pointer; background:var(--fl-bg-primary); border:1px solid var(--fl-bronze-border); box-shadow:var(--fl-shadow-card-soft);'
          : ' cursor:default; background:var(--fl-surface-recessed); border:1px solid var(--fl-charcoal-700);'),
        hoverStyle: live
          ? 'border-color:var(--fl-bronze-primary); background:var(--fl-hover-wash); transform:translateY(-2px);'
          : '',
        ringBorder: live ? 'var(--fl-bronze-border)' : 'var(--fl-charcoal-600)',
        ringBg: live ? 'var(--fl-icon-container-bg)' : 'transparent',
        ringGlow: live ? 'var(--fl-glow-subtle)' : 'none',
        iconColor: live ? 'var(--fl-icon-bronze)' : 'var(--fl-charcoal-500)',
        labelColor: live ? 'var(--fl-text-primary)' : 'var(--fl-text-tertiary)',
      };
    });

    return {
      ready: true, notReady: false,
      tiles,
      back: () => { window.location.href = 'Forge%20Programs%20Catalog.dc.html'; },
      toastOpen: !!this.state.toast, toastMsg: this.state.toast || '',
    };
  }
}
</script>
