<style>
  * { box-sizing: border-box; }
  body { margin:0; background: var(--fl-bg-atmospheric); background-attachment: fixed; color: var(--fl-text-primary); font-family: var(--fl-font-sans); -webkit-font-smoothing: antialiased; }

  a:hover { color: var(--fl-bronze-bright); }
  @keyframes wiRise { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes wiPulse { 0%,100% { opacity:0.4; transform:scale(1); } 50% { opacity:1; transform:scale(1.12); } }

<div style="min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:30px 16px;">
  <div data-screen-label="Shared Workout Invite" style="width:404px; max-width:100%; height:868px; position:relative; border-radius:32px; border:1px solid var(--fl-charcoal-600); background:linear-gradient(rgba(5,5,5,0.34), rgba(5,5,5,0.34)), #050505 url('assets/forge-slate.png') center center / cover no-repeat; box-shadow:var(--fl-shadow-ambient); overflow:hidden; display:flex; flex-direction:column;">

    <sc-if value="{{ notReady }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--fl-bg-primary);">
        <span style="width:40px; height:40px; border-radius:var(--fl-radius-md); background:var(--fl-bronze-metallic); display:flex; align-items:center; justify-content:center; color:#1A1206; box-shadow:var(--fl-glow-subtle);"><svg viewBox="0 0 24 24" style="width:62%;height:62%;display:block" fill="currentColor"><path d="M10.9 3.2H13.1V15H10.9Z"/><path d="M7.6 7.1L9.6 5.8V15H7.6Z"/><path d="M16.4 7.1L14.4 5.8V15H16.4Z"/><path d="M6.8 15.4H17.2V16.2H6.8Z"/><path d="M5.6 16.6H18.4V17.4H5.6Z"/><path d="M4.4 17.8H19.6V18.6H4.4Z"/></svg></span>
      </div>
    </sc-if>

    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
      <!-- app bar -->
      <div style="flex:none; height:56px; display:flex; align-items:center; gap:6px; padding:0 8px; border-bottom:1px solid var(--fl-charcoal-700);">
        <button type="button" onClick="{{ dismiss }}" aria-label="Back" style="width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; background:transparent; border:none; cursor:pointer; color:var(--fl-text-secondary);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <span style="flex:1; font-size:11px; font-weight:700; letter-spacing:2.4px; text-transform:uppercase; color:var(--fl-text-primary);">Workout Invite</span>
        <span style="width:44px;"></span>
      </div>

      <div class="fl-scroll" style="flex:1; min-height:0; overflow-y:auto; padding:34px 24px 24px; display:flex; flex-direction:column; align-items:center; text-align:center;">
        <!-- sender -->
        <div style="position:relative; animation:wiRise 700ms var(--fl-ease-out, ease-out) both;">
          <span style="position:absolute; inset:-7px; border-radius:var(--fl-radius-round); background:var(--fl-glow-ember); opacity:0.5; animation:wiPulse 2.8s ease-in-out infinite;"></span>
          <span style="position:relative; width:88px; height:88px; border-radius:var(--fl-radius-round); background:{{ fromTint }}; border:1px solid var(--fl-bronze-border); display:flex; align-items:center; justify-content:center; font-family:var(--fl-font-display); font-size:30px; font-weight:700; color:#1A1206;">{{ fromInitials }}</span>
        </div>
        <span style="margin-top:22px; font-size:12px; font-weight:600; letter-spacing:1.6px; text-transform:uppercase; color:var(--fl-text-tertiary); animation:wiRise 800ms var(--fl-ease-out, ease-out) both; animation-delay:60ms;">Shared Workout</span>
        <h1 style="margin:10px 0 0; font-family:var(--fl-font-display); font-size:27px; line-height:1.15; font-weight:600; letter-spacing:-0.2px; max-width:300px; text-wrap:pretty; animation:wiRise 900ms var(--fl-ease-out, ease-out) both; animation-delay:120ms;">{{ headline }}</h1>

        <!-- workout card -->
        <div style="margin-top:26px; width:100%; border-radius:var(--fl-radius-xl); border:1px solid var(--fl-bronze-border); background:var(--fl-card-hero-wash), var(--fl-bg-primary); box-shadow:var(--fl-shadow-card-hero); padding:20px 18px; text-align:left; animation:wiRise 1000ms var(--fl-ease-out, ease-out) both; animation-delay:180ms;">
          <div style="display:flex; align-items:center; gap:14px;">
            <span style="width:50px; height:50px; flex:none; border-radius:var(--fl-radius-round); border:1px solid var(--fl-bronze-border); background:var(--fl-icon-container-bg); box-shadow:var(--fl-glow-subtle); display:flex; align-items:center; justify-content:center; color:var(--fl-icon-bronze);">{{ workoutIcon }}</span>
            <div style="flex:1; min-width:0;">
              <span style="display:block; font-family:var(--fl-font-display); font-size:20px; font-weight:600; letter-spacing:-0.2px; color:var(--fl-text-primary);">{{ workoutName }}</span>
              <span style="display:block; margin-top:2px; font-size:12.5px; color:var(--fl-text-secondary);">{{ workoutSub }}</span>
            </div>
          </div>
          <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
            <div style="margin-top:16px; padding:12px 14px; border-radius:var(--fl-radius-md); background:var(--fl-surface-recessed); border-left:2px solid var(--fl-bronze-border);">
              <span style="font-size:13px; line-height:1.5; color:var(--fl-text-secondary); font-style:italic;">“{{ note }}”</span>
            </div>
          </sc-if>
        </div>

        <!-- how it works -->
        <div style="margin-top:18px; display:flex; align-items:flex-start; gap:11px; width:100%; padding:14px 15px; border-radius:var(--fl-radius-lg); border:1px solid var(--fl-charcoal-700); background:rgba(255,255,255,0.015); text-align:left; animation:wiRise 1050ms var(--fl-ease-out, ease-out) both; animation-delay:240ms;">
          <span style="flex:none; color:var(--fl-bronze-bright); display:flex; margin-top:1px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>
          <span style="flex:1; font-size:12.5px; line-height:1.5; color:var(--fl-text-secondary); text-wrap:pretty;">You’ll each do your own copy — log your own sets on your own screen. At the end you’ll both be credited for training together.</span>
        </div>
      </div>

      <!-- actions -->
      <div style="flex:none; padding:14px 22px 24px; border-top:1px solid var(--fl-charcoal-700); display:flex; flex-direction:column; gap:10px;">
        <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Button" variant="primary" full-width="{{ true }}" on-click="{{ accept }}" hint-size="100%,56px">{{ acceptLabel }}</x-import>
        <x-import component-from-global-scope="ForgeLegacyVisualFoundation_5368b2.Button" variant="text" full-width="{{ true }}" on-click="{{ decline }}" hint-size="100%,44px">Decline</x-import>
      </div>
    </sc-if>

    <div style="position:absolute; inset:0; pointer-events:none; z-index:20; opacity:0.05; mix-blend-mode:overlay; background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E'); background-size:160px 160px;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:404,&quot;height&quot;:868}}">
class Component extends DCLogic {
  state = { ready: false };

  componentDidMount() {
    this._poll = () => {
      const r = typeof React !== 'undefined' && React && React.createElement;
      const ns = typeof window !== 'undefined' && window.ForgeLegacyVisualFoundation_5368b2;
      const fs = typeof window !== 'undefined' && window.ForgeSymbols;
      if (r && ns && fs) this.setState({ ready: true });
      else this._t = setTimeout(this._poll, 40);
    };
    this._poll();
  }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); }

  _invite() {
    let inv = null;
    try { inv = JSON.parse(localStorage.getItem('forge_shared_invite_v1') || 'null'); } catch (e) {}
    // Fallback demo invite so the screen is viewable standalone.
    return inv || { fromName: 'Marcus Vale', fromId: 'marcus', workoutName: 'Leg Day A', workoutSub: 'Powerbuilding II · 6 exercises', note: 'Leg day together before the weekend?' };
  }

  renderVals() {
    if (!this.state.ready || typeof React === 'undefined' || !React.createElement) {
      return { ready: false, notReady: true };
    }
    const FS = window.ForgeSymbols;
    const inv = this._invite();
    const initials = (inv.fromName || '?').split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    const TINTS = { marcus: 'oklch(0.82 0.06 40)', dana: 'oklch(0.80 0.09 60)', theo: 'oklch(0.80 0.05 95)', lena: 'oklch(0.83 0.07 48)', nadia: 'oklch(0.80 0.06 28)', quinn: 'oklch(0.82 0.05 72)' };

    const accept = () => {
      try {
        localStorage.setItem('forge_shared_session_v1', JSON.stringify({ role: 'guest', partnerIds: [inv.fromId], workoutName: inv.workoutName }));
        localStorage.removeItem('forge_shared_invite_v1');
      } catch (e) {}
      window.location.href = 'Forge%20Active%20Workout.dc.html';
    };
    const decline = () => {
      try { localStorage.removeItem('forge_shared_invite_v1'); } catch (e) {}
      window.location.href = 'Forge%20Home.dc.html';
    };

    return {
      ready: true, notReady: false,
      fromInitials: initials,
      fromTint: TINTS[inv.fromId] || 'var(--fl-bronze-metallic)',
      headline: (inv.fromName || 'A friend') + ' wants to train with you',
      workoutIcon: FS.create(React, 'dumbbell', { size: 24, strokeWidth: 1.7 }),
      workoutName: inv.workoutName || 'Workout',
      workoutSub: inv.workoutSub || 'Shared session',
      hasNote: !!inv.note, note: inv.note || '',
      acceptLabel: 'Accept & Start',
      accept: accept,
      decline: decline,
      dismiss: decline,
    };
  }
}
</script>
</body>
