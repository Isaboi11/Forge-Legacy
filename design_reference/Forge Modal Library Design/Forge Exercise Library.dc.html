<!DOCTYPE html>
<html>
<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&display=swap">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/tokens/foundation.css">
<link rel="stylesheet" href="_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/styles.css">
  <script src="forge-theme.js"></script>
  <script src="forge-exercise-catalog.js"></script>
  <script src="forge-homegym.js"></script>
  <script src="forge-custom-exercises.js"></script>
<script>
  (function () {
    var SRC = "_ds/forge-legacy-use-this-5368b220-9e78-4104-bd8b-969c39e84346/_ds_bundle.js";
    function inject() { if (window.__flBundleInjected) return; window.__flBundleInjected = true; var s = document.createElement("script"); s.src = SRC; document.head.appendChild(s); }
    if (window.React && window.ReactDOM) { inject(); return; }
    var tries = 0; var iv = setInterval(function () { if ((window.React && window.ReactDOM) || ++tries > 600) { clearInterval(iv); inject(); } }, 25);
  })();
</script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background: var(--fl-bg-atmospheric); background-attachment: fixed; color: var(--fl-text-primary); font-family: var(--fl-font-sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--fl-bronze-primary); text-decoration: none; }
  a:hover { color: var(--fl-bronze-bright); }
  .fl-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .fl-scroll { scrollbar-width: none; }
  .xl-search { width:100%; border:1px solid var(--fl-charcoal-600); background:var(--fl-surface-recessed); color:var(--fl-text-primary); font-family:var(--fl-font-sans); font-size:14px; border-radius:var(--fl-radius-md); padding:11px 13px 11px 40px; outline:none; transition:border-color 160ms ease; }
  .xl-search::placeholder { color:var(--fl-text-tertiary); }
  .xl-search:focus { border-color:var(--fl-bronze-border); }
  @keyframes flFade { from { opacity:0; } to { opacity:1; } }
  @keyframes flRise { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
</style>
</helmet>
<div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:16px; padding:26px 16px 40px;">

  <!-- review switcher -->
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; width:404px; max-width:100%;">
    <span style="font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--fl-text-tertiary);">W-21 · states (review)</span>
    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:6px;">
      <sc-for list="{{ viewChips }}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{ c.set }}" style="padding:6px 12px; border-radius:999px; border:1px solid {{ c.border }}; background:{{ c.bg }}; color:{{ c.ink }}; font-size:11px; font-weight:600; font-family:var(--fl-font-sans); cursor:pointer; transition:all 140ms ease;">{{ c.label }}</button>
      </sc-for>
    </div>
  </div>

  <div data-screen-label="W-21 Exercise Library" style="width:404px; max-width:100%; height:868px; position:relative; border-radius:32px; border:1px solid var(--fl-charcoal-600); background:linear-gradient(rgba(6,7,8,0.30), rgba(6,7,8,0.30)), #050505 url('assets/forge-slate.png') center center / cover no-repeat; box-shadow:var(--fl-shadow-ambient); overflow:hidden; display:flex; flex-direction:column;">

    <sc-if value="{{ notReady }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--fl-bg-primary);">
        <span style="width:40px; height:40px; border-radius:var(--fl-radius-md); background:var(--fl-bronze-metallic); display:flex; align-items:center; justify-content:center; color:#1A1206; font-weight:800; font-family:var(--fl-font-display); font-size:22px; box-shadow:var(--fl-glow-subtle);"><svg viewBox="0 0 24 24" style="width:62%;height:62%;display:block" fill="currentColor"><path d="M10.9 3.2H13.1V15H10.9Z"/><path d="M7.6 7.1L9.6 5.8V15H7.6Z"/><path d="M16.4 7.1L14.4 5.8V15H16.4Z"/><path d="M6.8 15.4H17.2V16.2H6.8Z"/><path d="M5.6 16.6H18.4V17.4H5.6Z"/><path d="M4.4 17.8H19.6V18.6H4.4Z"/></svg></span>
      </div>
    </sc-if>

    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">

      <!-- app bar -->
      <div style="flex:none; padding:0 12px; border-bottom:1px solid var(--fl-charcoal-700);">
        <div style="height:56px; display:flex; align-items:center; gap:2px;">
          <button type="button" onClick="{{ onLeft }}" aria-label="Back" style="width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:transparent; border:none; color:var(--fl-text-secondary); cursor:pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
          <span style="font-size:16px; font-weight:600; letter-spacing:0.2px; color:var(--fl-text-primary);">{{ title }}</span>
        </div>
        <!-- search + filter -->
        <div style="display:flex; align-items:center; gap:8px; padding:0 4px 12px;">
          <div style="position:relative; flex:1; min-width:0;">
            <span style="position:absolute; left:14px; top:50%; transform:translateY(-50%); display:inline-flex; color:var(--fl-text-tertiary); pointer-events:none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4-4"></path></svg></span>
            <input class="xl-search" type="text" value="{{ query }}" placeholder="Search exercises" onInput="{{ onSearch }}" />
          </div>
          <button type="button" onClick="{{ openFilter }}" aria-label="Filter" style="position:relative; flex:none; width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:var(--fl-radius-md); border:1px solid {{ filterBtnBorder }}; background:{{ filterBtnBg }}; color:{{ filterBtnInk }}; cursor:pointer; transition:all 150ms ease;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M6 12h12M10 19h4"></path></svg>
            <sc-if value="{{ hasFilters }}" hint-placeholder-val="{{ false }}"><span style="position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:var(--fl-bronze-metallic); color:#1A1206; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:var(--fl-glow-subtle);">{{ filterCount }}</span></sc-if>
          </button>
        </div>
        <!-- active filter chips -->
        <sc-if value="{{ hasFilters }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-wrap:wrap; gap:6px; padding:0 4px 12px;">
            <sc-for list="{{ filterChips }}" as="f" hint-placeholder-count="2">
              <button type="button" onClick="{{ f.remove }}" style="display:inline-flex; align-items:center; gap:6px; padding:5px 8px 5px 11px; border-radius:var(--fl-radius-pill); border:1px solid var(--fl-bronze-border); background:var(--fl-bronze-tint); color:var(--fl-bronze-bright); font-size:11.5px; font-weight:600; font-family:var(--fl-font-sans); cursor:pointer;">{{ f.label }}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
            </sc-for>
            <button type="button" onClick="{{ clearFilters }}" style="padding:5px 10px; background:transparent; border:none; cursor:pointer; font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--fl-text-tertiary);">Clear</button>
          </div>
        </sc-if>
      </div>

      <div class="fl-scroll" style="flex:1; min-height:0; overflow-y:auto; padding:16px 20px 34px;">

        <!-- ═══════════ FLAT MODE · search results / category drill / view-all ═══════════ -->
        <sc-if value="{{ flatMode }}" hint-placeholder-val="{{ false }}">
          <div style="animation:flFade 260ms var(--fl-ease-out) both;">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:0 2px 12px;">
              <span style="font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--fl-text-bronze-label);">{{ flatTitle }}</span>
              <span style="font-size:11px; font-weight:600; color:var(--fl-text-tertiary); opacity:0.6;">{{ flatCount }}</span>
            </div>
            <sc-if value="{{ flatEmpty }}" hint-placeholder-val="{{ false }}">
              <div style="padding:40px 20px; text-align:center;">
                <span style="display:block; font-family:var(--fl-font-display); font-size:18px; color:var(--fl-text-secondary);">Nothing found</span>
                <span style="display:block; margin-top:6px; font-size:13px; color:var(--fl-text-tertiary);">Try a different name or muscle.</span>
              </div>
            </sc-if>
            <div style="display:flex; flex-direction:column; gap:8px;">
              <sc-for list="{{ flatRows }}" as="r" hint-placeholder-count="6">
                <button type="button" onClick="{{ r.open }}" style="width:100%; display:flex; align-items:center; gap:13px; padding:11px 13px; border-radius:var(--fl-radius-lg); border:1px solid var(--fl-charcoal-700); background:var(--fl-surface-card); cursor:pointer; text-align:left; transition:border-color 150ms ease;" style-hover="border-color:var(--fl-bronze-border-subtle);">
                  <span style="flex:none; width:40px; height:40px; border-radius:var(--fl-radius-round); border:1px solid var(--fl-bronze-border-subtle); background:var(--fl-icon-container-bg); display:flex; align-items:center; justify-content:center; color:var(--fl-icon-bronze);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9v6"></path><path d="M17.5 9v6"></path><path d="M4 10.5v3"></path><path d="M20 10.5v3"></path><path d="M6.5 12h11"></path></svg></span>
                  <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
                    <span style="font-size:14.5px; font-weight:600; color:var(--fl-text-primary);">{{ r.name }}</span>
                    <span style="font-size:11.5px; color:var(--fl-text-tertiary);">{{ r.meta }}</span>
                  </span>
                  <span role="button" tabindex="0" onClick="{{ r.toggleFav }}" aria-label="Favorite" style="flex:none; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:{{ r.starColor }};">
                    <sc-if value="{{ r.fav }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.1 1.2 6L12 16.9 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></sc-if>
                    <sc-if value="{{ r.notFav }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.1 1.2 6L12 16.9 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></sc-if>
                  </span>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <!-- ═══════════ HUB MODE ═══════════ -->
        <sc-if value="{{ hubMode }}" hint-placeholder-val="{{ true }}">
          <div style="animation:flFade 300ms var(--fl-ease-out) both;">

            <!-- Favorites + Recently Used (preview rows) -->
            <sc-for list="{{ topSections }}" as="sec" hint-placeholder-count="2">
              <div style="margin-bottom:26px;">
                <div style="display:flex; align-items:center; justify-content:space-between; padding:0 2px 11px;">
                  <span style="display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--fl-text-bronze-label);"><span style="display:inline-flex; color:var(--fl-icon-bronze);">{{ sec.icon }}</span>{{ sec.title }}</span>
                  <button type="button" onClick="{{ sec.viewAll }}" style="background:transparent; border:none; cursor:pointer; font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--fl-bronze-primary);">View all</button>
                </div>
                <div style="display:flex; flex-direction:column; gap:8px;">
                  <sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="3">
                    <button type="button" onClick="{{ r.open }}" style="width:100%; display:flex; align-items:center; gap:13px; padding:11px 13px; border-radius:var(--fl-radius-lg); border:1px solid var(--fl-charcoal-700); background:var(--fl-surface-card); cursor:pointer; text-align:left; transition:border-color 150ms ease;" style-hover="border-color:var(--fl-bronze-border-subtle);">
                      <span style="flex:none; width:40px; height:40px; border-radius:var(--fl-radius-round); border:1px solid var(--fl-bronze-border-subtle); background:var(--fl-icon-container-bg); display:flex; align-items:center; justify-content:center; color:var(--fl-icon-bronze);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9v6"></path><path d="M17.5 9v6"></path><path d="M4 10.5v3"></path><path d="M20 10.5v3"></path><path d="M6.5 12h11"></path></svg></span>
                      <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
                        <span style="font-size:14.5px; font-weight:600; color:var(--fl-text-primary);">{{ r.name }}</span>
                        <span style="font-size:11.5px; color:var(--fl-text-tertiary);">{{ r.meta }}</span>
                      </span>
                      <span role="button" tabindex="0" onClick="{{ r.toggleFav }}" aria-label="Favorite" style="flex:none; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:{{ r.starColor }};">
                        <sc-if value="{{ r.fav }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.1 1.2 6L12 16.9 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></sc-if>
                        <sc-if value="{{ r.notFav }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.1 1.2 6L12 16.9 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></sc-if>
                      </span>
                    </button>
                  </sc-for>
                </div>
              </div>
            </sc-for>

            <!-- Categories grid -->
            <div style="margin-bottom:26px;">
              <span style="display:block; padding:0 2px 12px; font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--fl-text-bronze-label);">Browse by category</span>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="6">
                  <button type="button" onClick="{{ cat.open }}" style="position:relative; overflow:hidden; display:flex; flex-direction:column; gap:5px; padding:16px 15px; border-radius:var(--fl-radius-lg); border:1px solid var(--fl-charcoal-700); background:var(--fl-surface-card); cursor:pointer; text-align:left; transition:border-color 150ms ease, transform 150ms ease;" style-hover="border-color:var(--fl-bronze-border-subtle); transform:translateY(-1px);">
                    <span aria-hidden="true" style="position:absolute; right:-8px; bottom:-10px; color:var(--fl-charcoal-600); opacity:0.5;"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9v6"></path><path d="M17.5 9v6"></path><path d="M4 10.5v3"></path><path d="M20 10.5v3"></path><path d="M6.5 12h11"></path></svg></span>
                    <span style="position:relative; font-family:var(--fl-font-display); font-size:18px; font-weight:600; letter-spacing:-0.2px; color:var(--fl-text-primary);">{{ cat.name }}</span>
                    <span style="position:relative; font-size:11.5px; color:var(--fl-text-tertiary);">{{ cat.count }}</span>
                  </button>
                </sc-for>
              </div>
            </div>

            <!-- Custom Exercises -->
            <div style="margin-bottom:6px;">
              <span style="display:block; padding:0 2px 11px; font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--fl-text-bronze-label);">Custom Exercises</span>
              <div style="display:flex; flex-direction:column; gap:8px;">
                <sc-for list="{{ customRows }}" as="r" hint-placeholder-count="2">
                  <button type="button" onClick="{{ r.open }}" style="width:100%; display:flex; align-items:center; gap:13px; padding:11px 13px; border-radius:var(--fl-radius-lg); border:1px solid var(--fl-charcoal-700); background:var(--fl-surface-card); cursor:pointer; text-align:left; transition:border-color 150ms ease;" style-hover="border-color:var(--fl-bronze-border-subtle);">
                    <span style="flex:none; width:40px; height:40px; border-radius:var(--fl-radius-round); border:1px solid var(--fl-bronze-border-subtle); background:var(--fl-icon-container-bg); display:flex; align-items:center; justify-content:center; color:var(--fl-icon-bronze);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9v6"></path><path d="M17.5 9v6"></path><path d="M4 10.5v3"></path><path d="M20 10.5v3"></path><path d="M6.5 12h11"></path></svg></span>
                    <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
                      <span style="font-size:14.5px; font-weight:600; color:var(--fl-text-primary);">{{ r.name }}</span>
                      <span style="font-size:11.5px; color:var(--fl-text-tertiary);">{{ r.meta }}</span>
                    </span>
                    <span role="button" tabindex="0" onClick="{{ r.toggleFav }}" aria-label="Favorite" style="flex:none; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:{{ r.starColor }};">
                      <sc-if value="{{ r.fav }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.1 1.2 6L12 16.9 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></sc-if>
                      <sc-if value="{{ r.notFav }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.1 1.2 6L12 16.9 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></sc-if>
                    </span>
                  </button>
                </sc-for>
                <button type="button" onClick="{{ onCreate }}" style="width:100%; display:flex; align-items:center; gap:13px; padding:13px; border-radius:var(--fl-radius-lg); border:1px dashed var(--fl-bronze-border-subtle); background:rgba(196,142,74,0.04); cursor:pointer; text-align:left; transition:background 150ms ease;" style-hover="background:rgba(196,142,74,0.09);">
                  <span style="flex:none; width:40px; height:40px; border-radius:var(--fl-radius-round); border:1px solid var(--fl-bronze-border); background:var(--fl-bronze-tint); display:flex; align-items:center; justify-content:center; color:var(--fl-bronze-bright);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
                  <span style="flex:1; min-width:0; font-size:14px; font-weight:600; color:var(--fl-bronze-bright);">Create Custom Exercise</span>
                </button>
              </div>
            </div>

          </div>
        </sc-if>

      </div>

      <!-- ═══ FILTER · bottom sheet ═══ -->
      <sc-if value="{{ filterOpen }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ closeFilter }}" style="position:absolute; inset:0; z-index:45; background:rgba(0,0,0,0.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); animation:flFade 200ms ease both;"></div>
        <div role="dialog" aria-modal="true" style="position:absolute; left:0; right:0; bottom:0; z-index:46; max-height:82%; display:flex; flex-direction:column; padding:12px 22px 22px; border-radius:24px 24px 0 0; background:#17130d; border:1px solid var(--fl-bronze-border-subtle); border-bottom:none; box-shadow:var(--fl-shadow-float); animation:flRise 280ms var(--fl-ease-out) both;">
          <div style="width:36px; height:4px; border-radius:999px; background:var(--fl-charcoal-600); margin:0 auto 16px; flex:none;"></div>
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; flex:none;">
            <span style="font-family:var(--fl-font-display); font-size:20px; font-weight:600; letter-spacing:-0.2px; color:var(--fl-text-primary);">Filter</span>
            <button type="button" onClick="{{ clearFilters }}" style="background:transparent; border:none; cursor:pointer; font-size:11px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:{{ resetInk }};">Reset</button>
          </div>
          <div class="fl-scroll" style="flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:20px; padding:10px 0 4px;">
            <sc-for list="{{ filterGroups }}" as="g" hint-placeholder-count="4">
              <div>
                <span style="display:block; font-size:9.5px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--fl-text-bronze-label); margin-bottom:11px;">{{ g.label }}</span>
                <div style="display:flex; flex-wrap:wrap; gap:8px;">
                  <sc-for list="{{ g.options }}" as="o" hint-placeholder-count="3">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:436,&quot;height&quot;:940},&quot;screenState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hub&quot;,&quot;category&quot;,&quot;search&quot;],&quot;default&quot;:&quot;hub&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Review&quot;}}">

      { key: 'lunge', name: 'Walking Lunge', cat: 'Legs', equip: 'Dumbbell', type: 'Compound', muscles: ['Quads', 'Glutes'] },

    };

    );
