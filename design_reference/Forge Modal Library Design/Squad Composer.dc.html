      case 'challenge': fields = [field('challenge', 'Competition', 'Forge League \u00b7 Week 3'), field('body', 'Progress update', 'Where we stand and what closes it\u2026', true, 3)]; break;
      case 'traintogether': fields = [field('when', 'When & where', 'Sat \u00b7 9:00 AM \u00b7 Main Floor'), field('body', 'Details (optional)', 'Warm-up starts sharp\u2026', true, 2)]; break;
      case 'discussion': fields = [field('body', 'Note to the squad', 'Keep it short\u2026', true, 4)]; break;
      case 'announcement': fields = [field('body', 'Announcement', 'Pins to the top of the squad feed\u2026', true, 4)]; break;
    }

    const TYPE = PS.type(S.type) || {};
    const valid = this._valid();
    const postBtnStyle = { flex: 'none', padding: '9px 18px', borderRadius: 'var(--fl-radius-md)', border: '1px solid ' + (valid ? 'var(--fl-bronze-border)' : 'var(--fl-charcoal-600)'), background: valid ? 'var(--fl-bronze-fill)' : 'var(--fl-charcoal-800)', color: valid ? 'var(--fl-bronze-bright)' : 'var(--fl-text-tertiary)', fontSize: '13.5px', fontWeight: 700, letterSpacing: '0.3px', cursor: valid ? 'pointer' : 'default', boxShadow: valid ? 'var(--fl-glow-subtle)' : 'none' };
    const toastColor = S.toastTone === 'positive' ? '#6E8E74' : 'var(--fl-icon-bronze)';
    const capGate = TYPE.gate === 'captain';

    return {
      ready: true, notReady: false,
      isPick: S.step === 'pick', isCompose: S.step === 'compose',
      leftIcon: w(S.step === 'compose' ? sv('M15 5l-7 7 7 7', 19, 2) : sv('M6 6l12 12M18 6L6 18', 19, 2)),
      onLeftAction: () => { if (S.step === 'compose') this.setState({ step: 'pick', type: null }); else this._close(); },
      barTitle: S.step === 'compose' ? (TYPE.label || 'Post') : 'Post to Squad',
      barSub: S.step === 'compose' ? squadName : 'Training, recognition & coordination',
      squadName: squadName,
      submitPost: () => this._submit(), postBtnStyle,
      memberTypes, capTypes, viewerCanCap: canCap,
      lockIcon, shieldIcon,
      typeIcon: w(typeGlyph(TYPE.icon || 'message', 12, 1.9)), typeLabel: TYPE.label || '',
      hasMediaField, mediaPlaceholder, fields,
      showAchPreview, achValuePreview: (F.value || '').trim() || '315 lb', achExercisePreview: (F.exercise || '').trim() || 'Bench Press', achLabelPreview: (F.label || 'Squad PR').trim(),
      showGateNote: capGate && S.step === 'compose', gateNote: 'You\u2019re posting a squad announcement as ' + (role === 'owner' ? 'the owner' : 'the captain') + '. It pins to the top of the squad feed for every member.',
      toastOpen: !!S.toastMsg, toastMsg: S.toastMsg || '', toastIcon: w(ic('squad', 17, 1.9)), toastIconColor: toastColor
    };
  }

  _close() { if ((function(){try{return !!document.referrer&&new URL(document.referrer).origin===window.location.origin;}catch(e){return false;}})()) window.history.back(); else window.location.href = 'Squad%20Detail.dc.html'; }
}
</script>
