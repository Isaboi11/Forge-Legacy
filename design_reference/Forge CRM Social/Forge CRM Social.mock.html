<title>Forge CRM Social</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap">
<style>
/* Layout: the existing Business CRM shell (236px sidebar, top bar, 1240px column). Information sits on the
   ground under a small uppercase label and a hairline; only the detail panel and editors get a surface.
   Bronze marks what is selected and the one primary action per view. Palettes are crm-theme.tsx, unchanged. */
:root{
  --bg:#FAF8F4;--side:#F3EFE8;--ink:#1E1B17;--ink2:#4E4943;--ink3:#6A645B;--line:#E4DDD2;--hover:rgba(60,45,25,.035);
  --tip:#FFFDFA;--track:#ECE6DC;--panel:#FFFDFA;--panelBd:#E1DAD0;--field:#FFFFFF;--fieldBd:#D6CEC2;
  --btn1:#BA8654;--btn2:#BA8654;--btnBd:#A67644;--btnInk:#17110A;--brz:#9A6934;--brzTint:rgba(166,118,68,.13);--brzBd:rgba(154,105,52,.5);
  --good:#3C7549;--crit:#A6473A;--critTint:rgba(166,71,58,.10);--warn:#8A5C2C;--warnTint:rgba(166,118,68,.12);
  --area:.16;--stage:#E9E3D9;--badgeInk:#FFFFFF;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0E10;--side:#090B0C;--ink:#EFE9DF;--ink2:#BDB6AB;--ink3:#8C867D;--line:rgba(239,233,223,.08);--hover:rgba(239,233,223,.035);
  --tip:#1A1C1F;--track:rgba(239,233,223,.07);--panel:#131517;--panelBd:rgba(239,233,223,.07);--field:#0F1113;--fieldBd:rgba(239,233,223,.14);
  --btn1:#A47744;--btn2:#7F5B33;--btnBd:rgba(205,160,99,.55);--btnInk:#FBF1E2;--brz:#C9975A;--brzTint:rgba(191,143,79,.13);--brzBd:rgba(201,151,90,.5);
  --good:#8DBB97;--crit:#DE8878;--critTint:rgba(210,122,108,.14);--warn:#D6A866;--warnTint:rgba(214,168,102,.12);
  --area:.22;--stage:#050607;--badgeInk:#0C0E10;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0E10;--side:#090B0C;--ink:#EFE9DF;--ink2:#BDB6AB;--ink3:#8C867D;--line:rgba(239,233,223,.08);--hover:rgba(239,233,223,.035);
  --tip:#1A1C1F;--track:rgba(239,233,223,.07);--panel:#131517;--panelBd:rgba(239,233,223,.07);--field:#0F1113;--fieldBd:rgba(239,233,223,.14);
  --btn1:#A47744;--btn2:#7F5B33;--btnBd:rgba(205,160,99,.55);--btnInk:#FBF1E2;--brz:#C9975A;--brzTint:rgba(191,143,79,.13);--brzBd:rgba(201,151,90,.5);
  --good:#8DBB97;--crit:#DE8878;--critTint:rgba(210,122,108,.14);--warn:#D6A866;--warnTint:rgba(214,168,102,.12);
  --area:.22;--stage:#050607;--badgeInk:#0C0E10;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--brz);outline-offset:2px}
.num{font-variant-numeric:tabular-nums lining-nums}
.serif{font-family:var(--display)}

/* ── Desktop shell ── */
.shell{display:flex;height:100%}
.side{width:236px;flex:none;background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:28px 16px;display:flex;flex-direction:column;gap:26px}
.brand{padding:0 10px;display:flex;flex-direction:column;gap:4px}
.brand b{font-family:var(--display);font-weight:600;font-size:21px}
.brand span{font-size:12.5px;color:var(--ink3)}
.grp{display:flex;flex-direction:column;gap:2px}
.grp h6{margin:0;padding:0 10px 6px;font-size:10.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink3)}
.nav{height:34px;padding:0 10px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--ink2);width:100%}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--brzTint);color:var(--brz);font-weight:600}
.nav.old{color:var(--ink3)}
.nav i{font-style:normal;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--critTint);color:var(--crit)}
.mocknote{margin-top:auto;padding:0 10px;font-size:12px;line-height:1.5;color:var(--ink3)}
.main{flex:1;min-width:0;overflow-y:auto;padding:28px 56px 72px}
.wrap{max-width:1240px;margin:0 auto}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;min-height:36px}
.crumb{font-size:13px;color:var(--ink3)}.crumb b{font-weight:400;color:var(--ink2)}
.segs{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;border:1px solid var(--line)}
.seg button{padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink3)}
.seg button.on{background:var(--hover);color:var(--ink)}
.ph{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px 32px;padding:24px 0 28px}
.ph h1{margin:0;font-family:var(--display);font-weight:600;font-size:36px;line-height:41px;letter-spacing:-.3px;text-wrap:balance}
.ph p{margin:8px 0 0;max-width:760px;font-size:16px;line-height:25.6px;color:var(--ink2)}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--fieldBd);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn.sm{height:34px;padding:0 14px;border-radius:9px;font-size:13px}
.btn.pri{background:linear-gradient(var(--btn1),var(--btn2));border-color:var(--btnBd);color:var(--btnInk);padding:0 18px}
.btn.del{border-color:var(--line);color:var(--crit)}
.btn.del.armed{background:var(--crit);border-color:var(--crit);color:var(--badgeInk)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--hover)}
.chip.on{border-color:var(--brzBd);background:var(--brzTint);color:var(--brz)}
.chip small{font-size:13px;color:var(--ink3)}
.opt{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2)}
.opt.on{border-color:var(--brzBd);background:var(--brzTint);color:var(--brz)}
.opt.on.good{color:var(--good)}.opt.on.crit{color:var(--crit)}.opt.on.warn{color:var(--warn)}
.banner{margin-bottom:24px;padding:12px 16px;border-radius:10px;background:var(--warnTint);font-size:14px;line-height:21.7px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.ulink{font-size:13.5px;font-weight:600;border-bottom:1px solid var(--fieldBd)}
.sl{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sl span{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink3)}
.sl a,.sl button{font-size:13px;font-weight:500;color:var(--ink2)}
.sub{margin:12px 0 0;font-size:13px;line-height:19px;color:var(--ink3)}
.foot{margin:14px 0 0;font-size:12.5px;line-height:19.4px;color:var(--ink3)}
.footnote{margin:48px 0 0;max-width:760px;font-size:12.5px;line-height:20px;color:var(--ink3)}
.hero{display:flex;gap:56px;padding-bottom:44px;align-items:flex-start}
.hero>.h1{flex:1;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.hero .lab{font-size:13px;color:var(--ink2)}
.hero .big{font-family:var(--display);font-weight:500;font-size:56px;line-height:59px}
.hero .hn{font-size:13.5px;font-weight:500;color:var(--ink3)}
.good{color:var(--good)!important}.bad{color:var(--crit)!important}.warnc{color:var(--warn)!important}
.figs{flex:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:36px}
.fig{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.fig b{font-family:var(--display);font-weight:500;font-size:24px;line-height:29px}
.fig small{font-size:12.5px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 56px;align-items:start}
.grid>.full{grid-column:1/-1}
.blk{min-width:0}
.rows>div{display:flex;gap:16px;align-items:baseline;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.rows .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.rows .l span{font-size:14px;color:var(--ink2)}
.rows .l small{font-size:12.5px;color:var(--ink3)}
.rows b{font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
.rows b.dim{color:var(--ink3);font-weight:500}
.bars{display:flex;flex-direction:column;gap:16px;padding-top:18px}
.bar .t{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:7px}
.bar .t span{font-size:14px;min-width:0}
.bar .t em{font-style:normal;font-size:13px;color:var(--ink3);white-space:nowrap}
.bar .t em b{font-size:14px;font-weight:600;color:var(--ink)}
.track{height:6px;border-radius:3px;background:var(--track);display:flex;overflow:hidden}
.track i{display:block;height:6px;background:var(--brz)}
.track i.soft{opacity:.38}
.tscroll{overflow-x:auto}
.tbl{min-width:680px}
.tr{display:grid;gap:16px;align-items:center;padding:0 10px;margin:0 -10px;border-bottom:1px solid var(--line);width:calc(100% + 20px)}
.tr.h{padding-top:12px;padding-bottom:8px;font-size:12px;color:var(--ink3)}
.tr.h button{font-size:12px;color:var(--ink3);text-align:right}
.tr.h button.on{color:var(--ink);font-weight:600}
.tr.r{padding-top:13px;padding-bottom:13px}
button.tr.r:hover{background:var(--hover)}
.tr.sel{background:var(--brzTint)}
.tr .ti{min-width:0;display:flex;flex-direction:column;gap:2px}
.tr .ti span{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .ti small{font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .n{text-align:right;font-size:14px}
.tr .m{font-size:13px;color:var(--ink2)}
.chart{position:relative;margin-top:20px}
.chart svg{display:block;overflow:visible}
.chart .gl{position:absolute;left:0;font-size:11px;color:var(--ink3)}
.chart .tipw{position:absolute;top:-6px;width:0;display:flex;justify-content:center;pointer-events:none}
.chart .tip{display:flex;gap:8px;padding:6px 10px;border-radius:8px;background:var(--tip);border:1px solid var(--line);white-space:nowrap;font-size:12.5px}
.chart .tip span{color:var(--ink3)}.chart .tip b{font-weight:600}
.cdates{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--ink3)}
.panel{padding:24px;border-radius:14px;background:var(--panel);border:1px solid var(--panelBd);display:flex;flex-direction:column;gap:18px}
.panel h2{margin:0;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.25;text-wrap:balance}
.panel h4,#phone h4{margin:0;font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink3)}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 0;min-width:0}
.field label{font-size:12.5px;color:var(--ink2)}
.in{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--fieldBd);background:var(--field);font-size:14px;width:100%;outline:none}
textarea.in{height:auto;min-height:72px;padding:10px 12px;line-height:21px;resize:vertical}
.in:focus{border-color:var(--brzBd)}
.frow{display:flex;gap:16px 24px;flex-wrap:wrap}
.two{display:flex;gap:40px;align-items:flex-start}
.two>.list{flex:1;min-width:0}
.two>.det{width:420px;flex:none;position:sticky;top:0}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;margin:20px 0 32px}
.pipe button{padding:14px 16px 13px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;position:relative}
.pipe button:hover{background:var(--hover)}
.pipe button.on{background:var(--brzTint);border-top-color:var(--brzBd)}
.pipe button b{font-family:var(--display);font-weight:500;font-size:26px;line-height:30px}
.pipe button span{font-size:13px;color:var(--ink2)}
.pipe button.on span{color:var(--brz);font-weight:600}
.pipe button:not(:last-child)::after{content:"›";position:absolute;right:6px;top:18px;color:var(--ink3);font-size:16px}
.capture{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.capture .in{flex:1;min-width:200px}
.grouph{margin-top:28px}
.grouph:first-child{margin-top:0}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--brzTint);color:var(--brz);white-space:nowrap}
.tag.good{background:transparent;border:1px solid var(--line);color:var(--good)}
.tag.crit{background:var(--critTint);color:var(--crit)}
.tag.warn{background:var(--warnTint);color:var(--warn)}
.tag.muted{background:var(--track);color:var(--ink2)}
.code{display:inline-block;min-width:24px;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:1px 4px;border-radius:4px;border:1px solid var(--fieldBd);color:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 76px;border-top:1px solid var(--line);margin-top:20px}
.cal .dow{padding:10px 8px 8px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line)}
.cal .day{min-height:104px;padding:8px 6px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px;min-width:0}
.cal .day .dn{font-size:12px;color:var(--ink3);padding:0 2px}
.cal .day.today .dn{color:var(--brz);font-weight:700}
.cal .day.past{background:var(--hover)}
.cal .wk{padding:8px 0 8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink3);display:flex;flex-direction:column;gap:2px}
.cal .wk b{font-size:14px;font-weight:600;color:var(--ink)}
.calit{display:flex;gap:6px;align-items:baseline;padding:4px 5px;border-radius:6px;font-size:12.5px;line-height:16px;color:var(--ink);width:100%;min-width:0}
.calit:hover{background:var(--hover)}
.calit.sel{background:var(--brzTint)}
.calit span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.calit.done{color:var(--ink3)}
.post{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.post .hd{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:14px}
.post .hd b{font-weight:600}.post .hd span{font-size:13px;color:var(--ink3)}
.lnk{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--ink2)}
.lnk code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;padding:4px 8px;border-radius:6px;background:var(--field);border:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.mini div{display:flex;flex-direction:column}
.mini b{font-size:15px;font-weight:600}
.mini small{font-size:11.5px;color:var(--ink3)}
.item{padding:15px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.item .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item .top b{font-size:15px;font-weight:600;min-width:0}
.item p{margin:0;font-size:14px;line-height:21.7px;color:var(--ink2)}
.item small{font-size:12.5px;color:var(--ink3)}
button.item{width:calc(100% + 20px);padding-left:10px;padding-right:10px;margin:0 -10px}
button.item:hover{background:var(--hover)}
.rule{padding:14px 0;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:500;font-size:18px;line-height:26px}
.toast{position:fixed;left:0;right:0;bottom:28px;display:flex;justify-content:center;pointer-events:none;z-index:60}
.toast div{padding:12px 18px;border-radius:12px;background:var(--tip);border:1px solid var(--panelBd);box-shadow:0 12px 32px rgba(0,0,0,.25);font-size:14px;max-width:calc(100% - 32px)}

@media (max-width:1179px){
  .main{padding:24px 32px 64px}
  .hero{flex-direction:column;gap:36px}.hero>.h1,.figs{align-self:stretch;flex:none}.figs{column-gap:24px}
  .grid{gap:48px 36px}
  .two{flex-direction:column-reverse;gap:28px}.two>.det{width:auto;position:static;align-self:stretch}
}

/* ── Phone CRM ── */
#stage{display:none;height:100%}
#phone{position:relative;height:100%;background:var(--bg);overflow:hidden}
body.pv .shell{display:none}
body.pv #stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--stage);padding:16px}
body.pv #phone{width:390px;max-width:100%;height:min(800px,calc(100% - 60px));border-radius:30px;border:1px solid var(--fieldBd)}
#backdesk{display:none}
body.pv #backdesk{display:inline-flex}
@media (max-width:899px){
  .shell{display:none}
  #stage,body.pv #stage{display:block;padding:0;background:var(--bg)}
  #phone,body.pv #phone{width:auto;height:100%;border-radius:0;border:0}
  #backdesk,body.pv #backdesk{display:none}
  .toast{bottom:150px}
}
.pfill{position:absolute;left:0;right:0;top:0;bottom:0}
.pscroll{position:absolute;left:0;right:0;top:0;bottom:83px;overflow-y:auto;padding:14px 16px 40px}
.pscroll.ov{bottom:74px;background:var(--bg)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;padding-bottom:10px;display:flex;background:var(--side);border-top:1px solid var(--line);z-index:4}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);position:relative}
.tabbar button.on{color:var(--brz)}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar i{position:absolute;top:8px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:var(--badgeInk);font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center}
.pback{font-size:15px;color:var(--ink2);min-height:36px;display:inline-flex;align-items:center}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.ptitle h1{margin:0;font-family:var(--display);font-weight:500;font-size:30px}
.psh{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 0;font-size:12px;font-weight:600;letter-spacing:.96px;text-transform:uppercase;color:var(--ink3)}
.psh button{font-size:13px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink2)}
.pmuted{font-size:13px;line-height:19px;color:var(--ink3);margin:8px 0 0}
.rseg{display:flex;gap:2px}
.rseg button{min-width:44px;height:36px;padding:0 8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink3);text-align:center}
.rseg button.on{background:var(--brzTint);color:var(--brz)}
.pchips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.pchip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);font-size:14px;color:var(--ink2);white-space:nowrap;flex:none}
.pchip.on{border-color:var(--brzBd);background:var(--brzTint);color:var(--brz)}
.pchip small{font-size:14px;opacity:.7}
.pseg{display:flex;padding:3px;border-radius:11px;background:var(--panel);border:1px solid var(--panelBd);margin-top:14px}
.pseg button{flex:1;height:38px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink3);text-align:center}
.pseg button.on{background:var(--brzTint);color:var(--brz)}

// Follower history, generated once so the chart and the figures agree.
function mkSeries(now, mean, seed){
  var s=seed, a=new Array(731), i;
  function r(){ s=(s*1664525+1013904223)%4294967296; return s/4294967296; }
  a[730]=now;
  for(i=730;i>0;i--){ var age=730-i, ramp=Math.pow(Math.max(0,1-age/420),2); var g=Math.round(mean*ramp*(0.35+1.3*r())+(r()>0.95?mean*ramp*3:0)); a[i-1]=Math.max(0,a[i]-g); }
  return a;
}

function folAt(plat,back){ return keys(plat).reduce(function(t,k){return t+FOL[k][730-back];},0); }

function postings(days){

function sumOf(list){

}

}

function niceMax(v){ if(!(v>0)) return 1; var p=Math.pow(10,Math.floor(Math.log10(v))); return Math.ceil(v/p*2)/2*p; }
function series(){ var days=DAYS[S.range], step=S.range==='1Y'?7:1, vals=[], ds=[], b;
  for(b=days-(days%step);b>=0;b-=step){ vals.push(folAt(S.plat,b)); ds.push(iso(addDays(-b))); } return {vals:vals,days:ds,weekly:step===7}; }
function drawChart(el){
  var w=el.clientWidth; if(!w) return;
  var CH=+el.getAttribute('data-h'), TOP=14, s=series(), n=s.vals.length, lo=Math.min.apply(null,s.vals), hi=Math.max.apply(null,s.vals);
  var base=Math.floor(lo*0.97/50)*50, max=base+niceMax((hi-base)*1.08);
  var pts=s.vals.map(function(v,i){ return {x:n>1?i/(n-1)*w:w/2,y:TOP+(1-(v-base)/(max-base))*(CH-TOP)}; });
  function cy(y){ return Math.min(CH,Math.max(TOP,y)); }

  for(i=0;i<pts.length-1;i++){ var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=' C'+(p1.x+(p2.x-p0.x)/6)+','+cy(p1.y+(p2.y-p0.y)/6)+' '+(p2.x-(p3.x-p1.x)/6)+','+cy(p2.y-(p3.y-p1.y)/6)+' '+p2.x+','+p2.y; }
  var grid=[base,(base+max)/2,max].map(function(v){ return {v:v,y:TOP+(1-(v-base)/(max-base))*(CH-TOP)}; });
  var gid='g'+Math.random().toString(36).slice(2), last=pts[pts.length-1], L=n-1, ticks=[0,Math.round(L/3),Math.round(2*L/3),L];
  var h='<svg width="'+w+'" height="'+(CH+4)+'" viewBox="0 0 '+w+' '+(CH+4)+'" role="img" aria-label="Followers over time"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--brz);stop-opacity:var(--area)"/><stop offset="1" style="stop-color:var(--brz);stop-opacity:0"/></linearGradient></defs>'+
    grid.map(function(g){return '<line x1="0" x2="'+w+'" y1="'+g.y+'" y2="'+g.y+'" style="stroke:var(--line)" stroke-width="1"/>';}).join('')+
    '<path d="'+d+' L'+w+','+CH+' L0,'+CH+' Z" fill="url(#'+gid+')"/><path d="'+d+'" fill="none" style="stroke:var(--brz)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<g class="hv" style="display:none"><line y1="8" y2="'+CH+'" style="stroke:var(--ink3)" stroke-width="1" stroke-dasharray="2 4"/><circle r="5" style="fill:var(--bg);stroke:var(--brz)" stroke-width="2"/></g>'+
    '<circle cx="'+last.x+'" cy="'+last.y+'" r="4" style="fill:var(--brz)"/></svg>'+
    grid.map(function(g){return '<span class="gl num" style="top:'+(g.y-17)+'px">'+int(g.v)+'</span>';}).join('')+
    '<div class="tipw" style="display:none"><div class="tip"><span></span><b class="num"></b></div></div>';
  el.innerHTML=h;
  var dates=el.nextElementSibling; if(!dates||!dates.classList.contains('cdates')){ dates=document.createElement('div'); dates.className='cdates'; el.parentNode.insertBefore(dates,el.nextSibling); }
  dates.innerHTML=ticks.map(function(i){return '<span>'+dl(s.days[i])+'</span>';}).join('');

  function move(e){ var r=el.getBoundingClientRect(), i=Math.max(0,Math.min(L,Math.round((e.clientX-r.left)/r.width*L))), p=pts[i];

    case 'ww': S.ww=v; break;
    case 'wm': S.wm=v; break;
    case 'setst': cur=current(); if(cur){ cur.st=v; msg='Moved to '+stName(v)+'.'; } break;
    case 'next': cur=current(); if(!cur) return; if(cur.st==='posted'){ toast('Saved.'); return; }
      cur.st=STAGES[STAGES.map(function(s){return s[0];}).indexOf(cur.st)+1][0]; msg='Moved to '+stName(cur.st)+'.'; break;
    case 'verdict': cur=current(); if(cur){ cur.lesson=cur.lesson||{tried:'',got:''}; cur.lesson.v=v; } break;
    case 'del': if(!S.armed){ S.armed=true; setTimeout(function(){ if(S.armed){ S.armed=false; render(true); } },3000); } else { V.splice(V.indexOf(byId(S.sel)),1); S.sel=null; S.armed=false; msg='Deleted.'; } break;
    case 'copy': (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){toast('Link copied.');},function(){toast(v);}); return;
    case 'addidea': var inp=document.getElementById('idea-in'), t=inp.value.trim(); if(!t){ inp.focus(); toast('Type the idea first.'); return; } S.sel=addIdea(t); S.view='pipe'; S.stage=null; msg='Idea added.'; break;
    case 'qidea': var q=QUESTIONS.filter(function(x){return x.id===v;})[0]; q.made=true; addIdea('Answer: “'+q.q+'”'); msg='Added to Ideas.'; break;
    case 'pview': S.ph.view=v; S.ph.ov=null; S.ph.sheet=false; keep=false; break;
    case 'pseg': S.ph.seg=v; break;
    case 'pov': S.ph.ov=v||null; break;
    case 'psheet': S.ph.sheet=!S.ph.sheet; break;
    case 'paddidea': var pi=document.getElementById('p-idea'), pt=pi.value.trim(); if(!pt){ pi.focus(); return; } addIdea(pt); S.ph.sheet=false; S.ph.view='content'; S.ph.seg='pipe'; S.stage='idea'; msg='Idea added.'; break;
  }
  render(keep);
  if(a==='pview'){ var ps=document.getElementById('pscroll'); if(ps) ps.scrollTop=0; }
  if(msg) toast(msg);
});
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.id==='idea-in'){ document.querySelector('[data-a="addidea"]').click(); } if(e.key==='Enter'&&e.target.id==='p-idea'){ document.querySelector('[data-a="paddidea"]').click(); } });
document.addEventListener('change',function(e){ var v=current(); if(!v) return; var m={'d-topic':'topic','d-hook':'hook','d-fmt':'fmt'}[e.target.id];
  if(m){ v[m]=e.target.value; render(true); } else if(e.target.id==='d-len'){ v.len=+e.target.value||v.len; } else if(e.target.id==='d-line'){ v.line=e.target.value; } else if(e.target.id==='d-notes'){ v.notes=e.target.value; }
  else if(e.target.id==='d-tried'||e.target.id==='d-got'){ v.lesson=v.lesson||{v:''}; v.lesson[e.target.id==='d-tried'?'tried':'got']=e.target.value; } });
var h0=(location.hash||'').slice(1); if(h0==='content'||h0==='playbook') S.page=h0;
render(false);
})();
</script>
